# The version catalogue of the backend build (17A section 3). Every version the build names is
# here and nowhere else: a plugin, a library outside Spring Boot's own version management, a
# tool a plugin runs. The build files refer to it as libs.versions.x, libs.plugins.x, libs.x.
#
# What is NOT here, on purpose: the libraries Spring Boot manages (starters, Flyway, the
# PostgreSQL driver, Jackson, JUnit ...). They have no version in the build files at all; the
# Spring Boot version decides them, so they move together and stay compatible.
#
# Changing a version: Dependabot proposes patch and minor updates every Monday. A version that
# 17A fixes (marked below) changes by change request, not by pull request alone.

[versions]
java = "21"                        # 17A: Java 21 LTS
spring-boot = "3.5.16"             # 17A: 3.3.x; CR-17A-2 accepted (architect, 2026-09-21): the supported 3.5 line.
spring-dependency-management = "1.1.7"
spring-modulith = "1.4.13"         # 1.4.x is the line that matches Spring Boot 3.5; moves with Spring Boot
kotlin = "2.0.21"                  # 17A: 2.0.x. The till consumes the shared engine: both move together.
archunit = "1.5.0"                 # 17A: 1.3+
jib = "3.5.4"
cyclonedx = "3.4.1"
openapi-generator = "7.25.0"
spotless = "8.10.2"
palantir-java-format = "2.74.0"    # the formatter Spotless runs

# Security patches ahead of Spring Boot. These two libraries ARE managed by Spring Boot; the
# entries below override its version (backend/app/build.gradle.kts sets tomcat.version and
# postgresql.version from them) because the vulnerability scan found advisories whose fix is
# newer than what Spring Boot 3.5.16 carries. An override leaves the set Spring tests
# together, so each one is temporary: `checkVersionOverrides` (part of `check`) fails the
# build as soon as Spring Boot manages the same version or a newer one, and the entry and its
# line in the build file are then deleted. Dependabot does not see these entries.
tomcat = "10.1.60"                 # Boot 3.5.16: 10.1.55. CVE-2026-65182, -65905, -68525 (CRITICAL), "fixed in 10.1.58", which was never published: 10.1.59 is the first release with the fix.
postgresql = "42.7.12"             # Boot 3.5.16: 42.7.11. CVE-2026-54291 (HIGH), fixed in 42.7.12.

# For the 19A kernel tickets. Spring Boot does not manage these three, so each names a
# version; the libraries Spring Boot does manage (the starters below, Caffeine) name none, as
# the header says. Verified on Maven Central on 21 September 2026.
icu4j = "78.3"                     # K-06. The latest release.
aws-sdk = "2.55.1"                 # K-09. The latest release of the AWS SDK v2 line.
shedlock = "6.10.0"                # K-12. The latest of the 6 line, which is built against Spring Framework 6.2, the one Spring Boot 3.5 carries. ShedLock 7 is built against Spring Framework 7 (Spring Boot 4) and is held in .github/dependabot.yml until this repository moves.
bouncycastle = "1.80"               # K-02. Spring Security's Argon2PasswordEncoder is a wrapper over Bouncy Castle's Argon2 (19A section 2: the till PIN hash); Spring Boot does not manage the library.

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core", version.ref = "spring-modulith" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test", version.ref = "spring-modulith" }
spring-modulith-docs = { module = "org.springframework.modulith:spring-modulith-docs", version.ref = "spring-modulith" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

# ---- Declared for the 19A kernel tickets, on nobody's class path yet -------------------------
# Four lanes build K-01 to K-13 in parallel and every one of them would otherwise add a line to
# this file at the same time. The libraries are named here once; the ticket in each comment is
# the one that adds the dependency to backend/app/build.gradle.kts. Until it does, an entry
# here changes nothing that is built or shipped: a catalogue entry is a name and a version,
# not a dependency.
#
# Two of them must NOT reach the application's class path before their ticket is ready to
# handle what they switch on, and that is why the ticket is named:
#   oauth2 resource server  brings Spring Security, whose default chain answers 401 to every
#                           endpoint, so the hello module and every test would fail at once
#   amqp                    brings a RabbitMQ connection factory and a health indicator, so
#                           /actuator/health turns DOWN wherever no broker runs
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }  # K-02 adds it, with the security configuration that keeps the endpoints open that must stay open
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }  # K-05 adds it, behind BrokerAdapter (AGENTS.md: no code couples to RabbitMQ), and only after the database-polling relay passes its tests
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }  # K-03 permission cache, K-11 configuration cache (19A sections 3 and 11)
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }  # K-06: ICU MessageFormat, NFC, collation, LATN digits (19A section 6)
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }  # K-09 imports this as a platform so the aws modules cannot drift apart
aws-sdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }  # K-09. The S3 protocol, not a vendor: 19A section 9 asks for a provider-neutral client with path-style addressing, which is what MinIO needs and what the same code gives on any other S3 service. MinIO's own io.minio client would tie the kernel to MinIO, which AGENTS.md forbids for the broker and the identity provider for the same reason.
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }  # K-12 job runner (19A section 12)
shedlock-provider-jdbc-template = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }  # K-12: the kernel.shedlock table, no second data store
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }  # K-02: the Argon2id implementation behind PinHasher
