spring:
  application:
    name: coop-erp-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/coop_erp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL:10}

  flyway:
    enabled: false

  modulith:
    events:
      republish-outstanding-events-on-restart: false

coop-erp:
  role: ${COOP_ERP_ROLE:web}
  business-timezone: Asia/Colombo

  migration:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/coop_erp}
    user: ${MIGRATION_USER:postgres}
    password: ${MIGRATION_PASSWORD:postgres}

management:
  endpoints:
    web:
      exposure:
        include: health,info