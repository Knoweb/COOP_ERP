spring:
  application:
    name: coop-erp-backend

  # One artefact, three roles (17A section 4.1): web, worker, ingest. COOP_ERP_ROLE names the
  # roles of this instance, as Spring profiles: "web" on a laptop, "web,worker" in the local
  # stack, one role per instance in production. A role changes which components start, never
  # the code: a component of one role carries @Profile("worker") (or web, or ingest).
  # Without the web role an instance serves health and metrics and nothing else
  # (kernel.internal.RoleHttpFilter).
  profiles:
    active: ${COOP_ERP_ROLE:web}

  # Rolling deployment (doc 14 section 1.3): on shutdown stop taking requests, let the ones in
  # flight finish, then stop.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  # The application user. Defaults match infra/compose (`make up`): through PgBouncer on 6432,
  # as coop_app, a member of app_rw and never a superuser, because a superuser bypasses
  # row-level security. prepareThreshold=0: PgBouncer pools per transaction, so server-side
  # prepared statements must stay off.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:6432/coop_erp?prepareThreshold=0}
    username: ${DB_USER:coop_app}
    password: ${DB_PASSWORD:coop_app}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL:10}

  # Entities map onto tables that Flyway created; Hibernate never creates or alters anything.
  # open-in-view off: a transaction ends where the handler or query ends, not when the HTTP
  # response has been written.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      # Time rule (AGENTS.md; 17A section 4.4): an instant is timestamptz in the database and
      # Instant in Java. This pins the JDBC layer to UTC, so the default time zone of a
      # developer machine or a server can never change what is written or read.
      hibernate.jdbc.time_zone: UTC
      # The validator on the class path checks requests against their OpenAPI slice, nothing
      # else. Hibernate would also run it on every entity it saves; entities carry no
      # constraint annotations, their rules are handler guards, so that is switched off.
      jakarta.persistence.validation.mode: none

  flyway:
    enabled: false

  modulith:
    events:
      republish-outstanding-events-on-restart: false

server:
  shutdown: graceful

coop-erp:
  role: ${COOP_ERP_ROLE:web}
  business-timezone: Asia/Colombo

  # The entity the platform itself acts as when no request is behind the work: a scheduled job
  # that must leave an audit record (a timed-out run, a numbering gap) records it in the OWN
  # scope of this entity, the Federation. Empty means: log only, audit nothing (19A section 12).
  system:
    entity-id: ${COOP_ERP_SYSTEM_ENTITY_ID:}

  # K-03b resolves every command's permission from M1's roles; it refuses only when this is
  # true. Off by default: on in compose, where the dev realm's users hold the roles of the dev
  # seed (seed/m1security/users.dev.sql); off in the module tests, which run as users of their own.
  security:
    enforce-permissions: ${COOP_ERP_ENFORCE_PERMISSIONS:false}
    # The OIDC provider (19A section 2), any one: the issuer its tokens carry (the public
    # address, the one the browser signed in at) and the JWKS the backend fetches the signing
    # keys from (inside compose, the provider's container address). The step-up address is
    # where the web shell sends a user whose second factor is not fresh enough (mfa.required).
    oidc:
      issuer: ${OIDC_ISSUER:http://localhost:8085/realms/coop}
      jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8085/realms/coop/protocol/openid-connect/certs}
      step-up-url: ${OIDC_STEP_UP_URL:http://localhost:8085/realms/coop/protocol/openid-connect/auth}
      # The clients a token may have been issued to (its azp or an audience): the web client, and
      # the tills' clients by their prefix. A token of any other client of the realm is refused.
      accepted-clients: ${OIDC_ACCEPTED_CLIENTS:coop-erp-web}
      device-client-prefix: device-
      # K-08: where an enrolled till exchanges its client credential for a device token (the
      # public address: the till reaches the provider from the shop).
      token-endpoint: ${OIDC_TOKEN_ENDPOINT:http://localhost:8085/realms/coop/protocol/openid-connect/token}
      # The provider's administration API, for M1's user management behind
      # IdentityProviderClient and, since K-08, the tills' clients behind DeviceCredentials: a
      # confidential client of the realm holding manage-users and manage-clients and nothing
      # else (19A section 2; ADR-18). The secret is a development value; a deployed environment
      # sets its own.
      admin:
        base-url: ${OIDC_ADMIN_URL:http://localhost:8085}
        realm: ${OIDC_REALM:coop}
        client-id: ${OIDC_ADMIN_CLIENT_ID:coop-erp-backend}
        client-secret: ${OIDC_ADMIN_CLIENT_SECRET:coop-erp-backend-dev}
    # The second factor (doc 19 section 2.2). A token says when the user last authenticated
    # (auth_time); it counts as the second factor when the token's acr or amr names one of
    # these, or, on a developer stack whose realm has no OTP, when password-reauth-counts is
    # true: a fresh password sign-in then satisfies the step-up. Never true outside development.
    # The freshness window itself is the register's security.mfa.freshness.
    mfa:
      acr-values: ${COOP_ERP_MFA_ACR_VALUES:2,loa2,mfa,otp}
      password-reauth-counts: ${COOP_ERP_MFA_PASSWORD_REAUTH_COUNTS:false}

  # K-08: the key that signs what central sends a till (the revoke instruction now, snapshots
  # later; doc 32 section 9): Ed25519, PKCS#8 and X.509 in base64, the same on every instance.
  # Empty on a developer machine: each instance then makes a key of its own (and says so).
  sync:
    signing:
      private-key: ${SYNC_SIGNING_PRIVATE_KEY:}
      public-key: ${SYNC_SIGNING_PUBLIC_KEY:}

  # The object store of the attachments (19A section 9), behind the S3 protocol: any S3 service,
  # MinIO on a developer machine. The endpoint is what the backend reaches; the public endpoint
  # is what a browser or a till reaches with a pre-signed URL (the same one outside compose).
  object-store:
    endpoint: ${OBJECT_STORE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${OBJECT_STORE_PUBLIC_ENDPOINT:${OBJECT_STORE_ENDPOINT:http://localhost:9000}}
    region: ${OBJECT_STORE_REGION:us-east-1}
    access-key: ${OBJECT_STORE_ACCESS_KEY:coopminio}
    secret-key: ${OBJECT_STORE_SECRET_KEY:coopminio-dev}
    attachments-bucket: ${OBJECT_STORE_ATTACHMENTS_BUCKET:attachments}
    presign-minutes: 15
    # A PENDING attachment nobody uploaded within this time is FAILED by the verifier.
    upload-window-hours: 24

  # M1's stub of M3's price-list check (21A section 11: "stub returns true for the seed list").
  # The lists the stub accepts: the ids the relationship seed names
  # (seed/m1party/relationships.dev.sql). Gone the day M3 implements TradePriceListCheck.
  party:
    stub-price-lists: ${COOP_ERP_STUB_PRICE_LISTS:0190f000-0000-7000-8000-000000000501,0190f000-0000-7000-8000-000000000502}

  # Browser origins allowed to call /v1/** (the Vite dev server). Comma-separated; never "*".
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173}

  # Flyway connects straight to PostgreSQL (5434 on the host), not through PgBouncer: it holds
  # a session-level lock while migrating. coop_migrator owns the database and may run DDL.
  migration:
    url: ${MIGRATION_URL:jdbc:postgresql://localhost:5434/coop_erp}
    user: ${MIGRATION_USER:coop_migrator}
    password: ${MIGRATION_PASSWORD:coop_migrator}
    # Strict by default: a migration with a lower version than one already applied stops the
    # start, which is what a deployed database needs (its schema must be reproducible from the
    # files in order). The local stack switches it on (infra/compose/compose.yml), because the
    # 19A lanes merge their reserved version ranges in any order and a developer's database
    # lives across those merges; see db/migration/kernel/README.md.
    out-of-order: ${MIGRATION_OUT_OF_ORDER:false}

# Health and metrics (17A S0-02), under every role. /actuator/health/liveness and /readiness
# are what an orchestrator probes; /actuator/prometheus is what a metrics server scrapes.
# They need no token (kernel.internal.security.SecurityConfig): an orchestrator probes them
# without one, and doc 35 decides whether the management port is published at all.
# The RabbitMQ health indicator is on in the worker role only (application-worker.yml): the
# other roles never talk to the broker, so its absence must not turn their health DOWN.
management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
