# M4 Trading Documents API slice (24A section 5). The slice is written first; the controllers
# and the web client follow it. Rules every slice obeys (AGENTS.md):
#   - every operation names its permission in x-permission, and that string is the same as
#     the permission on the @CommandHandler; the reads carry trd.document.view, which the kernel
#     checks for every GET (CR-24A-1)
#   - every mutating operation requires the Idempotency-Key header
#   - errors are RFC 9457 problem documents whose `code` is a message id
#   - the shape of a request (required, minLength, maxLength, minimum ...) is written in the
#     schema and nowhere else: the kernel enforces it; a business rule is a handler guard
#   - what every slice shares (the Idempotency-Key header, the Problem schema) lives in
#     common.yaml and is referred to, never copied
#   - every operation has a tag: it names the generated Java interface (Order -> OrderApi)
# After changing this file run `make gen-clients` and commit web/src/generated/m4trading.ts.
#
# The operations arrive with the tickets that implement them (M4-02 orders, M4-03 acceptance,
# M4-04 delivery notes, M4-05 goods received notes, M4-08 invoices).
openapi: 3.1.0
info:
  title: COOP ERP M4 Trading Documents API
  version: 0.1.0
  description: >
    Orders, delivery notes, goods received notes, discrepancies and invoices between trading
    entities. What a caller sees is decided by the row-level security of the document base: a
    party reads the documents it owns or is the counterparty of.
paths:

  /v1/trading/orders:

    get:
      tags: [Order]
      operationId: listOrders
      summary: The orders of the caller's entity as buyer or as seller, newest first
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: The orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Order]
      operationId: createOrder
      summary: Draft an order to a seller the caller's entity trades with
      description: >
        Problems: m4.order.seller_is_buyer, m4.order.relationship_inactive, m4.order.eta_past,
        m4.order.deliver_to_unknown, m4.order.lines_required, m4.order.sku_not_found, m4.order.sku_not_active,
        m4.order.uom_invalid, m4.order.qty_not_positive.
      x-permission: ord.order.draft
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: The draft order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/orders/availability:

    get:
      tags: [Order]
      operationId: sellerAvailability
      summary: What a seller can allocate today of the given items, in each item's base unit
      description: >
        M5's availability over the seller's active warehouses. Row-level security lets only the
        seller read its own stock: asked by anyone else, every item answers 0.
      x-permission: trd.document.view
      parameters:
        - in: query
          name: sellerId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: skuIds
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 500
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: One row per item asked; an item the seller cannot supply has quantity 0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

  /v1/trading/orders/{orderId}:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    get:
      tags: [Order]
      operationId: getOrder
      summary: One order the caller's entity placed or received
      x-permission: trd.document.view
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: m4.order.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/orders/{orderId}/submit:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    post:
      tags: [Order]
      operationId: submitOrder
      summary: Issue a draft order from the buyer's series
      description: >
        Problems: m4.order.not_found, m4.order.not_buyer, m4.order.not_draft,
        m4.order.relationship_inactive, m4.order.lines_required.
      x-permission: ord.order.submit
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The submitted order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/orders/{orderId}/cancel:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    post:
      tags: [Order]
      operationId: cancelOrder
      summary: The buyer cancels its order while nothing of it is dispatched
      description: >
        Problems: m4.order.not_found, m4.order.not_buyer, m4.order.not_cancellable,
        m4.order.dispatched.
      x-permission: ord.order.submit
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/orders/{orderId}/accept:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    post:
      tags: [Order]
      operationId: acceptOrder
      summary: The seller accepts a submitted order with a committed ETA and its allocations
      description: >
        Problems: m4.order.not_found, m4.order.not_seller, m4.order.not_submitted,
        m4.order.already_decided, m4.order.relationship_inactive, m4.order.eta_past,
        m4.order.line_unknown, m4.order.allocation_invalid, m4.order.allocation_exceeds_request,
        m4.order.allocation_exceeds_available, m4.order.price_missing.
      x-permission: ord.order.accept
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptOrderRequest'
      responses:
        '200':
          description: The accepted order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/orders/{orderId}/reject:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    post:
      tags: [Order]
      operationId: rejectOrder
      summary: The seller refuses a submitted order, with a reason
      description: >
        Problems: m4.order.not_found, m4.order.not_seller, m4.order.not_submitted,
        m4.order.already_decided.
      x-permission: ord.order.accept
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The rejected order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/delivery-notes:

    get:
      tags: [Delivery]
      operationId: listDeliveryNotes
      summary: The delivery notes the caller's entity sent (SELLER) or is to receive (BUYER)
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The delivery notes, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Delivery]
      operationId: createDeliveryNote
      summary: Draft a delivery note of accepted order lines, in drops
      description: >
        Problems: m4.delivery.drops_required, m4.delivery.lines_required, m4.delivery.one_buyer,
        m4.delivery.order_line_unknown, m4.delivery.order_not_accepted, m4.delivery.bill_to_mismatch,
        m4.delivery.qty_not_positive, m4.delivery.exceeds_allocation, m4.delivery.from_location_unknown.
      x-permission: del.note.draft
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryNoteRequest'
      responses:
        '201':
          description: The draft delivery note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/delivery-notes/{deliveryNoteId}:

    parameters:
      - $ref: '#/components/parameters/DeliveryNoteId'

    get:
      tags: [Delivery]
      operationId: getDeliveryNote
      summary: One delivery note the caller's entity sent or is to receive
      x-permission: trd.document.view
      responses:
        '200':
          description: The delivery note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryNoteResponse'
        '404':
          description: m4.delivery.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/delivery-notes/{deliveryNoteId}/issue:

    parameters:
      - $ref: '#/components/parameters/DeliveryNoteId'

    post:
      tags: [Delivery]
      operationId: issueDeliveryNote
      summary: Issue a draft delivery note from the seller's series
      description: >
        Problems: m4.delivery.not_found, m4.delivery.not_seller, m4.delivery.not_draft,
        m4.delivery.exceeds_allocation, m4.delivery.order_not_accepted.
      x-permission: del.note.issue
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The issued delivery note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/delivery-notes/{deliveryNoteId}/dispatch:

    parameters:
      - $ref: '#/components/parameters/DeliveryNoteId'

    post:
      tags: [Delivery]
      operationId: dispatchDeliveryNote
      summary: The vehicle leaves with an issued delivery note
      description: >
        Problems: m4.delivery.not_found, m4.delivery.not_seller, m4.delivery.not_at_location, m4.delivery.not_issued,
        m4.delivery.vehicle_required, m4.delivery.driver_required.
      x-permission: del.note.dispatch
      x-scope: LOCATION
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
      responses:
        '200':
          description: The delivery note in transit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/grns:

    get:
      tags: [Grn]
      operationId: listGrns
      summary: The GRNs the caller's entity received (BUYER) or that were received from it (SELLER)
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The GRNs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrnResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Grn]
      operationId: captureGrn
      summary: Count a delivery note drop at one of the receiver's locations
      description: >
        Problems: m4.grn.location_unknown, m4.grn.drop_unknown, m4.grn.not_receiver,
        m4.grn.location_mismatch, m4.grn.drop_already_captured, m4.grn.lines_required,
        m4.grn.sku_not_on_drop, m4.grn.line_duplicate, m4.grn.uom_invalid, m4.grn.line_quantities.
      x-permission: shop.grn.confirm
      x-scope: LOCATION
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureGrnRequest'
      responses:
        '201':
          description: The draft GRN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrnResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/grns/{grnId}:

    parameters:
      - $ref: '#/components/parameters/GrnId'

    get:
      tags: [Grn]
      operationId: getGrn
      summary: One GRN the caller's entity received or that was received from it
      x-permission: trd.document.view
      responses:
        '200':
          description: The GRN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrnResponse'
        '404':
          description: m4.grn.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/grns/{grnId}/confirm:

    parameters:
      - $ref: '#/components/parameters/GrnId'

    post:
      tags: [Grn]
      operationId: confirmGrn
      summary: Confirm a GRN, the pivot where ownership passes; raises a discrepancy on a variance
      description: >
        Problems: m4.grn.not_found, m4.grn.not_receiver, m4.grn.not_draft, m4.grn.mrp_required,
        m4.grn.expiry_required, document.series_device_held (a shop whose GRN series a till holds
        receives at the till).
      x-permission: shop.grn.confirm
      x-scope: LOCATION
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The confirmed GRN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrnResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/invoices:

    get:
      tags: [Billing]
      operationId: listInvoices
      summary: The invoices the caller's entity issued (SELLER) or received (BUYER)
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The invoices, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Billing]
      operationId: issueInvoice
      summary: Issue a tax invoice from confirmed GRNs of one buyer
      description: >
        Problems: m4.invoice.grns_required, m4.invoice.grn_unknown, m4.invoice.grn_not_confirmed,
        m4.invoice.one_buyer, m4.invoice.grn_invoiced, m4.invoice.seller_vat_missing,
        m4.invoice.tax_rate_missing, m4.invoice.nothing_received.
      x-permission: bil.invoice.issue
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueInvoiceRequest'
      responses:
        '201':
          description: The issued invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/invoices/{invoiceId}:

    parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Billing]
      operationId: getInvoice
      summary: One invoice the caller's entity issued or received
      x-permission: trd.document.view
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '404':
          description: m4.invoice.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/invoices/{invoiceId}/print:

    parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Billing]
      operationId: getInvoicePrint
      summary: A fresh link to the printed A4 copy of the seller's invoice (M4-11)
      description: >
        The worker prints an issued invoice to A4 after the issue (InvoicePrintConsumer); until it
        has, the answer is m4.invoice.print_not_ready. The PDF is stored under the seller; the buyer
        prints the same PDF through this invoice. Any other entity does not see the invoice
        (m4.invoice.not_found).
      x-permission: trd.document.view
      responses:
        '200':
          description: The link, pre-signed for a short while
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePrintResponse'
        '404':
          description: m4.invoice.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/invoices/{invoiceId}/dispute:

    parameters:
      - $ref: '#/components/parameters/InvoiceId'

    post:
      tags: [Billing]
      operationId: disputeInvoice
      summary: The buyer disputes an invoice it received, with a reason
      description: >
        Problems: m4.invoice.not_found, m4.invoice.not_buyer, m4.invoice.disputed_already.
      x-permission: bil.invoice.dispute
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeInvoiceRequest'
      responses:
        '200':
          description: The invoice, disputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/invoices/{invoiceId}/resolve-dispute:

    parameters:
      - $ref: '#/components/parameters/InvoiceId'

    post:
      tags: [Billing]
      operationId: resolveInvoiceDispute
      summary: The seller or the buyer closes the open dispute of an invoice
      description: >
        Problems: m4.invoice.not_found, m4.invoice.not_disputed.
      x-permission: bil.invoice.dispute
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveInvoiceDisputeRequest'
      responses:
        '200':
          description: The invoice, no longer disputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/credit-notes:

    post:
      tags: [Billing]
      operationId: issueCreditNote
      summary: The seller credits chosen quantities of lines of its invoice
      description: >
        At each line's price and VAT rate. A discrepancy is settled with settleDiscrepancy instead.
        Asks for a fresh second factor. Problems: m4.invoice.not_found, m4.creditnote.not_seller,
        m4.invoice.not_issued, m4.creditnote.line_unknown, m4.creditnote.qty_invalid,
        m4.creditnote.nothing_to_credit, document.link.exceeds_balance.
      x-permission: bil.creditnote.issue
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreditNoteRequest'
      responses:
        '201':
          description: The issued credit note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/credit-notes/{creditNoteId}:

    parameters:
      - $ref: '#/components/parameters/CreditNoteId'

    get:
      tags: [Billing]
      operationId: getCreditNote
      summary: One credit note the caller's entity issued or received
      x-permission: trd.document.view
      responses:
        '200':
          description: The credit note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteResponse'
        '404':
          description: m4.creditnote.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/credit-notes/{creditNoteId}/print:

    parameters:
      - $ref: '#/components/parameters/CreditNoteId'

    get:
      tags: [Billing]
      operationId: getCreditNotePrint
      summary: A fresh link to the printed A4 copy of the seller's credit note
      description: >
        As for the invoice: printed by the worker after the issue (m4.creditnote.print_not_ready
        until then), stored under the seller, printed by either party through the credit note.
      x-permission: trd.document.view
      responses:
        '200':
          description: The link, pre-signed for a short while
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNotePrintResponse'
        '404':
          description: m4.creditnote.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/discrepancies:

    get:
      tags: [Dispute]
      operationId: listDiscrepancies
      summary: The discrepancies the caller's entity raised (BUYER) or that were raised with it (SELLER)
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The discrepancies, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscrepancyResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

  /v1/trading/discrepancies/{discrepancyId}:

    parameters:
      - in: path
        name: discrepancyId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Dispute]
      operationId: getDiscrepancy
      summary: One discrepancy the caller's entity raised or that was raised with it
      x-permission: trd.document.view
      responses:
        '200':
          description: The discrepancy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscrepancyResponse'
        '404':
          description: m4.discrepancy.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/discrepancies/{discrepancyId}/settle:

    parameters:
      - in: path
        name: discrepancyId
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Dispute]
      operationId: settleDiscrepancy
      summary: The seller accepts the buyer's count and settles the discrepancy
      description: >
        The invoice bills the received quantity, so a short quantity is settled with no money;
        damaged quantity the invoice charged is credited by a credit note issued in the same act.
        Asks for a fresh second factor. Problems: m4.discrepancy.not_found,
        m4.discrepancy.settled_already, m4.discrepancy.invoice_first, document.link.exceeds_balance.
      x-permission: bil.creditnote.issue
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleDiscrepancyRequest'
      responses:
        '200':
          description: The discrepancy, settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscrepancyResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  # @@PATHS@@ (later tickets add their operations above this line)

components:

  parameters:

    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: string
        format: uuid

    DeliveryNoteId:
      in: path
      name: deliveryNoteId
      required: true
      schema:
        type: string
        format: uuid

    GrnId:
      in: path
      name: grnId
      required: true
      schema:
        type: string
        format: uuid

    InvoiceId:
      in: path
      name: invoiceId
      required: true
      schema:
        type: string
        format: uuid

    CreditNoteId:
      in: path
      name: creditNoteId
      required: true
      schema:
        type: string
        format: uuid

    # @@PARAMETERS@@

  schemas:

    Quantity:
      type: number
      exclusiveMinimum: 0
      maximum: 99999999999

    ReasonRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 40
        reasonText:
          type: string
          maxLength: 500

    CreateOrderRequest:
      type: object
      required: [sellerEntityId, lines]
      properties:
        sellerEntityId:
          type: string
          format: uuid
        requestedEta:
          type: string
          format: date
        notes:
          type: string
          maxLength: 500
        deliverToLocationId:
          description: One of the buyer's own locations, where the goods are to be delivered (CR-24A-2)
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/OrderLineRequest'

    OrderLineRequest:
      type: object
      required: [skuId, qty]
      properties:
        skuId:
          type: string
          format: uuid
        uomCode:
          type: string
          maxLength: 10
        qty:
          $ref: '#/components/schemas/Quantity'

    OrderStatus:
      type: string
      enum: [DRAFT, SUBMITTED, ACCEPTED, REJECTED, LOCKED, PARTIALLY_FULFILLED, FULFILLED, CANCELLED]

    OrderResponse:
      type: object
      required: [orderId, status, relationshipId, buyerEntityId, sellerEntityId, lines]
      properties:
        orderId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        relationshipId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        requestedEta:
          type: string
          format: date
        committedEta:
          type: string
          format: date
        lockAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        rejectReasonCode:
          type: string
        netAmount:
          type: number
        notes:
          type: string
        deliverToLocationId:
          type: string
          format: uuid
        deliverTo:
          $ref: '#/components/schemas/DeliveryPointResponse'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineResponse'

    DeliveryPointResponse:
      type: object
      description: >
        The buyer's delivery location as it was when the order was drafted: its code, names and
        address, copied in the buyer's session, so that the seller, who may not read the buyer's
        locations, can name it (CR-24A-2 as revised). Never changed after.
      required: [code, nameEn]
      properties:
        code:
          type: string
        nameEn:
          type: string
        nameSi:
          type: string
        nameTa:
          type: string
        address:
          type: string

    OrderLineResponse:
      type: object
      required: [lineId, lineNo, skuId, uomCode, requestedQty, cancelledQty]
      properties:
        lineId:
          type: string
          format: uuid
        lineNo:
          type: integer
        skuId:
          type: string
          format: uuid
        uomCode:
          type: string
        requestedQty:
          type: number
        cancelledQty:
          type: number
        indicativePrice:
          type: number
        allocatedQty:
          type: number
        fulfilledQty:
          type: number
        tierPrice:
          type: number

    AvailabilityResponse:
      type: object
      required: [skuId, availableQty]
      properties:
        skuId:
          type: string
          format: uuid
        availableQty:
          type: number

    AcceptOrderRequest:
      type: object
      required: [committedEta]
      properties:
        committedEta:
          type: string
          format: date
        overrides:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/AllocationOverride'

    AllocationOverride:
      type: object
      required: [lineId, allocatedQty, reason]
      properties:
        lineId:
          type: string
          format: uuid
        allocatedQty:
          type: number
          minimum: 0
          maximum: 99999999999
        reason:
          type: string
          minLength: 1
          maxLength: 200

    CreateDeliveryNoteRequest:
      type: object
      required: [drops]
      properties:
        fromLocationId:
          description: The seller's warehouse the goods leave from (optional)
          type: string
          format: uuid
        vehicleRef:
          type: string
          maxLength: 40
        driverName:
          type: string
          maxLength: 120
        routeRef:
          type: string
          maxLength: 40
        drops:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DropRequest'

    DropRequest:
      type: object
      required: [shipToLocationId, billToEntityId, lines]
      properties:
        shipToLocationId:
          type: string
          format: uuid
        billToEntityId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/DeliveryLineRequest'

    DeliveryLineRequest:
      type: object
      required: [orderLineId, qty]
      properties:
        orderLineId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'
        batchId:
          type: string
          format: uuid

    DispatchRequest:
      type: object
      properties:
        vehicleRef:
          type: string
          maxLength: 40
        driverUserId:
          type: string
          format: uuid
        driverName:
          type: string
          maxLength: 120

    DeliveryNoteResponse:
      type: object
      required: [deliveryNoteId, status, sellerEntityId, buyerEntityId, drops]
      properties:
        deliveryNoteId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
          enum: [DRAFT, ISSUED, IN_TRANSIT, CLOSED]
        sellerEntityId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        fromLocationId:
          type: string
          format: uuid
        vehicleRef:
          type: string
        driverName:
          type: string
        dispatchedAt:
          type: string
          format: date-time
        issuedAt:
          type: string
          format: date-time
        drops:
          type: array
          items:
            $ref: '#/components/schemas/DropResponse'

    DropResponse:
      type: object
      required: [dropId, seq, shipToLocationId, billToEntityId, orderIds, status, lines]
      properties:
        dropId:
          type: string
          format: uuid
        seq:
          type: integer
        shipToLocationId:
          type: string
          format: uuid
        billToEntityId:
          type: string
          format: uuid
        orderIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum: [PLANNED, RECEIVED]
        grnId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryLineResponse'

    DeliveryLineResponse:
      type: object
      required: [lineId, lineNo, orderId, orderLineId, skuId, uomCode, dispatchedQty]
      properties:
        lineId:
          type: string
          format: uuid
        lineNo:
          type: integer
        orderId:
          type: string
          format: uuid
        orderLineId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        uomCode:
          type: string
        dispatchedQty:
          type: number

    CaptureGrnRequest:
      type: object
      required: [dropId, locationId, lines]
      properties:
        dropId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        receivedOn:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/GrnLineRequest'

    GrnLineRequest:
      type: object
      required: [skuId, receivedQty]
      properties:
        skuId:
          type: string
          format: uuid
        uomCode:
          type: string
          maxLength: 10
        receivedQty:
          type: number
          minimum: 0
          maximum: 99999999999
        damagedQty:
          type: number
          minimum: 0
          maximum: 99999999999
        batchNo:
          type: string
          maxLength: 40
        manufactureDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        printedMrp:
          type: number
          minimum: 0
          maximum: 999999999999

    GrnResponse:
      type: object
      required: [grnId, status, receiverEntityId, receiverLocationId, lines]
      properties:
        grnId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
          enum: [DRAFT, CONFIRMED]
        receiverEntityId:
          type: string
          format: uuid
        receiverLocationId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        dropId:
          type: string
          format: uuid
        deliveryNoteId:
          type: string
          format: uuid
        receivedOn:
          type: string
          format: date
        confirmedAt:
          type: string
          format: date-time
        discrepancyId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/GrnLineResponse'

    GrnLineResponse:
      type: object
      required: [lineId, lineNo, skuId, uomCode, receivedQty, damagedQty]
      properties:
        lineId:
          type: string
          format: uuid
        lineNo:
          type: integer
        skuId:
          type: string
          format: uuid
        uomCode:
          type: string
        expectedQty:
          type: number
        receivedQty:
          type: number
        damagedQty:
          type: number
        batchNo:
          type: string
        expiryDate:
          type: string
          format: date
        printedMrp:
          type: number
        unitCost:
          type: number
        batchId:
          type: string
          format: uuid

    IssueInvoiceRequest:
      type: object
      required: [grnIds]
      properties:
        grnIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid

    InvoiceResponse:
      type: object
      required: [invoiceId, status, sellerEntityId, buyerEntityId, grnIds, taxPointDate, dueDate, netAmount,
        taxAmount, grossAmount, lines]
      properties:
        invoiceId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
        relationshipId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        sellerVatNo:
          type: string
        buyerVatNo:
          type: string
        grnIds:
          type: array
          items:
            type: string
            format: uuid
        taxPointDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        issuedAt:
          type: string
          format: date-time
        netAmount:
          type: number
        taxAmount:
          type: number
        grossAmount:
          type: number
        creditedAmount:
          type: number
          description: What the invoice's credit notes took off it
        amountDue:
          type: number
          description: The gross amount less what was credited and settled
        disputed:
          type: boolean
          description: The buyer disputes the invoice now
        disputeReason:
          type: string
        creditNotes:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteSummary'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineResponse'

    CreditNoteSummary:
      type: object
      required: [creditNoteId, grossAmount]
      properties:
        creditNoteId:
          type: string
          format: uuid
        docNumber:
          type: string
        grossAmount:
          type: number

    DisputeInvoiceRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ResolveInvoiceDisputeRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500

    SettleDiscrepancyRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    IssueCreditNoteRequest:
      type: object
      required: [invoiceId, lines, reason]
      properties:
        invoiceId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          maxItems: 500
          description: Invoice lines and quantities to credit
          items:
            $ref: '#/components/schemas/CreditNoteLineRequest'
        reason:
          type: string
          minLength: 1
          maxLength: 500

    CreditNoteLineRequest:
      type: object
      required: [invoiceLineId, qty]
      properties:
        invoiceLineId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'

    CreditNoteResponse:
      type: object
      required: [creditNoteId, status, invoiceId, sellerEntityId, buyerEntityId, reason, netAmount, taxAmount,
        grossAmount, lines]
      properties:
        creditNoteId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
        invoiceId:
          type: string
          format: uuid
        invoiceDocNumber:
          type: string
        discrepancyId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        reason:
          type: string
        issuedAt:
          type: string
          format: date-time
        netAmount:
          type: number
        taxAmount:
          type: number
        grossAmount:
          type: number
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteLineResponse'

    CreditNoteLineResponse:
      type: object
      required: [lineId, lineNo, skuId, uomCode, qty, unitPrice, taxRatePercent, taxAmount, lineTotal]
      properties:
        lineId:
          type: string
          format: uuid
        lineNo:
          type: integer
        skuId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        uomCode:
          type: string
        qty:
          type: number
        unitPrice:
          type: number
        taxRatePercent:
          type: number
        taxAmount:
          type: number
        lineTotal:
          type: number
        invoiceLineId:
          type: string
          format: uuid

    CreditNotePrintResponse:
      type: object
      required: [creditNoteId, url]
      properties:
        creditNoteId:
          type: string
          format: uuid
        url:
          type: string
          format: uri

    DiscrepancyResponse:
      type: object
      required: [discrepancyId, status, kind, buyerEntityId, sellerEntityId, grnId, windowEndsAt, lines]
      properties:
        discrepancyId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
          enum: [RAISED, SETTLED]
        kind:
          type: string
          enum: [SHORT, OVER, DAMAGED, MIXED]
        buyerEntityId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        grnId:
          type: string
          format: uuid
        grnDocNumber:
          type: string
        deliveryNoteId:
          type: string
          format: uuid
        raisedAt:
          type: string
          format: date-time
        windowEndsAt:
          type: string
          format: date-time
        invoiceId:
          type: string
          format: uuid
          description: The seller's invoice of the GRN, once issued
        creditNoteId:
          type: string
          format: uuid
          description: >
            The credit note for damaged quantity the invoice charged, issued at settlement; none
            when nothing billed needed crediting (a short quantity is never billed)
        creditNoteDocNumber:
          type: string
        settledAt:
          type: string
          format: date-time
        settledByUserId:
          type: string
          format: uuid
        settlementReason:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DiscrepancyLineResponse'

    DiscrepancyLineResponse:
      type: object
      required: [lineId, grnLineId, receivedQty, damagedQty, varianceQty]
      properties:
        lineId:
          type: string
          format: uuid
        grnLineId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        uomCode:
          type: string
        expectedQty:
          type: number
        receivedQty:
          type: number
        damagedQty:
          type: number
        varianceQty:
          type: number
          description: Received less expected; negative when short
        unitPrice:
          type: number

    InvoiceLineResponse:
      type: object
      required: [lineId, lineNo, skuId, uomCode, qty, unitPrice, taxRatePercent, taxAmount, lineTotal]
      properties:
        lineId:
          type: string
          format: uuid
        lineNo:
          type: integer
        skuId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        uomCode:
          type: string
        qty:
          type: number
        unitPrice:
          type: number
        taxRatePercent:
          type: number
        taxAmount:
          type: number
        lineTotal:
          type: number
        grnLineId:
          type: string
          format: uuid

    InvoicePrintResponse:
      type: object
      required: [invoiceId, url]
      properties:
        invoiceId:
          type: string
          format: uuid
        url:
          type: string
          format: uri

    # @@SCHEMAS@@
