# M4 Trading Documents API slice (24A section 5). The slice is written first; the controllers
# and the web client follow it. Rules every slice obeys (AGENTS.md):
#   - every operation names its permission in x-permission, and that string is the same as
#     the permission on the @CommandHandler; the reads carry trd.document.view, which the kernel
#     checks for every GET (CR-24A-1)
#   - every mutating operation requires the Idempotency-Key header
#   - errors are RFC 9457 problem documents whose `code` is a message id
#   - the shape of a request (required, minLength, maxLength, minimum ...) is written in the
#     schema and nowhere else: the kernel enforces it; a business rule is a handler guard
#   - what every slice shares (the Idempotency-Key header, the Problem schema) lives in
#     common.yaml and is referred to, never copied
#   - every operation has a tag: it names the generated Java interface (Order -> OrderApi)
# After changing this file run `make gen-clients` and commit web/src/generated/m4trading.ts.
#
# The operations arrive with the tickets that implement them (M4-02 orders, M4-03 acceptance,
# M4-04 delivery notes, M4-05 goods received notes, M4-08 invoices).
openapi: 3.1.0
info:
  title: COOP ERP M4 Trading Documents API
  version: 0.1.0
  description: >
    Orders, delivery notes, goods received notes, discrepancies and invoices between trading
    entities. What a caller sees is decided by the row-level security of the document base: a
    party reads the documents it owns or is the counterparty of.
paths:

  /v1/trading/orders:

    get:
      tags: [Order]
      operationId: listOrders
      summary: The orders of the caller's entity as buyer or as seller, newest first
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: The orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Order]
      operationId: createOrder
      summary: Draft an order to a seller the caller's entity trades with
      description: >
        Problems: m4.order.seller_is_buyer, m4.order.relationship_inactive, m4.order.eta_past,
        m4.order.deliver_to_unknown, m4.order.lines_required, m4.order.sku_not_found, m4.order.sku_not_active,
        m4.order.uom_invalid, m4.order.qty_not_positive.
      x-permission: ord.order.draft
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: The draft order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/orders/availability:

    get:
      tags: [Order]
      operationId: sellerAvailability
      summary: What a seller can allocate today of the given items, in each item's base unit
      description: >
        M5's availability over the seller's active warehouses. Row-level security lets only the
        seller read its own stock: asked by anyone else, every item answers 0.
      x-permission: trd.document.view
      parameters:
        - in: query
          name: sellerId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: skuIds
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 500
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: One row per item asked; an item the seller cannot supply has quantity 0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

  /v1/trading/orders/{orderId}:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    get:
      tags: [Order]
      operationId: getOrder
      summary: One order the caller's entity placed or received
      x-permission: trd.document.view
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: m4.order.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/orders/{orderId}/submit:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    post:
      tags: [Order]
      operationId: submitOrder
      summary: Issue a draft order from the buyer's series
      description: >
        Problems: m4.order.not_found, m4.order.not_buyer, m4.order.not_draft,
        m4.order.relationship_inactive, m4.order.lines_required.
      x-permission: ord.order.submit
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The submitted order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/orders/{orderId}/cancel:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    post:
      tags: [Order]
      operationId: cancelOrder
      summary: The buyer cancels its order while nothing of it is dispatched
      description: >
        Problems: m4.order.not_found, m4.order.not_buyer, m4.order.not_cancellable,
        m4.order.dispatched.
      x-permission: ord.order.submit
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/orders/{orderId}/amend:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    post:
      tags: [Order]
      operationId: amendOrder
      summary: The buyer amends its order before the seller decides it; the answer is the next version
      description: >
        The lines (the whole set), their quantities and the requested delivery date. The next
        version is a new order that names the one it amends; the amended order is CANCELLED
        (reason ORDER_AMENDED). A submitted order's next version is submitted at once and the
        seller accepts it afresh. Problems: m4.order.not_found, m4.order.not_buyer,
        m4.order.not_amendable, m4.order.relationship_inactive, m4.order.eta_past,
        m4.order.lines_required, m4.order.sku_not_found, m4.order.sku_not_active,
        m4.order.uom_invalid, m4.order.qty_not_positive.
      x-permission: ord.order.submit
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendOrderRequest'
      responses:
        '201':
          description: The next version of the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/orders/{orderId}/accept:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    post:
      tags: [Order]
      operationId: acceptOrder
      summary: The seller accepts a submitted order with a committed ETA and its allocations
      description: >
        Problems: m4.order.not_found, m4.order.not_seller, m4.order.not_submitted,
        m4.order.already_decided, m4.order.relationship_inactive, m4.order.eta_past,
        m4.order.line_unknown, m4.order.allocation_invalid, m4.order.allocation_exceeds_request,
        m4.order.allocation_exceeds_available, m4.order.price_missing.
      x-permission: ord.order.accept
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptOrderRequest'
      responses:
        '200':
          description: The accepted order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/orders/{orderId}/reject:

    parameters:
      - $ref: '#/components/parameters/OrderId'

    post:
      tags: [Order]
      operationId: rejectOrder
      summary: The seller refuses a submitted order, with a reason
      description: >
        Problems: m4.order.not_found, m4.order.not_seller, m4.order.not_submitted,
        m4.order.already_decided.
      x-permission: ord.order.accept
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The rejected order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/delivery-notes:

    get:
      tags: [Delivery]
      operationId: listDeliveryNotes
      summary: The delivery notes the caller's entity sent (SELLER) or is to receive (BUYER)
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The delivery notes, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Delivery]
      operationId: createDeliveryNote
      summary: Draft a delivery note of accepted order lines, in drops
      description: >
        Problems: m4.delivery.drops_required, m4.delivery.lines_required, m4.delivery.one_buyer,
        m4.delivery.order_line_unknown, m4.delivery.order_not_accepted, m4.delivery.bill_to_mismatch,
        m4.delivery.qty_not_positive, m4.delivery.exceeds_allocation, m4.delivery.from_location_unknown.
      x-permission: del.note.draft
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryNoteRequest'
      responses:
        '201':
          description: The draft delivery note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/delivery-notes/{deliveryNoteId}:

    parameters:
      - $ref: '#/components/parameters/DeliveryNoteId'

    get:
      tags: [Delivery]
      operationId: getDeliveryNote
      summary: One delivery note the caller's entity sent or is to receive
      x-permission: trd.document.view
      responses:
        '200':
          description: The delivery note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryNoteResponse'
        '404':
          description: m4.delivery.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/delivery-notes/{deliveryNoteId}/issue:

    parameters:
      - $ref: '#/components/parameters/DeliveryNoteId'

    post:
      tags: [Delivery]
      operationId: issueDeliveryNote
      summary: Issue a draft delivery note from the seller's series
      description: >
        Problems: m4.delivery.not_found, m4.delivery.not_seller, m4.delivery.not_draft,
        m4.delivery.exceeds_allocation, m4.delivery.order_not_accepted.
      x-permission: del.note.issue
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The issued delivery note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/delivery-notes/{deliveryNoteId}/dispatch:

    parameters:
      - $ref: '#/components/parameters/DeliveryNoteId'

    post:
      tags: [Delivery]
      operationId: dispatchDeliveryNote
      summary: The vehicle leaves with an issued delivery note
      description: >
        Problems: m4.delivery.not_found, m4.delivery.not_seller, m4.delivery.not_at_location, m4.delivery.not_issued,
        m4.delivery.vehicle_required, m4.delivery.driver_required.
      x-permission: del.note.dispatch
      x-scope: LOCATION
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
      responses:
        '200':
          description: The delivery note in transit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/grns:

    get:
      tags: [Grn]
      operationId: listGrns
      summary: The GRNs the caller's entity received (BUYER) or that were received from it (SELLER)
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The GRNs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrnResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Grn]
      operationId: captureGrn
      summary: Count a delivery note drop at one of the receiver's locations
      description: >
        Problems: m4.grn.location_unknown, m4.grn.drop_unknown, m4.grn.not_receiver,
        m4.grn.location_mismatch, m4.grn.drop_already_captured, m4.grn.lines_required,
        m4.grn.sku_not_on_drop, m4.grn.line_duplicate, m4.grn.uom_invalid, m4.grn.line_quantities.
      x-permission: shop.grn.confirm
      x-scope: LOCATION
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureGrnRequest'
      responses:
        '201':
          description: The draft GRN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrnResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/grns/{grnId}:

    parameters:
      - $ref: '#/components/parameters/GrnId'

    get:
      tags: [Grn]
      operationId: getGrn
      summary: One GRN the caller's entity received or that was received from it
      x-permission: trd.document.view
      responses:
        '200':
          description: The GRN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrnResponse'
        '404':
          description: m4.grn.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/grns/{grnId}/confirm:

    parameters:
      - $ref: '#/components/parameters/GrnId'

    post:
      tags: [Grn]
      operationId: confirmGrn
      summary: Confirm a GRN, the pivot where ownership passes; raises a discrepancy on a variance
      description: >
        Problems: m4.grn.not_found, m4.grn.not_receiver, m4.grn.not_draft, m4.grn.mrp_required,
        m4.grn.expiry_required, document.series_device_held (a shop whose GRN series a till holds
        receives at the till).
      x-permission: shop.grn.confirm
      x-scope: LOCATION
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The confirmed GRN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrnResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/invoices:

    get:
      tags: [Billing]
      operationId: listInvoices
      summary: The invoices the caller's entity issued (SELLER) or received (BUYER)
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The invoices, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Billing]
      operationId: issueInvoice
      summary: Issue a tax invoice from confirmed GRNs of one buyer
      description: >
        Problems: m4.invoice.grns_required, m4.invoice.grn_unknown, m4.invoice.grn_not_confirmed,
        m4.invoice.one_buyer, m4.invoice.grn_invoiced, m4.invoice.seller_vat_missing,
        m4.invoice.tax_rate_missing, m4.invoice.nothing_received.
      x-permission: bil.invoice.issue
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueInvoiceRequest'
      responses:
        '201':
          description: The issued invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/invoices/{invoiceId}:

    parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Billing]
      operationId: getInvoice
      summary: One invoice the caller's entity issued or received
      x-permission: trd.document.view
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '404':
          description: m4.invoice.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/invoices/{invoiceId}/print:

    parameters:
      - in: path
        name: invoiceId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Billing]
      operationId: getInvoicePrint
      summary: A fresh link to the printed A4 copy of the seller's invoice (M4-11)
      description: >
        The worker prints an issued invoice to A4 after the issue (InvoicePrintConsumer); until it
        has, the answer is m4.invoice.print_not_ready. The PDF is stored under the seller; the buyer
        prints the same PDF through this invoice. Any other entity does not see the invoice
        (m4.invoice.not_found).
      x-permission: trd.document.view
      responses:
        '200':
          description: The link, pre-signed for a short while
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePrintResponse'
        '404':
          description: m4.invoice.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/invoices/{invoiceId}/dispute:

    parameters:
      - $ref: '#/components/parameters/InvoiceId'

    post:
      tags: [Billing]
      operationId: disputeInvoice
      summary: The buyer disputes an invoice it received, with a reason
      description: >
        Problems: m4.invoice.not_found, m4.invoice.not_buyer, m4.invoice.disputed_already.
      x-permission: bil.invoice.dispute
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeInvoiceRequest'
      responses:
        '200':
          description: The invoice, disputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/invoices/{invoiceId}/resolve-dispute:

    parameters:
      - $ref: '#/components/parameters/InvoiceId'

    post:
      tags: [Billing]
      operationId: resolveInvoiceDispute
      summary: The seller or the buyer closes the open dispute of an invoice
      description: >
        Problems: m4.invoice.not_found, m4.invoice.not_disputed.
      x-permission: bil.invoice.dispute
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveInvoiceDisputeRequest'
      responses:
        '200':
          description: The invoice, no longer disputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/credit-notes:

    post:
      tags: [Billing]
      operationId: issueCreditNote
      summary: The seller credits chosen quantities of lines of its invoice
      description: >
        At each line's price and VAT rate. A discrepancy is settled with settleDiscrepancy instead.
        Each invoice line at most once, and no more than the line has left uncredited by earlier
        credit notes (a settlement or a claim may have credited it). The credit note's money applies
        to the invoice as far as it is still due; the rest stays on the credit note, unapplied, and
        applyCreditNote applies it later. Asks for a fresh second factor. Problems:
        m4.invoice.not_found, m4.creditnote.not_seller, m4.invoice.not_issued,
        m4.creditnote.line_unknown, m4.creditnote.line_duplicate, m4.creditnote.qty_invalid,
        m4.creditnote.exceeds_billed, m4.creditnote.nothing_to_credit, document.link.exceeds_balance.
      x-permission: bil.creditnote.issue
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreditNoteRequest'
      responses:
        '201':
          description: The issued credit note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/credit-notes/{creditNoteId}:

    parameters:
      - $ref: '#/components/parameters/CreditNoteId'

    get:
      tags: [Billing]
      operationId: getCreditNote
      summary: One credit note the caller's entity issued or received
      x-permission: trd.document.view
      responses:
        '200':
          description: The credit note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteResponse'
        '404':
          description: m4.creditnote.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/credit-notes/{creditNoteId}/print:

    parameters:
      - $ref: '#/components/parameters/CreditNoteId'

    get:
      tags: [Billing]
      operationId: getCreditNotePrint
      summary: A fresh link to the printed A4 copy of the seller's credit note
      description: >
        As for the invoice: printed by the worker after the issue (m4.creditnote.print_not_ready
        until then), stored under the seller, printed by either party through the credit note.
      x-permission: trd.document.view
      responses:
        '200':
          description: The link, pre-signed for a short while
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNotePrintResponse'
        '404':
          description: m4.creditnote.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/credit-notes/{creditNoteId}/apply:

    parameters:
      - $ref: '#/components/parameters/CreditNoteId'

    post:
      tags: [Billing]
      operationId: applyCreditNote
      summary: The seller applies money a credit note holds unapplied to an open invoice of the same buyer
      description: >
        A credit note's money applies to the invoice it credits only as far as that invoice was
        still due; the rest is its unapplied amount (CR-24A-3 item 2). This applies it, with no
        amount as much as fits, to an issued, undisputed invoice of the same seller and buyer. No
        money moves and nothing is refunded. Asks for a fresh second factor. Problems:
        m4.creditnote.not_found, m4.creditnote.not_seller, m4.invoice.not_found,
        m4.invoice.not_issued, m4.creditnote.invoice_not_ours, m4.creditnote.invoice_disputed,
        m4.creditnote.applied_already, m4.creditnote.amount_invalid,
        m4.creditnote.exceeds_unapplied, m4.creditnote.exceeds_due.
      x-permission: bil.creditnote.issue
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCreditNoteRequest'
      responses:
        '200':
          description: The credit note, with what it applied and what it still holds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/discrepancies:

    get:
      tags: [Dispute]
      operationId: listDiscrepancies
      summary: The discrepancies the caller's entity raised (BUYER) or that were raised with it (SELLER)
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The discrepancies, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscrepancyResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

  /v1/trading/discrepancies/{discrepancyId}:

    parameters:
      - in: path
        name: discrepancyId
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Dispute]
      operationId: getDiscrepancy
      summary: One discrepancy the caller's entity raised or that was raised with it
      x-permission: trd.document.view
      responses:
        '200':
          description: The discrepancy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscrepancyResponse'
        '404':
          description: m4.discrepancy.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/discrepancies/{discrepancyId}/settle:

    parameters:
      - in: path
        name: discrepancyId
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Dispute]
      operationId: settleDiscrepancy
      summary: The seller accepts the buyer's count and settles the discrepancy
      description: >
        The invoice bills the received quantity, so a short quantity is settled with no money;
        damaged quantity the invoice charged is credited by a credit note issued in the same act, no
        more than the line has left uncredited; the money applies to the invoice as far as it is
        still due and the rest stays on the credit note, unapplied.
        Asks for a fresh second factor. Problems: m4.discrepancy.not_found,
        m4.discrepancy.settled_already, m4.discrepancy.invoice_first, document.link.exceeds_balance.
      x-permission: bil.creditnote.issue
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleDiscrepancyRequest'
      responses:
        '200':
          description: The discrepancy, settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscrepancyResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/payment-receipts:

    get:
      tags: [Payment]
      operationId: listPaymentReceipts
      summary: The payments the caller's entity received (SELLER) or made (BUYER), newest first
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The receipts, with their reversals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentReceiptResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Payment]
      operationId: recordPaymentReceipt
      summary: The seller records a payment received from a buyer and settles its invoices
      description: >
        With no settlements the payment settles the buyer's open, undisputed invoices oldest
        first; what is left stays on the buyer's account (unapplied). Problems:
        m4.payment.method_invalid, m4.payment.amount_invalid, m4.payment.received_in_future,
        m4.payment.cheque_required, m4.payment.no_relationship, m4.payment.invoice_invalid,
        m4.invoice.not_found, m4.payment.invoice_not_ours, m4.invoice.not_issued,
        m4.payment.exceeds_due, m4.payment.exceeds_receipt.
      x-permission: bil.payment.record
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentReceiptRequest'
      responses:
        '201':
          description: The issued receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReceiptResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/payment-receipts/{receiptId}:

    parameters:
      - $ref: '#/components/parameters/ReceiptId'

    get:
      tags: [Payment]
      operationId: getPaymentReceipt
      summary: One payment receipt, for its seller or its buyer
      x-permission: trd.document.view
      responses:
        '200':
          description: The receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReceiptResponse'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/payment-receipts/{receiptId}/cheque-outcome:

    parameters:
      - $ref: '#/components/parameters/ReceiptId'

    post:
      tags: [Payment]
      operationId: recordChequeOutcome
      summary: The cheque of a receipt cleared or bounced
      description: >
        A bounced cheque reverses the receipt (a PRC reversal) and reopens the invoices it settled.
        Problems: m4.payment.outcome_invalid, m4.payment.not_found, m4.payment.not_seller,
        m4.payment.not_cheque, m4.payment.outcome_recorded.
      x-permission: bil.payment.record
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChequeOutcomeRequest'
      responses:
        '200':
          description: The receipt, with the cheque's outcome (and its reversal when bounced)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReceiptResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/payment-receipts/{receiptId}/apply:

    parameters:
      - $ref: '#/components/parameters/ReceiptId'

    post:
      tags: [Payment]
      operationId: applyPaymentReceipt
      summary: The seller applies money a receipt left on account to the buyer's later open invoices
      description: >
        With no settlements the money on account settles the buyer's open, undisputed invoices
        oldest first; with settlements, each chosen invoice as the payment form does. The
        allocation rows belong to the receipt, so a bounced cheque reverses them too. Problems:
        m4.payment.not_found, m4.payment.not_seller, m4.payment.not_recorded,
        m4.payment.nothing_on_account, m4.payment.invoice_invalid, m4.invoice.not_found,
        m4.payment.invoice_not_ours, m4.invoice.not_issued, m4.payment.amount_invalid,
        m4.payment.exceeds_due, m4.payment.exceeds_on_account, m4.payment.nothing_to_apply.
      x-permission: bil.payment.record
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPaymentReceiptRequest'
      responses:
        '200':
          description: The receipt, with what it now settles and what is left on account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReceiptResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/payment-receipts/{receiptId}/print:

    parameters:
      - $ref: '#/components/parameters/ReceiptId'

    get:
      tags: [Payment]
      operationId: getPaymentReceiptPrint
      summary: A fresh link to the printed A4 copy of the seller's payment receipt
      description: >
        As for the invoice: printed by the worker after the receipt is recorded
        (m4.payment.print_not_ready until then), stored under the seller, printed by either
        party through the receipt.
      x-permission: trd.document.view
      responses:
        '200':
          description: The link, pre-signed for a short while
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReceiptPrintResponse'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/exposures:

    get:
      tags: [Payment]
      operationId: listExposures
      summary: The exposure of every relationship in which the caller's entity sells (SELLER) or buys (BUYER)
      description: >
        Open invoice balances plus accepted orders not yet invoiced, less payments held on
        account, beside the relationship's credit limit. Computed when read; it warns, never blocks
        (ADR-12).
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The exposures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExposureResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

  /v1/trading/claims:

    get:
      tags: [Claim]
      operationId: listClaims
      summary: The claims the caller's entity raised (BUYER) or that were raised with it (SELLER)
      x-permission: trd.document.view
      parameters:
        - in: query
          name: role
          required: true
          schema:
            type: string
            enum: [BUYER, SELLER]
      responses:
        '200':
          description: The claims, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Claim]
      operationId: raiseClaim
      summary: The buyer claims against the seller for goods of a confirmed GRN (M4-06)
      description: >
        Within trading.claim_window_days of the GRN's confirmation. Photographs are added to the
        raised claim with addClaimPhoto. Problems: m4.claim.kind_invalid, m4.claim.grn_not_found,
        m4.claim.grn_not_confirmed, m4.claim.no_seller, m4.claim.window_closed,
        m4.claim.lines_required, m4.claim.line_unknown, m4.claim.line_duplicate,
        m4.claim.qty_invalid, m4.claim.exceeds_received.
      x-permission: del.claim.raise
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaiseClaimRequest'
      responses:
        '201':
          description: The claim, raised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/claims/{claimId}:

    parameters:
      - $ref: '#/components/parameters/ClaimId'

    get:
      tags: [Claim]
      operationId: getClaim
      summary: One claim the caller's entity raised or that was raised with it
      x-permission: trd.document.view
      responses:
        '200':
          description: The claim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '404':
          description: m4.claim.not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/claims/{claimId}/photos:

    parameters:
      - $ref: '#/components/parameters/ClaimId'

    post:
      tags: [Claim]
      operationId: addClaimPhoto
      summary: Authorise the upload of one photograph for a raised claim
      description: >
        Answers a URL the client PUTs the bytes to, with the content type given here. Problems:
        m4.claim.not_found, m4.claim.decided, attachment.content_type_not_allowed,
        attachment.too_large.
      x-permission: del.claim.raise
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimPhotoRequest'
      responses:
        '200':
          description: Authorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPhotoResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/claims/{claimId}/approve:

    parameters:
      - $ref: '#/components/parameters/ClaimId'

    post:
      tags: [Claim]
      operationId: approveClaim
      summary: The seller approves the claim in whole or in part; a credit note is issued with it
      description: >
        Problems: m4.claim.not_found, m4.claim.decided, m4.claim.evidence_pending,
        m4.claim.line_unknown, m4.claim.qty_invalid, m4.claim.nothing_approved,
        m4.claim.invoice_first, m4.creditnote.exceeds_billed (an accepted quantity above what its
        invoice line has left uncredited is refused, not capped). The credit note's money applies to
        the invoice as far as it is still due; the rest stays on the credit note, unapplied.
      x-permission: del.claim.decide
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveClaimRequest'
      responses:
        '200':
          description: The claim, approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/claims/{claimId}/reject:

    parameters:
      - $ref: '#/components/parameters/ClaimId'

    post:
      tags: [Claim]
      operationId: rejectClaim
      summary: The seller rejects the claim, with a reason
      description: >
        Problems: m4.claim.not_found, m4.claim.decided, m4.claim.evidence_pending.
      x-permission: del.claim.decide
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionReasonRequest'
      responses:
        '200':
          description: The claim, rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/claims/{claimId}/return:

    parameters:
      - $ref: '#/components/parameters/ClaimId'

    post:
      tags: [Claim]
      operationId: dispatchClaimReturn
      summary: The buyer sends back the goods of a claim approved with the return required
      description: >
        M5 takes them out of the buyer's stock at the GRN's location. Problems:
        m4.claim.not_found, m4.claim.return_not_required, m4.claim.returned_already.
      x-permission: del.claim.raise
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The claim, its goods on their way back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/transfer-requests:

    get:
      tags: [TransferRequest]
      operationId: listTransferRequests
      summary: The transfer requests the caller's scope reads, newest first
      description: A shop session reads its own requests and those asked of it; the society all of its own.
      x-permission: inv.stock.view
      responses:
        '200':
          description: The transfer requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransferRequestResponse'

    post:
      tags: [TransferRequest]
      operationId: requestTransfer
      summary: A shop asks for stock from another location of its society (M4-10)
      description: >
        Problems: m4.transfer.location_not_in_scope, m4.transfer.same_location,
        m4.transfer.lines_required, m4.transfer.sku_unknown, m4.transfer.sku_duplicate,
        m4.transfer.qty_invalid.
      x-permission: shop.transfer.request
      x-scope: LOCATION
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestTransferRequest'
      responses:
        '201':
          description: The request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequestResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/transfer-requests/{requestId}:

    parameters:
      - $ref: '#/components/parameters/TransferRequestId'

    get:
      tags: [TransferRequest]
      operationId: getTransferRequest
      summary: One transfer request, with the transfer that fulfils it once issued
      x-permission: inv.stock.view
      responses:
        '200':
          description: The request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequestResponse'
        '404':
          description: m4.transfer.request_not_found
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'

  /v1/trading/transfer-requests/{requestId}/approve:

    parameters:
      - $ref: '#/components/parameters/TransferRequestId'

    post:
      tags: [TransferRequest]
      operationId: approveTransferRequest
      summary: The society approves the request; its stores issue the transfer
      description: >
        The society names the location that gives the stock, or keeps the one the shop named.
        Problems: m4.transfer.request_not_found, m4.transfer.decided, m4.transfer.source_required,
        m4.transfer.same_location, m4.transfer.location_invalid, m4.transfer.insufficient_stock.
      x-permission: mpcs.transfer.approve
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveTransferRequestRequest'
      responses:
        '200':
          description: The request, approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequestResponse'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/trading/transfer-requests/{requestId}/reject:

    parameters:
      - $ref: '#/components/parameters/TransferRequestId'

    post:
      tags: [TransferRequest]
      operationId: rejectTransferRequest
      summary: The society rejects the request, with a reason
      description: >
        Problems: m4.transfer.request_not_found, m4.transfer.decided.
      x-permission: mpcs.transfer.approve
      x-scope: ENTITY
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionReasonRequest'
      responses:
        '200':
          description: The request, rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequestResponse'
        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'
        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

