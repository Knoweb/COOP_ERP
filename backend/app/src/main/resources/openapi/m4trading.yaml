    TransferRequestId:
      in: path
      name: requestId
      required: true
      schema:
        type: string
        format: uuid

    # @@PARAMETERS@@

  schemas:

    Quantity:
      type: number
      exclusiveMinimum: 0
      maximum: 99999999999

    ReasonRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 40
        reasonText:
          type: string
          maxLength: 500

    CreateOrderRequest:
      type: object
      required: [sellerEntityId, lines]
      properties:
        sellerEntityId:
          type: string
          format: uuid
        requestedEta:
          type: string
          format: date
        notes:
          type: string
          maxLength: 500
        deliverToLocationId:
          description: One of the buyer's own locations, where the goods are to be delivered (CR-24A-2)
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/OrderLineRequest'

    AmendOrderRequest:
      type: object
      required: [lines]
      properties:
        requestedEta:
          type: string
          format: date
        notes:
          type: string
          maxLength: 500
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/OrderLineRequest'

    OrderLineRequest:
      type: object
      required: [skuId, qty]
      properties:
        skuId:
          type: string
          format: uuid
        uomCode:
          type: string
          maxLength: 10
        qty:
          $ref: '#/components/schemas/Quantity'

    OrderStatus:
      type: string
      enum: [DRAFT, SUBMITTED, ACCEPTED, REJECTED, LOCKED, PARTIALLY_FULFILLED, FULFILLED, CANCELLED]

    OrderResponse:
      type: object
      required: [orderId, status, relationshipId, buyerEntityId, sellerEntityId, lines]
      properties:
        orderId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        relationshipId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        requestedEta:
          type: string
          format: date
        committedEta:
          type: string
          format: date
        lockAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
        rejectReasonCode:
          type: string
        netAmount:
          type: number
        notes:
          type: string
        deliverToLocationId:
          type: string
          format: uuid
        deliverTo:
          $ref: '#/components/schemas/DeliveryPointResponse'
        version:
          description: 1, or the version of an amendment (each amendment is a new order)
          type: integer
        amendsOrderId:
          description: The order this version amends
          type: string
          format: uuid
        amendedByOrderId:
          description: The next version, when the buyer amended this order
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineResponse'

    DeliveryPointResponse:
      type: object
      description: >
        The buyer's delivery location as it was when the order was drafted: its code, names and
        address, copied in the buyer's session, so that the seller, who may not read the buyer's
        locations, can name it (CR-24A-2 as revised). Never changed after.
      required: [code, nameEn]
      properties:
        code:
          type: string
        nameEn:
          type: string
        nameSi:
          type: string
        nameTa:
          type: string
        address:
          type: string

    OrderLineResponse:
      type: object
      required: [lineId, lineNo, skuId, uomCode, requestedQty, cancelledQty]
      properties:
        lineId:
          type: string
          format: uuid
        lineNo:
          type: integer
        skuId:
          type: string
          format: uuid
        uomCode:
          type: string
        requestedQty:
          type: number
        cancelledQty:
          type: number
        indicativePrice:
          type: number
        allocatedQty:
          type: number
        fulfilledQty:
          type: number
        tierPrice:
          type: number

    AvailabilityResponse:
      type: object
      required: [skuId, availableQty]
      properties:
        skuId:
          type: string
          format: uuid
        availableQty:
          type: number

    AcceptOrderRequest:
      type: object
      required: [committedEta]
      properties:
        committedEta:
          type: string
          format: date
        overrides:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/AllocationOverride'

    AllocationOverride:
      type: object
      required: [lineId, allocatedQty, reason]
      properties:
        lineId:
          type: string
          format: uuid
        allocatedQty:
          type: number
          minimum: 0
          maximum: 99999999999
        reason:
          type: string
          minLength: 1
          maxLength: 200

    CreateDeliveryNoteRequest:
      type: object
      required: [drops]
      properties:
        fromLocationId:
          description: The seller's warehouse the goods leave from (optional)
          type: string
          format: uuid
        vehicleRef:
          type: string
          maxLength: 40
        driverName:
          type: string
          maxLength: 120
        routeRef:
          type: string
          maxLength: 40
        drops:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DropRequest'

    DropRequest:
      type: object
      required: [shipToLocationId, billToEntityId, lines]
      properties:
        shipToLocationId:
          type: string
          format: uuid
        billToEntityId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/DeliveryLineRequest'

    DeliveryLineRequest:
      type: object
      required: [orderLineId, qty]
      properties:
        orderLineId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'
        batchId:
          type: string
          format: uuid

    DispatchRequest:
      type: object
      properties:
        vehicleRef:
          type: string
          maxLength: 40
        driverUserId:
          type: string
          format: uuid
        driverName:
          type: string
          maxLength: 120

    DeliveryNoteResponse:
      type: object
      required: [deliveryNoteId, status, sellerEntityId, buyerEntityId, drops]
      properties:
        deliveryNoteId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
          enum: [DRAFT, ISSUED, IN_TRANSIT, CLOSED]
        sellerEntityId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        fromLocationId:
          type: string
          format: uuid
        vehicleRef:
          type: string
        driverName:
          type: string
        dispatchedAt:
          type: string
          format: date-time
        issuedAt:
          type: string
          format: date-time
        drops:
          type: array
          items:
            $ref: '#/components/schemas/DropResponse'

    DropResponse:
      type: object
      required: [dropId, seq, shipToLocationId, billToEntityId, orderIds, status, lines]
      properties:
        dropId:
          type: string
          format: uuid
        seq:
          type: integer
        shipToLocationId:
          type: string
          format: uuid
        billToEntityId:
          type: string
          format: uuid
        orderIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum: [PLANNED, RECEIVED]
        grnId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryLineResponse'

    DeliveryLineResponse:
      type: object
      required: [lineId, lineNo, orderId, orderLineId, skuId, uomCode, dispatchedQty]
      properties:
        lineId:
          type: string
          format: uuid
        lineNo:
          type: integer
        orderId:
          type: string
          format: uuid
        orderLineId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        uomCode:
          type: string
        dispatchedQty:
          type: number

    CaptureGrnRequest:
      type: object
      required: [dropId, locationId, lines]
      properties:
        dropId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        receivedOn:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/GrnLineRequest'

    GrnLineRequest:
      type: object
      required: [skuId, receivedQty]
      properties:
        skuId:
          type: string
          format: uuid
        uomCode:
          type: string
          maxLength: 10
        receivedQty:
          type: number
          minimum: 0
          maximum: 99999999999
        damagedQty:
          type: number
          minimum: 0
          maximum: 99999999999
        batchNo:
          type: string
          maxLength: 40
        manufactureDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        printedMrp:
          type: number
          minimum: 0
          maximum: 999999999999

    GrnResponse:
      type: object
      required: [grnId, status, receiverEntityId, receiverLocationId, lines]
      properties:
        grnId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
          enum: [DRAFT, CONFIRMED]
        receiverEntityId:
          type: string
          format: uuid
        receiverLocationId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        dropId:
          type: string
          format: uuid
        deliveryNoteId:
          type: string
          format: uuid
        receivedOn:
          type: string
          format: date
        confirmedAt:
          type: string
          format: date-time
        discrepancyId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/GrnLineResponse'

    GrnLineResponse:
      type: object
      required: [lineId, lineNo, skuId, uomCode, receivedQty, damagedQty]
      properties:
        lineId:
          type: string
          format: uuid
        lineNo:
          type: integer
        skuId:
          type: string
          format: uuid
        uomCode:
          type: string
        expectedQty:
          type: number
        receivedQty:
          type: number
        damagedQty:
          type: number
        batchNo:
          type: string
        expiryDate:
          type: string
          format: date
        printedMrp:
          type: number
        unitCost:
          type: number
        batchId:
          type: string
          format: uuid

    IssueInvoiceRequest:
      type: object
      required: [grnIds]
      properties:
        grnIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid

    InvoiceResponse:
      type: object
      required: [invoiceId, status, sellerEntityId, buyerEntityId, grnIds, taxPointDate, dueDate, netAmount,
        taxAmount, grossAmount, lines]
      properties:
        invoiceId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
        relationshipId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        sellerVatNo:
          type: string
        buyerVatNo:
          type: string
        grnIds:
          type: array
          items:
            type: string
            format: uuid
        taxPointDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        issuedAt:
          type: string
          format: date-time
        netAmount:
          type: number
        taxAmount:
          type: number
        grossAmount:
          type: number
        creditedAmount:
          type: number
          description: What the invoice's credit notes took off it
        amountDue:
          type: number
          description: The gross amount less what was credited and settled
        settledAmount:
          type: number
          description: What payments settled of it, net of bounced cheques
        paymentState:
          type: string
          enum: [OPEN, PART_PAID, SETTLED]
        payments:
          type: array
          description: The receipts (and reversals) that settled part of it, oldest first
          items:
            $ref: '#/components/schemas/InvoicePaymentSummary'
        disputed:
          type: boolean
          description: The buyer disputes the invoice now
        disputeReason:
          type: string
        creditNotes:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteSummary'
        availableCredits:
          type: array
          description: >
            For the seller, while something is due: its credit notes to this buyer that still hold
            money unapplied, which applyCreditNote can apply to this invoice
          items:
            $ref: '#/components/schemas/CreditNoteSummary'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineResponse'

    CreditNoteSummary:
      type: object
      required: [creditNoteId, grossAmount]
      properties:
        creditNoteId:
          type: string
          format: uuid
        docNumber:
          type: string
        grossAmount:
          type: number
        appliedAmount:
          type: number
          description: What of it was applied to invoices
        unappliedAmount:
          type: number
          description: What it still holds for the buyer, to apply to an open invoice

    ApplyCreditNoteRequest:
      type: object
      required: [invoiceId]
      properties:
        invoiceId:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999.99
          description: What to apply; absent, as much as fits

    DisputeInvoiceRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ResolveInvoiceDisputeRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500

    SettleDiscrepancyRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    IssueCreditNoteRequest:
      type: object
      required: [invoiceId, lines, reason]
      properties:
        invoiceId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          maxItems: 500
          description: Invoice lines and quantities to credit
          items:
            $ref: '#/components/schemas/CreditNoteLineRequest'
        reason:
          type: string
          minLength: 1
          maxLength: 500

    CreditNoteLineRequest:
      type: object
      required: [invoiceLineId, qty]
      properties:
        invoiceLineId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'

    CreditNoteResponse:
      type: object
      required: [creditNoteId, status, invoiceId, sellerEntityId, buyerEntityId, reason, netAmount, taxAmount,
        grossAmount, lines]
      properties:
        creditNoteId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
        invoiceId:
          type: string
          format: uuid
        invoiceDocNumber:
          type: string
        discrepancyId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        reason:
          type: string
        issuedAt:
          type: string
          format: date-time
        netAmount:
          type: number
        taxAmount:
          type: number
        grossAmount:
          type: number
        appliedAmount:
          type: number
          description: What of it was applied to invoices (to its own invoice as far as that was due, then by applyCreditNote)
        unappliedAmount:
          type: number
          description: What it still holds for the buyer
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteLineResponse'

    CreditNoteLineResponse:
      type: object
      required: [lineId, lineNo, skuId, uomCode, qty, unitPrice, taxRatePercent, taxAmount, lineTotal]
      properties:
        lineId:
          type: string
          format: uuid
        lineNo:
          type: integer
        skuId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        uomCode:
          type: string
        qty:
          type: number
        unitPrice:
          type: number
        taxRatePercent:
          type: number
        taxAmount:
          type: number
        lineTotal:
          type: number
        invoiceLineId:
          type: string
          format: uuid

    CreditNotePrintResponse:
      type: object
      required: [creditNoteId, url]
      properties:
        creditNoteId:
          type: string
          format: uuid
        url:
          type: string
          format: uri

    DiscrepancyResponse:
      type: object
      required: [discrepancyId, status, kind, buyerEntityId, sellerEntityId, grnId, windowEndsAt, lines]
      properties:
        discrepancyId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
          enum: [RAISED, SETTLED]
        kind:
          type: string
          enum: [SHORT, OVER, DAMAGED, MIXED]
        buyerEntityId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        grnId:
          type: string
          format: uuid
        grnDocNumber:
          type: string
        deliveryNoteId:
          type: string
          format: uuid
        raisedAt:
          type: string
          format: date-time
        windowEndsAt:
          type: string
          format: date-time
        invoiceId:
          type: string
          format: uuid
          description: The seller's invoice of the GRN, once issued
        creditNoteId:
          type: string
          format: uuid
          description: >
            The credit note for damaged quantity the invoice charged, issued at settlement; none
            when nothing billed needed crediting (a short quantity is never billed)
        creditNoteDocNumber:
          type: string
        settledAt:
          type: string
          format: date-time
        settledByUserId:
          type: string
          format: uuid
        settlementReason:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DiscrepancyLineResponse'

    DiscrepancyLineResponse:
      type: object
      required: [lineId, grnLineId, receivedQty, damagedQty, varianceQty]
      properties:
        lineId:
          type: string
          format: uuid
        grnLineId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        uomCode:
          type: string
        expectedQty:
          type: number
        receivedQty:
          type: number
        damagedQty:
          type: number
        varianceQty:
          type: number
          description: Received less expected; negative when short
        unitPrice:
          type: number

    InvoiceLineResponse:
      type: object
      required: [lineId, lineNo, skuId, uomCode, qty, unitPrice, taxRatePercent, taxAmount, lineTotal]
      properties:
        lineId:
          type: string
          format: uuid
        lineNo:
          type: integer
        skuId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        uomCode:
          type: string
        qty:
          type: number
        unitPrice:
          type: number
        taxRatePercent:
          type: number
        taxAmount:
          type: number
        lineTotal:
          type: number
        grnLineId:
          type: string
          format: uuid

    InvoicePrintResponse:
      type: object
      required: [invoiceId, url]
      properties:
        invoiceId:
          type: string
          format: uuid
        url:
          type: string
          format: uri

    InvoicePaymentSummary:
      type: object
      required: [receiptId, status, amount]
      properties:
        receiptId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
          enum: [RECORDED, REVERSED, REVERSAL]
        method:
          type: string
        receivedOn:
          type: string
          format: date
        amount:
          type: number
          description: What this receipt settled of the invoice; negative on a reversal

    RecordPaymentReceiptRequest:
      type: object
      required: [buyerEntityId, method, amount]
      properties:
        buyerEntityId:
          type: string
          format: uuid
        method:
          type: string
          enum: [CASH, CHEQUE, TRANSFER, DEPOSIT]
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 999999999999.99
        reference:
          type: string
          maxLength: 100
          description: The bank reference, deposit slip or cash receipt book number
        receivedOn:
          type: string
          format: date
          description: When the money was received; today when left out
        cheque:
          $ref: '#/components/schemas/ChequeRequest'
        settlements:
          type: array
          maxItems: 200
          description: Chosen invoices and amounts; left out, the open invoices are settled oldest first
          items:
            $ref: '#/components/schemas/SettlementRequest'

    ApplyPaymentReceiptRequest:
      type: object
      properties:
        settlements:
          type: array
          maxItems: 200
          description: Chosen invoices and amounts; left out, the open invoices are settled oldest first
          items:
            $ref: '#/components/schemas/SettlementRequest'

    PaymentReceiptPrintResponse:
      type: object
      required: [receiptId, url]
      properties:
        receiptId:
          type: string
          format: uuid
        url:
          type: string
          format: uri

    ChequeRequest:
      type: object
      required: [bank, chequeNo, dated]
      properties:
        bank:
          type: string
          minLength: 1
          maxLength: 100
        chequeNo:
          type: string
          minLength: 1
          maxLength: 20
        dated:
          type: string
          format: date

    SettlementRequest:
      type: object
      required: [invoiceId, amount]
      properties:
        invoiceId:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: 0

    ChequeOutcomeRequest:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [CLEARED, BOUNCED]
        reason:
          type: string
          maxLength: 500

    PaymentReceiptResponse:
      type: object
      required: [receiptId, status, sellerEntityId, buyerEntityId, method, receivedOn, amount, unappliedAmount,
        allocations]
      properties:
        receiptId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
          enum: [RECORDED, REVERSED, REVERSAL]
        sellerEntityId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        method:
          type: string
        reference:
          type: string
        receivedOn:
          type: string
          format: date
        issuedAt:
          type: string
          format: date-time
        amount:
          type: number
        unappliedAmount:
          type: number
          description: What stays on the buyer's account; zero once reversed
        reversalOf:
          type: string
          format: uuid
          description: On a reversal, the receipt it reverses
        reversedBy:
          type: string
          format: uuid
          description: On a reversed receipt, its reversal
        reason:
          type: string
        cheque:
          $ref: '#/components/schemas/ChequeResponse'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/AllocationResponse'

    ChequeResponse:
      type: object
      required: [bank, chequeNo, dated]
      properties:
        bank:
          type: string
        chequeNo:
          type: string
        dated:
          type: string
          format: date
        outcome:
          type: string
          enum: [CLEARED, BOUNCED]
        outcomeAt:
          type: string
          format: date-time

    AllocationResponse:
      type: object
      required: [invoiceId, amount]
      properties:
        invoiceId:
          type: string
          format: uuid
        invoiceNumber:
          type: string
        amount:
          type: number

    ExposureResponse:
      type: object
      required: [relationshipId, sellerEntityId, buyerEntityId, openInvoices, acceptedNotInvoiced,
        unappliedReceipts, amount, asOf]
      properties:
        relationshipId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        creditLimit:
          type: number
          description: The relationship's credit limit (M1); absent when it sets none
        openInvoices:
          type: number
        acceptedNotInvoiced:
          type: number
        unappliedReceipts:
          type: number
        unappliedCredits:
          type: number
          description: What the seller's credit notes to the buyer hold unapplied; subtracted
        amount:
          type: number
        warnThresholdPercent:
          type: integer
          description: The highest configured percentage of the limit the amount has reached
        asOf:
          type: string
          format: date-time

    DecisionReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    RaiseClaimRequest:
      type: object
      required: [grnId, kind, lines]
      properties:
        grnId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [DAMAGED, EXPIRED_ON_ARRIVAL, WRONG_GOODS, QUALITY]
        returnRequested:
          type: boolean
          default: false
          description: The buyer offers the goods back; the seller decides
        note:
          type: string
          maxLength: 500
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/ClaimLineRequest'

    ClaimLineRequest:
      type: object
      required: [grnLineId, qty]
      properties:
        grnLineId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'

    ClaimPhotoRequest:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          maxLength: 100
        contentLength:
          type: integer
          format: int64
          minimum: 1

    ClaimPhotoResponse:
      type: object
      required: [attachmentId, url, expiresAt]
      properties:
        attachmentId:
          type: string
          format: uuid
        url:
          type: string
        expiresAt:
          type: string
          format: date-time

    ApproveClaimRequest:
      type: object
      properties:
        findings:
          type: string
          maxLength: 500
        returnRequired:
          type: boolean
          default: false
        lines:
          type: array
          maxItems: 200
          description: What is accepted of each claimed line; none accepts every line in full
          items:
            $ref: '#/components/schemas/ApproveClaimLineRequest'

    ApproveClaimLineRequest:
      type: object
      required: [claimLineId, qty]
      properties:
        claimLineId:
          type: string
          format: uuid
        qty:
          type: number
          minimum: 0
          maximum: 99999999999

    ClaimResponse:
      type: object
      required: [claimId, status, kind, buyerEntityId, sellerEntityId, grnId, windowEndsAt, returnRequested,
                 returnRequired, photos, lines]
      properties:
        claimId:
          type: string
          format: uuid
        docNumber:
          type: string
        status:
          type: string
          enum: [RAISED, APPROVED, REJECTED]
        kind:
          type: string
          enum: [DAMAGED, EXPIRED_ON_ARRIVAL, WRONG_GOODS, QUALITY]
        buyerEntityId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        grnId:
          type: string
          format: uuid
        grnDocNumber:
          type: string
        raisedAt:
          type: string
          format: date-time
        windowEndsAt:
          type: string
          format: date-time
        returnRequested:
          type: boolean
        note:
          type: string
        invoiceId:
          type: string
          format: uuid
          description: The seller's invoice of the GRN, once issued
        findings:
          type: string
        rejectReason:
          type: string
        returnRequired:
          type: boolean
        creditNoteId:
          type: string
          format: uuid
        creditNoteDocNumber:
          type: string
        decidedByUserId:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        returnedAt:
          type: string
          format: date-time
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ClaimPhotoStatusResponse'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ClaimLineResponse'

    ClaimPhotoStatusResponse:
      type: object
      required: [attachmentId, status]
      properties:
        attachmentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, COMPLETE, FAILED]

    ClaimLineResponse:
      type: object
      required: [claimLineId, grnLineId, skuId, uomCode, claimedQty]
      properties:
        claimLineId:
          type: string
          format: uuid
        grnLineId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
        uomCode:
          type: string
        claimedQty:
          type: number
        approvedQty:
          type: number
        unitPrice:
          type: number

    ApproveTransferRequestRequest:
      type: object
      properties:
        fromLocationId:
          type: string
          format: uuid
          description: The society's location that gives the stock; left out, the one the shop named

    RequestTransferRequest:
      type: object
      required: [lines]
      properties:
        fromLocationId:
          type: string
          format: uuid
          description: The stores asked, when the shop knows them; left out, the society names them when it decides
        toLocationId:
          type: string
          format: uuid
          description: The shop that asks; a shop session's own location when left out
        reason:
          type: string
          maxLength: 500
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/TransferRequestLineRequest'

    TransferRequestLineRequest:
      type: object
      required: [skuId, qty]
      properties:
        skuId:
          type: string
          format: uuid
        qty:
          $ref: '#/components/schemas/Quantity'

    TransferRequestResponse:
      type: object
      required: [requestId, toLocationId, status, requestedAt, lines]
      properties:
        requestId:
          type: string
          format: uuid
        fromLocationId:
          type: string
          format: uuid
        toLocationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [REQUESTED, APPROVED, REJECTED]
        reason:
          type: string
        requestedBy:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        rejectReason:
          type: string
        decidedBy:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        transferId:
          type: string
          format: uuid
          description: The M5 transfer that fulfils the approved request, once the stores issued it
        transferStatus:
          type: string
          enum: [IN_TRANSIT, RECEIVED]
        lines:
          type: array
          items:
            $ref: '#/components/schemas/TransferRequestLineResponse'

    TransferRequestLineResponse:
      type: object
      required: [lineId, skuId, qty]
      properties:
        lineId:
          type: string
          format: uuid
        skuId:
          type: string
          format: uuid
        qty:
          type: number

