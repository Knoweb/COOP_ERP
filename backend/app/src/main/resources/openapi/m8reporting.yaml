# M8 Reporting Pipeline API slice (28A section 5), the part the demo needs: the report
# definitions, a report's rows and its CSV, a print run to an A4 PDF, and the dashboard. Every
# operation names its permission in x-permission; the kernel checks it (reads included). Which
# rows a report holds is decided by row-level security on the projections, never by the
# request. A cost column (the stock value) is only ever in an answer to the owner's users or to
# the Federation view (28A section 6, "Cost columns").
# After changing this file run `sh tools/gen-clients.sh` and commit web/src/generated/m8reporting.ts.
openapi: 3.1.0
info:
  title: COOP ERP M8 Reporting API
  version: 0.1.0
paths:
  /v1/reporting/dashboard:
    get:
      tags: [Reporting]
      operationId: getDashboard
      summary: The dashboard tiles of the caller's scope
      description: >
        Open orders (submitted, not yet accepted, rejected or cancelled), deliveries in transit
        (dispatched, no GRN confirmed against them), GRNs confirmed today (the business date),
        and, for the owner's users and the Federation view, the stock value at the entity
        average. Each count covers the documents the caller is a party to.
      x-permission: rpt.report.run
      responses:
        '200':
          description: The tiles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
  /v1/reporting/reports:
    get:
      tags: [Reporting]
      operationId: listReports
      summary: The report definitions
      x-permission: rpt.report.run
      responses:
        '200':
          description: The definitions, in catalogue order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReportDefinitionResponse' }
  /v1/reporting/reports/{reportId}/data:
    get:
      tags: [Reporting]
      operationId: getReportData
      summary: A report's rows
      description: >
        Codes this operation can answer with 422: m8.report.unknown, m8.report.period_required,
        m8.report.period_invalid.
      x-permission: rpt.report.run
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/LocationId'
      responses:
        '200':
          description: The rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDataResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/reporting/reports/{reportId}/csv:
    get:
      tags: [Reporting]
      operationId: exportReportCsv
      summary: A report's rows as CSV
      description: >
        The same rows as the data operation, one line per row after a header line of the column
        names in the caller's language; values as the data operation gives them (dates ISO,
        amounts with a point). UTF-8. Codes as for the data operation.
      x-permission: rpt.export.run
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/LocationId'
      responses:
        '200':
          description: The CSV file
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/reporting/reports/{reportId}/runs:
    post:
      tags: [Reporting]
      operationId: requestReportRun
      summary: Print a report to an A4 PDF
      description: >
        Records the run REQUESTED; the worker prints it. Ask for the run until it is READY
        (with a download link) or FAILED. Codes this operation can answer with 422:
        m8.run.own_required, m8.report.unknown, m8.report.period_required,
        m8.report.period_invalid, m8.run.language_invalid.
      x-permission: rpt.export.run
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestReportRunRequest' }
      responses:
        '202':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRunResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/reporting/runs/{runId}:
    get:
      tags: [Reporting]
      operationId: getReportRun
      summary: A print run, with a fresh download link once it is READY
      x-permission: rpt.export.run
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRunResponse' }
        '404':
          description: No such run in the caller's scope
components:
  parameters:
    ReportId:
      in: path
      name: reportId
      required: true
      schema: { type: string, pattern: '^[a-z0-9-]{1,40}$' }
    From:
      in: query
      name: from
      required: false
      description: The first day of the period (period reports)
      schema: { type: string, format: date }
    To:
      in: query
      name: to
      required: false
      description: The last day of the period (period reports)
      schema: { type: string, format: date }
    LocationId:
      in: query
      name: locationId
      required: false
      description: One location (the stock position); all the caller reads when absent
      schema: { type: string, format: uuid }
  schemas:
    DashboardResponse:
      type: object
      required: [tiles]
      properties:
        tiles:
          type: array
          items: { $ref: '#/components/schemas/DashboardTile' }
        freshness:
          type: string
          format: date-time
          description: The latest event the projections applied for the caller
    DashboardTile:
      type: object
      required: [tileId, labelId, value, kind]
      properties:
        tileId: { type: string }
        labelId: { type: string, description: The message id of the tile's name }
        value: { type: string, description: 'A count, or an amount (plain decimal) for kind MONEY' }
        kind: { type: string, enum: [COUNT, MONEY] }
        drillReportId: { type: string }
    ReportDefinitionResponse:
      type: object
      required: [reportId, titleId, decisionId, period, location]
      properties:
        reportId: { type: string }
        titleId: { type: string }
        decisionId: { type: string }
        period: { type: boolean, description: The report takes from and to }
        location: { type: boolean, description: The report takes a location }
    ReportColumn:
      type: object
      required: [key, labelId, kind]
      properties:
        key: { type: string }
        labelId: { type: string }
        kind: { type: string, enum: [TEXT, DATE, QTY, MONEY] }
    ReportDataResponse:
      type: object
      required: [reportId, titleId, columns, rows, totals, generatedAt]
      properties:
        reportId: { type: string }
        titleId: { type: string }
        columns:
          type: array
          items: { $ref: '#/components/schemas/ReportColumn' }
        rows:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        totals:
          type: object
          additionalProperties: { type: string }
          description: The sums of the QTY and MONEY columns, by column key
        freshness: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
    RequestReportRunRequest:
      type: object
      required: [language]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        locationId: { type: string, format: uuid }
        language: { type: string, enum: [en, si, ta] }
    ReportRunResponse:
      type: object
      required: [runId, reportId, status, language, requestedAt]
      properties:
        runId: { type: string, format: uuid }
        reportId: { type: string }
        status: { type: string, enum: [REQUESTED, READY, FAILED] }
        language: { type: string }
        errorCode: { type: string, description: The renderer's message id, when FAILED }
        downloadUrl: { type: string, format: uri, description: 'A pre-signed link to the PDF, when READY' }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
