# OpenAPI slice of the pricing module (23A section 5). Built so far: TRADE price lists (M3-04)
# and the trade price of an order line; discount rules: author, activate, withdraw (M3-05). The other operations of 23A section 5 arrive with their
# tickets. Rules every slice obeys (AGENTS.md): x-permission on every operation, the same string
# as the @CommandHandler; Idempotency-Key on every mutating operation; errors are problem
# documents whose `code` is a message id; the shape of a request lives here and the kernel
# enforces it. After changing this file run `make gen-clients` and commit web/src/generated/m3pricing.ts.
openapi: 3.1.0
info:
  title: COOP ERP Pricing API
  version: 0.3.0
paths:
  /v1/pricing/lists:
    get:
      tags: [Pricing]
      operationId: listPriceLists
      summary: The price list versions visible in the caller's scope, by name, newest version first
      description: >
        The owner sees its lists; the buyer of a relationship sees the published versions of the
        TRADE list the relationship binds; the Federation view sees every list.
      x-permission: prc.pricelist.view
      parameters:
        - in: query
          name: kind
          required: false
          schema: { type: string, enum: [TRADE, RETAIL, ADVISORY] }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [DRAFT, PUBLISHED, SUPERSEDED, WITHDRAWN] }
      responses:
        '200':
          description: The versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PriceListResponse' }
    post:
      tags: [Pricing]
      operationId: createPriceList
      summary: Create a price list, version 1, as a draft of the caller's entity
      description: >
        Codes this operation can answer with 422: m3.price_list.kind_not_available (only TRADE is
        available so far), scope.invalid (not an entity-wide OWN scope), request.field.required.
      x-permission: prc.pricelist.author
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePriceListRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Address of the new version
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceListResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/pricing/lists/{listId}:
    parameters:
      - in: path
        name: listId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Pricing]
      operationId: getPriceList
      summary: One version of a price list with its lines
      x-permission: prc.pricelist.view
      responses:
        '200':
          description: The version and its lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceListDetailResponse' }
        '404':
          description: No such list, or the caller's scope may not see it (the two look the same on purpose)
  /v1/pricing/lists/{listId}/versions:
    parameters:
      - in: path
        name: listId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Pricing]
      operationId: draftNewVersion
      summary: Draft the next version of a published list
      description: >
        The new version starts with no lines. Codes this operation can answer with 422:
        m3.price_list.not_found, m3.price_list.not_published, m3.price_list.draft_exists,
        scope.invalid.
      x-permission: prc.pricelist.author
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The new draft version
          headers:
            Location:
              description: Address of the new version
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceListResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/pricing/lists/{listId}/lines:
    parameters:
      - in: path
        name: listId
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Pricing]
      operationId: setLines
      summary: Replace the lines of a draft
      description: >
        Answers one outcome per line, in the order given. The lines are stored only when every
        line is accepted (saved true); a refused line carries its reason (a message id:
        m3.price_list.line.sku_not_active, .uom_invalid, .duplicate, .tier_base_missing,
        .tiers_not_ascending, .price_negative, .price_precision, .tier_invalid, .incomplete). An
        accepted line may carry a review (m3.price_list.review.above_mrp: a trade price above the
        SKU's lowest printed MRP; a review, not a block). Codes this operation can answer with
        422: m3.price_list.not_found, m3.price_list.not_draft, scope.invalid.
      x-permission: prc.pricelist.author
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLinesRequest' }
      responses:
        '200':
          description: The outcome of each line
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetLinesResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/pricing/lists/{listId}/publish:
    parameters:
      - in: path
        name: listId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Pricing]
      operationId: publishPriceList
      summary: Publish a draft from a date; the previous published version is superseded
      description: >
        A second factor is required (TRADE). Codes this operation can answer with 422:
        m3.price_list.not_found, m3.price_list.not_draft, m3.price_list.apply_from_past,
        m3.price_list.no_lines, m3.price_list.lines_invalid, scope.invalid.
      x-permission: prc.pricelist.publish
      x-mfa: true
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishPriceListRequest' }
      responses:
        '200':
          description: The published version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceListResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/pricing/resolve/trade:
    get:
      tags: [Pricing]
      operationId: resolveTradePrice
      summary: The trade price of an order line under a relationship (tax-exclusive, per unit)
      description: >
        23A section 5 writes this as a POST; it changes nothing, so it is a GET here and needs no
        Idempotency-Key. The tier is the highest not above the quantity (the ordered quantity).
      x-permission: prc.pricelist.view
      parameters:
        - in: query
          name: relationshipId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: skuId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: uom
          required: true
          schema: { type: string, minLength: 1, maxLength: 10 }
        - in: query
          name: qty
          required: true
          schema: { type: number, exclusiveMinimum: 0 }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: The price
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradePriceResponse' }
        '404':
          description: No visible relationship, no bound list in force, or no line for the SKU and unit
  /v1/pricing/rules:
    get:
      tags: [Pricing]
      operationId: listRules
      summary: The discount rules visible in the caller's scope, newest validity first
      x-permission: prc.pricelist.view
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [DRAFT, ACTIVE, EXPIRED, WITHDRAWN] }
        - in: query
          name: kind
          required: false
          schema: { type: string, enum: [TIME_LIMITED_PRICE, QUANTITY_BREAK, BILL_THRESHOLD, FREE_ITEM, EXPIRY_MARKDOWN] }
      responses:
        '200':
          description: The rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RuleResponse' }
    post:
      tags: [Pricing]
      operationId: authorRule
      summary: Author a discount rule of the caller's entity, as a draft
      description: >
        The predicate and benefit follow the closed vocabulary of doc 23 section 3.3, per kind.
        Codes this operation can answer with 422: m3.rule.kind_not_available (FREE_ITEM, not yet),
        m3.rule.kind_invalid, m3.rule.sku_required, m3.rule.sku_not_active, m3.rule.uom_invalid,
        m3.rule.field_not_allowed, m3.rule.min_qty_required, m3.rule.days_to_expiry_required,
        m3.rule.not_expiry_tracked, m3.rule.bill_total_required, m3.rule.benefit_not_allowed,
        m3.rule.benefit_value_invalid, m3.rule.validity_invalid, m3.rule.priority_invalid,
        scope.invalid, request.field.required.
      x-permission: prc.rule.author
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorRuleRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Address of the new rule
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/pricing/rules/{ruleId}:
    parameters:
      - in: path
        name: ruleId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Pricing]
      operationId: getRule
      summary: One discount rule
      x-permission: prc.pricelist.view
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleResponse' }
        '404':
          description: No such rule, or the caller's scope may not see it
  /v1/pricing/rules/{ruleId}/activate:
    parameters:
      - in: path
        name: ruleId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Pricing]
      operationId: activateRule
      summary: Activate a draft rule; it applies at the owner's shops from its first valid date
      description: >
        Codes this operation can answer with 422: m3.rule.not_found, m3.rule.not_draft,
        m3.rule.valid_from_past, the vocabulary codes of authorRule (checked again), scope.invalid.
      x-permission: prc.rule.activate
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The active rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/pricing/rules/{ruleId}/withdraw:
    parameters:
      - in: path
        name: ruleId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Pricing]
      operationId: withdrawRule
      summary: Withdraw an active rule, for a reason
      description: >
        Codes this operation can answer with 422: m3.rule.not_found, m3.rule.not_active,
        scope.invalid.
      x-permission: prc.rule.activate
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawRuleRequest' }
      responses:
        '200':
          description: The withdrawn rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
components:
  schemas:
    RulePredicate:
      type: object
      description: >
        The closed vocabulary of doc 23 section 3.3. TIME_LIMITED_PRICE needs skuId (uomCode
        optional); QUANTITY_BREAK skuId and minQty; EXPIRY_MARKDOWN skuId and daysToExpiry;
        BILL_THRESHOLD billTotalFrom. A field a kind does not use is left out.
      properties:
        skuId: { type: [string, 'null'], format: uuid }
        uomCode: { type: [string, 'null'], minLength: 1, maxLength: 10 }
        minQty: { type: [number, 'null'], exclusiveMinimum: 0 }
        daysToExpiry: { type: [integer, 'null'], minimum: 0, maximum: 3650 }
        billTotalFrom: { type: [number, 'null'], exclusiveMinimum: 0 }
    RuleBenefit:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, enum: [FIXED_PRICE, PERCENT_OFF, AMOUNT_OFF, FREE_QTY] }
        value: { type: number, minimum: 0, description: The price or the percentage or the rupees off }
    AuthorRuleRequest:
      type: object
      required: [name, kind, predicate, benefit, validFrom]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [TIME_LIMITED_PRICE, QUANTITY_BREAK, BILL_THRESHOLD, FREE_ITEM, EXPIRY_MARKDOWN] }
        predicate: { $ref: '#/components/schemas/RulePredicate' }
        benefit: { $ref: '#/components/schemas/RuleBenefit' }
        priority: { type: [integer, 'null'], minimum: 0, maximum: 32767, description: Lower applies first; 100 when left out }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
    WithdrawRuleRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200 }
    RuleResponse:
      type: object
      required: [ruleId, ownerEntityId, name, kind, predicate, benefit, priority, validFrom, status, createdAt]
      properties:
        ruleId: { type: string, format: uuid }
        ownerEntityId: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [TIME_LIMITED_PRICE, QUANTITY_BREAK, BILL_THRESHOLD, FREE_ITEM, EXPIRY_MARKDOWN] }
        predicate: { $ref: '#/components/schemas/RulePredicate' }
        benefit: { $ref: '#/components/schemas/RuleBenefit' }
        priority: { type: integer }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
        status: { type: string, enum: [DRAFT, ACTIVE, EXPIRED, WITHDRAWN] }
        createdAt: { type: string, format: date-time }
    CreatePriceListRequest:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [TRADE, RETAIL, ADVISORY] }
        name: { type: string, minLength: 1, maxLength: 120 }
    PublishPriceListRequest:
      type: object
      required: [applyFrom]
      properties:
        applyFrom: { type: string, format: date, description: The first business date the version applies }
    SetLinesRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/PriceListLineInput' }
    PriceListLineInput:
      type: object
      required: [skuId, uomCode, tierFromQty, price]
      properties:
        skuId: { type: string, format: uuid }
        uomCode: { type: string, minLength: 1, maxLength: 10 }
        tierFromQty: { type: number, minimum: 0, description: The quantity from which the price applies; 0 is the base price }
        price: { type: number, minimum: 0, description: Unit price (tax-exclusive for TRADE) with at most four decimals }
    SetLinesResponse:
      type: object
      required: [saved, outcomes]
      properties:
        saved: { type: boolean }
        outcomes:
          type: array
          items: { $ref: '#/components/schemas/LineOutcome' }
    LineOutcome:
      type: object
      required: [skuId, uomCode, tierFromQty, ok]
      properties:
        skuId: { type: string, format: uuid }
        uomCode: { type: string }
        tierFromQty: { type: number }
        ok: { type: boolean }
        reason: { type: [string, 'null'], description: The message id of the refusal }
        review: { type: [string, 'null'], description: The message id of a review raised on an accepted line }
    PriceListResponse:
      type: object
      required: [priceListId, rootPriceListId, kind, name, version, status, createdAt]
      properties:
        priceListId: { type: string, format: uuid }
        rootPriceListId: { type: string, format: uuid, description: The id of version 1 that a relationship binds }
        ownerEntityId: { type: string, format: uuid }
        kind: { type: string, enum: [TRADE, RETAIL, ADVISORY] }
        name: { type: string }
        version: { type: integer }
        sourceVersionId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [DRAFT, PUBLISHED, SUPERSEDED, WITHDRAWN] }
        applyFrom: { type: [string, 'null'], format: date }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    PriceListLineResponse:
      type: object
      required: [lineId, skuId, uomCode, tierFromQty, price, effectiveFrom]
      properties:
        lineId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        uomCode: { type: string }
        tierFromQty: { type: number }
        price: { type: number }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    PriceListDetailResponse:
      type: object
      required: [list, lines]
      properties:
        list: { $ref: '#/components/schemas/PriceListResponse' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PriceListLineResponse' }
    TradePriceResponse:
      type: object
      required: [relationshipId, priceListId, lineId, skuId, uomCode, tierFromQty, unitPrice, engineVersion]
      properties:
        relationshipId: { type: string, format: uuid }
        priceListId: { type: string, format: uuid, description: The version the price was read from }
        lineId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        uomCode: { type: string }
        tierFromQty: { type: number }
        unitPrice: { type: number, description: Per unit and tax-exclusive with four decimals }
        engineVersion: { type: string }
