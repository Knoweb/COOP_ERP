          type: [string, 'null']
          description: CONTROL_PRICE or MRP, the binding ceiling of a RETAIL or ADVISORY line (refused or not), or the MRP a TRADE line is reviewed against
        ceilingValue: { type: [number, 'null'] }
        ceilingRef: { type: [string, 'null'], description: 'The gazette reference of a control price, the batch number of an MRP' }
