        capReason: { type: string, enum: [NONE, MRP_LOWEST, MRP_BARCODE, MRP_PICKED, CONTROL_PRICE] }
        policy: { type: string, enum: [AUTO_LOWEST, BARCODE_RESOLVED, PICKER] }
