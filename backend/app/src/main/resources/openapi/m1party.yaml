    GrantExternalViewRequest:
      type: object
      required: [granteeUserId, scopeEntityIds, validUntil, reason]
      properties:
        granteeUserId:
          type: string
          format: uuid
        scopeEntityIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
