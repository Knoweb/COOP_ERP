openapi: 3.1.0

info:
  title: COOP ERP M1 Party API
  version: 0.1.0

paths:

  /v1/party/entities:

    get:
      tags: [Entities]
      operationId: listEntities
      summary: List entities visible in the caller's scope
      x-permission: gov.entity.view
      parameters:

        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - ONBOARDING
              - ACTIVE
              - SUSPENDED

        - in: query
          name: district
          required: false
          schema:
            type: string
            maxLength: 40

        - in: query
          name: cursor
          required: false
          schema:
            type: string
            format: uuid

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50

      responses:

        '200':
          description: Entity page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPage'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'


    post:
      tags: [Entities]
      operationId: registerEntity
      summary: Register an entity in ONBOARDING status
      x-permission: gov.entity.register
      x-scope: FEDERATION

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEntityRequest'

      responses:

        '201':
          description: Entity registered
          headers:
            Location:
              description: Address of the registered entity
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/entities/{entityId}:

    get:
      tags: [Entities]
      operationId: getEntity
      summary: Get one entity visible in the caller's scope
      x-permission: gov.entity.view

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

      responses:

        '200':
          description: Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'

        '404':
          description: Entity does not exist or is not visible to this scope


  /v1/party/entities/{entityId}/activate:

    post:
      tags: [Entities]
      operationId: activateEntity
      summary: Activate an onboarding entity
      x-permission: gov.entity.activate
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      responses:

        '204':
          description: Entity activated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/entities/{entityId}/responsible-officer:

    put:
      tags: [Entities]
      operationId: appointResponsibleOfficer
      summary: Appoint or change the responsible officer for an entity
      x-permission: gov.user.manage
      x-mfa: true

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointResponsibleOfficerRequest'

      responses:

        '204':
          description: Responsible officer updated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '404':
          description: Entity does not exist

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/party/entities/{entityId}/suspend:

    post:
      tags: [Entities]
      operationId: suspendEntity
      summary: Suspend an active entity
      x-permission: gov.entity.suspend
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityReasonRequest'

      responses:

        '204':
          description: Entity suspended

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/entities/{entityId}/reinstate:

    post:
      tags: [Entities]
      operationId: reinstateEntity
      summary: Reinstate a suspended entity
      x-permission: gov.entity.suspend
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityReasonRequest'

      responses:

        '204':
          description: Entity reinstated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/bulk-register:
    post:
      tags: [Bulk]
      operationId: bulkRegister
      summary: Register the entities of a CSV file, all or none, and answer a validation report
      description: >
        The file is UTF-8 text with a header row; the columns are the fields of
        RegisterEntityRequest in snake case (entity_code, entity_type, legal_name_en, legal_name_si,
        legal_name_ta, registration_no, vat_registration_no, district, default_language,
        financial_year_start_month); the first three are required. Every row is validated first;
        when any row has a problem nothing is registered and the report says which rows and why;
        when every row passes, all are registered in one transaction (M1-11, 21A section 5).
      x-permission: gov.entity.register
      x-scope: FEDERATION

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV file

      responses:

        '200':
          description: The validation report; status REGISTERED or REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkValidationReport'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'




  /v1/party/locations:

    get:
      tags: [Locations]
      operationId: listLocations
      summary: List the locations visible in the caller's scope
      x-permission: prt.location.view
      parameters:

        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [PLANNED, ONBOARDING, ACTIVE, DORMANT]

        - in: query
          name: locationType
          required: false
          schema:
            type: string
            enum: [WAREHOUSE, SHOP, OFFICE]

        - in: query
          name: cursor
          required: false
          schema:
            type: string
            format: uuid

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50

      responses:

        '200':
          description: Location page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPage'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Locations]
      operationId: registerLocation
      summary: Register a location of the caller's entity in PLANNED status
      description: >
        The owner is the caller's entity, which must be ACTIVE or ONBOARDING, and the caller acts
        entity-wide. A SHOP gets its location numbering series at once (GRN, WOF, CNT, RPK, XFR);
        a warehouse or an office numbers from the entity's series.
      x-permission: prt.location.register

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterLocationRequest'

      responses:

        '201':
          description: Location registered
          headers:
            Location:
              description: Address of the registered location
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/locations/{locationId}:

    get:
      tags: [Locations]
      operationId: getLocation
      summary: Get one location visible in the caller's scope
      x-permission: prt.location.view

      parameters:
        - $ref: '#/components/parameters/LocationId'

      responses:

        '200':
          description: Location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'

        '404':
          description: Location does not exist or is not visible to this scope

    put:
      tags: [Locations]
      operationId: updateLocation
      summary: Replace the descriptive facts of a location (names, address, language, hours, size band)
      description: >
        The code and the type are not changed here: the code is part of every document number of
        the location, and the type decides which series it has.
      x-permission: prt.location.register

      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'

      responses:

        '204':
          description: Location updated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/locations/{locationId}/connectivity:

    post:
      tags: [Locations]
      operationId: confirmLocationConnectivity
      summary: Record that the location meets the connectivity specification
      description: >
        A fact, not a toggle (21A section 8): the audit record says who confirmed it and when.
      x-permission: prt.location.activate

      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      responses:

        '204':
          description: Connectivity confirmed

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/locations/{locationId}/start-onboarding:

    post:
      tags: [Locations]
      operationId: startLocationOnboarding
      summary: Move a PLANNED location to ONBOARDING
      x-permission: prt.location.activate

      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      responses:

        '204':
          description: Location onboarding

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/locations/{locationId}/activate:

    post:
      tags: [Locations]
      operationId: activateLocation
      summary: Activate an ONBOARDING location
      description: >
        The connectivity gate must be met; a SHOP also needs a primary till and at least one
        operator (a till user assigned at the shop).
      x-permission: prt.location.activate

      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      responses:

        '204':
          description: Location activated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/locations/{locationId}/mark-dormant:

    post:
      tags: [Locations]
      operationId: markLocationDormant
      summary: Close an ACTIVE location for trading (DORMANT), with a reason
      x-permission: prt.location.activate

      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'

      responses:

        '204':
          description: Location dormant

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/locations/{locationId}/reactivate:

    post:
      tags: [Locations]
      operationId: reactivateLocation
      summary: Bring a DORMANT location back to ACTIVE
      x-permission: prt.location.activate

      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      responses:

        '204':
          description: Location active again

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/locations/{locationId}/primary-till:

    put:
      tags: [Locations]
      operationId: setPrimaryTill
      summary: Name the till position that holds the shop's location series
      description: >
        The position must be an ACTIVE position of this location. When a device is assigned to
        it, the counters of the location series move to that device (the kernel records
        series.holder_changed.v1).
      x-permission: prt.location.primary
      x-mfa: true

      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPrimaryTillRequest'

      responses:

        '204':
          description: Primary till set

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/locations/{locationId}/positions:

    get:
      tags: [Locations]
      operationId: listTillPositions
      summary: List the till positions of a location, retired ones included
      x-permission: prt.location.view

      parameters:
        - $ref: '#/components/parameters/LocationId'

      responses:

        '200':
          description: The positions, by number
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TillPositionResponse'

    post:
      tags: [Locations]
      operationId: registerTillPosition
      summary: Register a till position at a shop and its till numbering series
      description: >
        The location must be a SHOP and the number unused there, retired positions included. The
        position gets the series of every till-numbered document type (RCT, CPR).
      x-permission: prt.position.manage

      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTillPositionRequest'

      responses:

        '201':
          description: Position registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TillPositionResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/till-positions/{tillPositionId}/retire:

    post:
      tags: [Locations]
      operationId: retireTillPosition
      summary: Retire a till position for good and close its series
      x-permission: prt.position.manage

      parameters:

        - in: path
          name: tillPositionId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      responses:

        '204':
          description: Position retired

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/security/external-grants:

    get:
      tags: [Grants]
      operationId: listExternalGrants
      summary: The Federation's register of external grants, active, expired and revoked
      x-permission: gov.external.grant
      x-scope: FEDERATION

      responses:

        '200':
          description: Every grant the caller's scope can see, latest end first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGrantList'

    post:
      tags: [Grants]
      operationId: grantExternalView
      summary: Give an external user read-only access to entities until a date
      description: >
        Doc 21 section 4.6 and flow 6.5. The grantee must be a user of kind EXTERNAL; the grant
        ends no later than the configured maximum after it starts (m1.external_grant.max_months,
        12 by default and at most). A missing or past validFrom starts the grant now.
      x-permission: gov.external.grant
      x-mfa: true
      x-scope: FEDERATION

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantExternalViewRequest'

      responses:

        '201':
          description: Grant issued
          headers:
            Location:
              description: Address of the register of grants
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGrantResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/security/external-grants/{grantId}/revoke:

    post:
      tags: [Grants]
      operationId: revokeExternalView
      summary: End an active external grant now
      x-permission: gov.external.grant
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: grantId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeExternalViewRequest'

      responses:

        '204':
          description: Grant revoked

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/party/relationships:

    get:
      tags: [Relationships]
      operationId: listRelationships
      summary: The relationships in which the caller's entity is seller, buyer or either
      description: >
        Every row of every status, ordered by counterparty and effective date, so the history of
        a pair reads in order (ListRelationships, 21A section 7). Row-level security decides
        what the caller sees: its own relationships as seller or buyer; the Federation view
        sees every relationship.
      x-permission: prt.relationship.view

      parameters:
        - in: query
          name: side
          required: false
          schema:
            type: string
            enum: [SELLER, BUYER]

      responses:

        '200':
          description: The relationships, as rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelationshipResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Relationships]
      operationId: openTradingRelationship
      summary: Open a trading relationship in DRAFT, the caller's entity selling
      description: >
        The seller is the caller's entity. Codes: m1.relationship.seller_scope_required,
        m1.relationship.self, m1.relationship.buyer_not_found, m1.relationship.party_not_trading,
        m1.relationship.tier_not_allowed, m1.relationship.effective_range_invalid,
        m1.relationship.allocation_rule_invalid, m1.relationship.overlap.
      x-permission: prt.relationship.open

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenRelationshipRequest'

      responses:

        '201':
          description: Relationship opened in DRAFT
          headers:
            Location:
              description: Address of the new relationship
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/party/relationships/{relationshipId}:

    get:
      tags: [Relationships]
      operationId: getRelationship
      summary: One relationship row visible in the caller's scope
      x-permission: prt.relationship.view

      parameters:
        - in: path
          name: relationshipId
          required: true
          schema:
            type: string
            format: uuid

      responses:

        '200':
          description: The relationship row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipResponse'

        '404':
          description: The relationship does not exist or is not visible to this scope

  /v1/party/relationships/{relationshipId}/activate:

    post:
      tags: [Relationships]
      operationId: activateRelationship
      summary: Put a DRAFT relationship into force
      description: >
        Codes: m1.relationship.not_found, m1.relationship.not_seller, m1.relationship.not_draft,
        m1.relationship.price_list_required, m1.relationship.payment_terms_required,
        m1.relationship.price_list_refused (M3's reason in params.reason),
        m1.relationship.overlap.
      x-permission: prt.relationship.activate

      parameters:
        - in: path
          name: relationshipId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      responses:

        '204':
          description: Relationship activated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/party/relationships/{relationshipId}/amend:

    post:
      tags: [Relationships]
      operationId: amendRelationshipTerms
      summary: Amend the terms of an ACTIVE relationship from a date
      description: >
        Effective-dated: the current row is closed the day before effectiveFrom and a new ACTIVE
        row carries the new terms; the answer is the new row. A term left out keeps its current
        value. A credit_limit change additionally requires bil.creditlimit.change with a fresh
        second factor (mfa.required when stale). Codes: m1.relationship.not_found,
        m1.relationship.not_active, m1.relationship.not_seller,
        m1.relationship.effective_from_not_after, m1.relationship.effective_from_after_end,
        m1.relationship.credit_limit_permission_required, mfa.required,
        m1.relationship.reason_required, m1.relationship.terms_unchanged,
        m1.relationship.allocation_rule_invalid, m1.relationship.overlap.
      x-permission: prt.relationship.amend

      parameters:
        - in: path
          name: relationshipId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendTermsRequest'

      responses:

        '201':
          description: The new row that carries the amended terms
          headers:
            Location:
              description: Address of the new row
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/party/relationships/{relationshipId}/suspend:

    post:
      tags: [Relationships]
      operationId: suspendRelationship
      summary: Suspend an ACTIVE relationship; open documents are unaffected
      description: >
        Codes: m1.relationship.not_found, m1.relationship.not_seller, m1.relationship.not_active,
        m1.relationship.reason_required.
      x-permission: prt.relationship.suspend
      x-mfa: true

      parameters:
        - in: path
          name: relationshipId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipReasonRequest'

      responses:

        '204':
          description: Relationship suspended

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/security/users:

    get:
      tags: [Users]
      operationId: listUsers
      summary: List the users the caller's scope may see
      description: >
        An entity-wide scope sees every user of its entity; a shop-scoped one the users that
        work at that shop (an assignment there or an entity-wide one), never a sibling shop's
        operators. Never a PIN or its hash.
      x-permission: gov.user.view
      parameters:

        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [PENDING, ACTIVE, LOCKED, DEACTIVATED]

        - in: query
          name: userKind
          required: false
          schema:
            type: string
            enum: [BACK_OFFICE, TILL, BOTH, EXTERNAL]

        - in: query
          name: cursor
          required: false
          schema:
            type: string
            format: uuid

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50

      responses:

        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user of the caller's entity and its login at the identity provider
      description: >
        The user starts PENDING with no credential; issue the first one with reset-credential.
        422 codes: m1.user.entity_scope_required, m1.user.home_entity_out_of_scope,
        m1.user.kind_invalid, m1.user.external_federation_only, m1.user.language_invalid,
        m1.user.username_invalid, m1.user.username_taken, m1.user.display_name_required,
        m1.user.succeeds_invalid, identity.username_taken, identity.unavailable.
      x-permission: gov.user.manage
      x-mfa: true

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'

      responses:

        '201':
          description: User created
          headers:
            Location:
              description: Address of the created user
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/security/users/{userId}:

    get:
      tags: [Users]
      operationId: getUser
      summary: Get one user visible in the caller's scope
      x-permission: gov.user.view

      parameters:

        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid

      responses:

        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '404':
          description: User does not exist or is not visible to this scope

    put:
      tags: [Users]
      operationId: updateUser
      summary: Change a user's name shown, language and kind
      description: >
        422 codes: m1.user.not_found, m1.user.deactivated, m1.user.display_name_required,
        m1.user.language_invalid, m1.user.kind_invalid, m1.user.kind_change_invalid.
      x-permission: gov.user.manage
      x-mfa: true

      parameters:

        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'

      responses:

        '200':
          description: User changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/security/users/{userId}/reset-credential:

    post:
      tags: [Users]
      operationId: resetCredential
      summary: Issue a temporary password, reset the second factor, or set the till PIN
      description: >
        PASSWORD answers the one-time password in temporaryPassword (delivery RETURNED) unless
        a notification rule delivered it (NOTIFIED); a replay of the same request does not
        repeat it. PIN needs pin, checked against the entity's PIN policy. A PENDING or LOCKED
        user becomes ACTIVE with a new password or PIN.
        422 codes: m1.user.not_found, m1.user.deactivated, m1.user.credential_invalid,
        m1.user.password_not_applicable, m1.user.no_login, m1.user.pin_not_applicable,
        m1.user.pin_required, m1.user.pin_digits_only, m1.user.pin_length, m1.user.pin_reused,
        identity.scope, identity.unavailable.
      x-permission: gov.user.manage
      x-mfa: true

      parameters:

        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetCredentialRequest'

      responses:

        '200':
          description: Credential issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResetResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/security/users/{userId}/deactivate:

    post:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate a user for good, disable the login and end its sessions
      description: >
        422 codes: m1.user.not_found, m1.user.deactivated, m1.user.reason_required,
        m1.user.last_user_manager, m1.user.responsible_officer, identity.scope,
        identity.unavailable.
      x-permission: gov.user.manage
      x-mfa: true

      parameters:

        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReasonRequest'

      responses:

        '204':
          description: User deactivated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'




components:

  schemas:

    RegisterEntityRequest:
      type: object

      required:
        - entityCode
        - entityType
        - legalNameEn
        - defaultLanguage
        - financialYearStartMonth

      properties:

        entityCode:
          type: string
          minLength: 1
          maxLength: 12

        entityType:
          type: string
          enum:
            - DISTRIBUTOR
            - MPCS

        legalNameEn:
          type: string
          minLength: 1

        legalNameSi:
          type:
            - string
            - 'null'

        legalNameTa:
          type:
            - string
            - 'null'

        registrationNo:
          type:
            - string
            - 'null'
          maxLength: 40

        vatRegistrationNo:
          type:
            - string
            - 'null'
          maxLength: 20

        district:
          type:
            - string
            - 'null'
          maxLength: 40

        defaultLanguage:
          type: string
          enum:
            - en
            - si
            - ta

        financialYearStartMonth:
          type: integer
          minimum: 1
          maximum: 12


    AppointResponsibleOfficerRequest:
      type: object

      required:
        - userId
        - dataGovernanceSignedOn

      properties:

        userId:
          type: string
          format: uuid

        dataGovernanceSignedOn:
          type: string
          format: date

    EntityReasonRequest:
      type: object

      required:
        - reasonCode

      properties:

        reasonCode:
          type: string
          minLength: 1

        reasonText:
          type:
            - string
            - 'null'


    EntityResponse:
      type: object

      required:
        - entityId
        - legalNameEn

      properties:

        entityId:
          type: string
          format: uuid

        entityCode:
          type:
            - string
            - 'null'

        entityType:
          type:
            - string
            - 'null'
          enum:
            - FEDERATION
            - DISTRIBUTOR
            - MPCS
            - null

        legalNameEn:
          type: string

        legalNameSi:
          type:
            - string
            - 'null'

        legalNameTa:
          type:
            - string
            - 'null'

        registrationNo:
          type:
            - string
            - 'null'

        vatRegistrationNo:
          type:
            - string
            - 'null'

        district:
          type:
            - string
            - 'null'

        financialYearStartMonth:
          type:
            - integer
            - 'null'

        defaultLanguage:
          type:
            - string
            - 'null'
          enum:
            - en
            - si
            - ta
            - null

        responsibleOfficerUserId:
          type:
            - string
            - 'null'
          format: uuid

        dataGovernanceSignedOn:
          type:
            - string
            - 'null'
          format: date

        status:
          type:
            - string
            - 'null'
          enum:
            - ONBOARDING
            - ACTIVE
            - SUSPENDED
            - null


    EntityPage:
      type: object

      required:
        - items

      properties:

        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityResponse'

        nextCursor:
          type:
            - string
            - 'null'
          format: uuid

    BulkValidationReport:
      type: object
      required: [status, rows, registered, rejected, results]
      properties:
        status:
          type: string
          enum: [REGISTERED, REJECTED]
        rows:
          type: integer
        registered:
          type: integer
        rejected:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkRowResult'

    BulkRowResult:
      type: object
      required: [line, entityCode, status, problems]
      properties:
        line:
          type: integer
          description: The line of the file the row starts on; the header is line 1
        entityCode:
          type: string
        status:
          type: string
          enum: [OK, ERROR]
        entityId:
          type:
            - string
            - 'null'
          format: uuid
        problems:
          type: array
          items:
            $ref: '#/components/schemas/BulkRowProblem'

    BulkRowProblem:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: The column of the file
        code:
          type: string
          description: A message id from the bulk.* catalogue

    TradingDay:
      type: object
      description: The hours of one day of the week; a day not listed is a closed day
      required: [day, opens, closes]
      properties:
        day:
          type: string
          enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
        opens:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time HH:mm
        closes:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local time HH:mm, after opens

    RegisterLocationRequest:
      type: object
      required: [locationCode, locationType, nameEn]
      properties:
        locationCode:
          type: string
          minLength: 1
          maxLength: 12
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]*$'
          description: Unique within the entity; part of every document number of the location
        locationType:
          type: string
          enum: [WAREHOUSE, SHOP, OFFICE]
        nameEn:
          type: string
          minLength: 1
          maxLength: 200
        nameSi:
          type: [string, 'null']
          maxLength: 200
        nameTa:
          type: [string, 'null']
          maxLength: 200
        address:
          type: [string, 'null']
          maxLength: 500
        district:
          type: [string, 'null']
          maxLength: 40
        geoLat:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        geoLng:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        language:
          type: [string, 'null']
          enum: [en, si, ta, null]
          description: The till and receipt language; the entity's default language when not given
        tradingHours:
          type: [array, 'null']
          maxItems: 7
          items:
            $ref: '#/components/schemas/TradingDay'
        sizeBand:
          type: [string, 'null']
          enum: [S, M, L, null]

    UpdateLocationRequest:
      type: object
      required: [nameEn]
      properties:
        nameEn:
          type: string
          minLength: 1
          maxLength: 200
        nameSi:
          type: [string, 'null']
          maxLength: 200
        nameTa:
          type: [string, 'null']
          maxLength: 200
        address:
          type: [string, 'null']
          maxLength: 500
        district:
          type: [string, 'null']
          maxLength: 40
        geoLat:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        geoLng:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        language:
          type: [string, 'null']
          enum: [en, si, ta, null]
        tradingHours:
          type: [array, 'null']
          maxItems: 7
          items:
            $ref: '#/components/schemas/TradingDay'
        sizeBand:
          type: [string, 'null']
          enum: [S, M, L, null]

    ReasonRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 40
        reasonText:
          type: [string, 'null']
          maxLength: 500

    SetPrimaryTillRequest:
      type: object
      required: [tillPositionId, reasonCode]
      properties:
        tillPositionId:
          type: string
          format: uuid
        reasonCode:
          type: string
          minLength: 1
          maxLength: 40
        reasonText:
          type: [string, 'null']
          maxLength: 500

    RegisterTillPositionRequest:
      type: object
      required: [positionNo]
      properties:
        positionNo:
          type: integer
          minimum: 1
          maximum: 99
          description: The till number at the shop (T1, T2 ...); never reused, retired positions included

    LocationResponse:
      type: object
      required: [locationId, ownerEntityId, locationCode, locationType, nameEn, connectivitySpecMet, status]
      properties:
        locationId:
          type: string
          format: uuid
        ownerEntityId:
          type: string
          format: uuid
        locationCode:
          type: string
        locationType:
          type: string
          enum: [WAREHOUSE, SHOP, OFFICE]
        nameEn:
          type: string
        nameSi:
          type: [string, 'null']
        nameTa:
          type: [string, 'null']
        address:
          type: [string, 'null']
        district:
          type: [string, 'null']
        geoLat:
          type: [number, 'null']
        geoLng:
          type: [number, 'null']
        language:
          type: [string, 'null']
          enum: [en, si, ta, null]
        tradingHours:
          type: array
          items:
            $ref: '#/components/schemas/TradingDay'
        sizeBand:
          type: [string, 'null']
          enum: [S, M, L, null]
        connectivitySpecMet:
          type: boolean
        primaryTillPositionId:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [PLANNED, ONBOARDING, ACTIVE, DORMANT]

    LocationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocationResponse'
        nextCursor:
          type: [string, 'null']
          format: uuid

    TillPositionResponse:
      type: object
      required: [tillPositionId, locationId, positionNo, status, primary]
      properties:
        tillPositionId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        positionNo:
          type: integer
        status:
          type: string
          enum: [ACTIVE, RETIRED]
        primary:
          type: boolean
          description: This position is the primary till of its location

    GrantExternalViewRequest:
      type: object
      required: [granteeUserId, scopeEntityIds, validUntil, reason]
      properties:
        granteeUserId:
          type: string
          format: uuid
        scopeEntityIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        validFrom:
          type:
            - string
            - 'null'
          format: date-time
        validUntil:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 500

    RevokeExternalViewRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ExternalGrantResponse:
      type: object
      required: [grantId, granteeUserId, scopeEntityIds, validFrom, validUntil, reason, status]
      properties:
        grantId:
          type: string
          format: uuid
        granteeUserId:
          type: string
          format: uuid
        scopeEntityIds:
          type: array
          items:
            type: string
            format: uuid
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        reason:
          type: string
        status:
          type: string
          enum: [ACTIVE, EXPIRED, REVOKED]

    ExternalGrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExternalGrantResponse'

    OpenRelationshipRequest:
      type: object
      required: [buyerEntityId, effectiveFrom]
      properties:
        buyerEntityId:
          type: string
          format: uuid
        priceListId:
          type:
            - string
            - 'null'
          format: uuid
          description: The seller's TRADE price list (M3); needed before activation
        creditLimit:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 999999999999.99
          description: Informative (ADR-12), in rupees
        paymentTermsDays:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 365
          description: Needed before activation
        discrepancyWindowDays:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 90
          description: Default 7
        orderLockHoursBeforeEta:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 720
          description: Default 24
        allocationRule:
          type:
            - string
            - 'null'
          enum: [FCFS, PRO_RATA, QUOTA, null]
          description: Default FCFS
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type:
            - string
            - 'null'
          format: date
          description: The last day; open-ended when left out

    AmendTermsRequest:
      type: object
      required: [effectiveFrom, reasonCode]
      properties:
        effectiveFrom:
          type: string
          format: date
          description: The first day of the new terms; after the current row's first day
        priceListId:
          type:
            - string
            - 'null'
          format: uuid
        creditLimit:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 999999999999.99
        paymentTermsDays:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 365
        discrepancyWindowDays:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 90
        orderLockHoursBeforeEta:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 720
        allocationRule:
          type:
            - string
            - 'null'
          enum: [FCFS, PRO_RATA, QUOTA, null]
        reasonCode:
          type: string
          minLength: 1
          maxLength: 60
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500

    RelationshipReasonRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 60
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500

    RelationshipResponse:
      type: object
      required:
        - relationshipId
        - sellerEntityId
        - buyerEntityId
        - discrepancyWindowDays
        - orderLockHoursBeforeEta
        - allocationRule
        - status
        - effectiveFrom
      properties:
        relationshipId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        priceListId:
          type:
            - string
            - 'null'
          format: uuid
        creditLimit:
          type:
            - number
            - 'null'
        paymentTermsDays:
          type:
            - integer
            - 'null'
        discrepancyWindowDays:
          type: integer
        orderLockHoursBeforeEta:
          type: integer
        allocationRule:
          type: string
          enum: [FCFS, PRO_RATA, QUOTA]
        status:
          type: string
          enum: [DRAFT, ACTIVE, SUSPENDED]
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type:
            - string
            - 'null'
          format: date

    CreateUserRequest:
      type: object
      required: [username, displayName, language, userKind]
      properties:
        homeEntityId:
          type:
            - string
            - 'null'
          format: uuid
          description: The caller's entity when left out; no other entity is accepted
        username:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
          description: The sign-in name, unique in the federation; stored in lower case
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        language:
          type: string
          enum: [en, si, ta]
        userKind:
          type: string
          enum: [BACK_OFFICE, TILL, BOTH, EXTERNAL]
        succeedsUserId:
          type:
            - string
            - 'null'
          format: uuid
          description: A deactivated user of the same entity this one succeeds (returning staff)

    UpdateUserRequest:
      type: object
      required: [displayName, language, userKind]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        language:
          type: string
          enum: [en, si, ta]
        userKind:
          type: string
          enum: [BACK_OFFICE, TILL, BOTH, EXTERNAL]

    ResetCredentialRequest:
      type: object
      required: [credential]
      properties:
        credential:
          type: string
          enum: [PASSWORD, SECOND_FACTOR, PIN]
        pin:
          type:
            - string
            - 'null'
          pattern: '^[0-9]{4,6}$'
          description: The new till PIN, with credential PIN only; the entity's policy may narrow the length

    UserReasonRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 40
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500

    CredentialResetResponse:
      type: object
      required: [userId, credential, status, delivery]
      properties:
        userId:
          type: string
          format: uuid
        credential:
          type: string
          enum: [PASSWORD, SECOND_FACTOR, PIN]
        status:
          type: string
          enum: [PENDING, ACTIVE, LOCKED, DEACTIVATED]
        delivery:
          type: string
          enum: [NOTIFIED, RETURNED, NONE]
          description: >
            RETURNED - the temporary password is in this response, this once; NOTIFIED - a
            notification rule delivered it; NONE - nothing to deliver
        temporaryPassword:
          type:
            - string
            - 'null'
          description: Only with delivery RETURNED; shown once, never stored by the platform

    UserResponse:
      type: object
      required: [userId, homeEntityId, username, displayName, language, userKind, status, pinSet]
      properties:
        userId:
          type: string
          format: uuid
        homeEntityId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        language:
          type: string
          enum: [en, si, ta]
        userKind:
          type: string
          enum: [BACK_OFFICE, TILL, BOTH, EXTERNAL]
        status:
          type: string
