          format: uuid
        granteeUserId:
          type: string
          format: uuid
        scopeEntityIds:
          type: array
          items:
            type: string
            format: uuid
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        reason:
          type: string
        status:
          type: string
          enum: [ACTIVE, EXPIRED, REVOKED]

    ExternalGrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExternalGrantResponse'

    OpenRelationshipRequest:
