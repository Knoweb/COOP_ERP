        creditLimit:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 999999999999.99
          description: Informative (ADR-12), in rupees
        paymentTermsDays:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 365
          description: Needed before activation
        discrepancyWindowDays:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 90
          description: Default 7
        orderLockHoursBeforeEta:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 720
          description: Default 24
        allocationRule:
          type:
            - string
            - 'null'
          enum: [FCFS, PRO_RATA, QUOTA, null]
          description: Default FCFS
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type:
            - string
            - 'null'
          format: date
          description: The last day; open-ended when left out

    AmendTermsRequest:
      type: object
      required: [effectiveFrom, reasonCode]
      properties:
        effectiveFrom:
          type: string
          format: date
          description: The first day of the new terms; after the current row's first day
        priceListId:
          type:
            - string
            - 'null'
          format: uuid
        creditLimit:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 999999999999.99
        paymentTermsDays:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 365
        discrepancyWindowDays:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 90
        orderLockHoursBeforeEta:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 720
        allocationRule:
          type:
            - string
            - 'null'
          enum: [FCFS, PRO_RATA, QUOTA, null]
        reasonCode:
          type: string
          minLength: 1
          maxLength: 60
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500

    RelationshipReasonRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 60
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500

    RelationshipResponse:
      type: object
      required:
        - relationshipId
        - sellerEntityId
        - buyerEntityId
        - discrepancyWindowDays
        - orderLockHoursBeforeEta
        - allocationRule
        - status
        - effectiveFrom
      properties:
        relationshipId:
          type: string
          format: uuid
        sellerEntityId:
          type: string
          format: uuid
        buyerEntityId:
          type: string
          format: uuid
        priceListId:
          type:
            - string
            - 'null'
          format: uuid
        creditLimit:
          type:
            - number
            - 'null'
        paymentTermsDays:
          type:
            - integer
            - 'null'
        discrepancyWindowDays:
          type: integer
        orderLockHoursBeforeEta:
          type: integer
        allocationRule:
          type: string
          enum: [FCFS, PRO_RATA, QUOTA]
        status:
          type: string
          enum: [DRAFT, ACTIVE, SUSPENDED]
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type:
            - string
            - 'null'
          format: date

    EnrolDeviceRequest:
      type: object
      required: [hardwareSerial, deviceKind, locationId, appVersion, stagingReference]
      properties:
        hardwareSerial:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
        deviceKind:
          type: string
          enum: [POS_TERMINAL, WORKSTATION, DRIVER_MOBILE]
        locationId:
          type: string
          format: uuid
        appVersion:
          $ref: '#/components/schemas/AppVersion'
        stagingReference:
          type: string
          minLength: 1
          maxLength: 64
          description: The management agent's staging record that attests the device (doc 31)

    AssignDeviceRequest:
      type: object
      required: [tillPositionId, reasonCode]
      properties:
        tillPositionId:
          type: string
          format: uuid
        reasonCode:
          type: string
          minLength: 1
          maxLength: 40
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500
        outboxLossRecorded:
          type: boolean
          default: false
          description: >
            Set when the device giving the position up cannot be shown drained: its loss is
            recorded, and the numbers it took and never sent become a documented gap.

    SuspendDeviceRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          enum: [LOST, STOLEN, FAULTY]
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500

    DeviceReasonRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 40
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500

    AppVersion:
      type: string
      pattern: '^[0-9]{1,5}(\.[0-9]{1,5}){0,3}$'
      maxLength: 20
      description: A till release number, dot-separated whole numbers (doc 31)

    DeviceResponse:
      type: object
      required: [deviceId, ownerEntityId, locationId, hardwareSerial, deviceKind, status, primaryTill]
      properties:
        deviceId:
          type: string
          format: uuid
        ownerEntityId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        hardwareSerial:
          type: string
        deviceKind:
          type: string
          enum: [POS_TERMINAL, WORKSTATION, DRIVER_MOBILE]
        status:
          type: string
          enum: [ENROLLED, ACTIVE, SUSPENDED, RETIRED]
        tillPositionId:
          type:
            - string
            - 'null'
          format: uuid
        positionNo:
          type:
            - integer
            - 'null'
        primaryTill:
          type: boolean
          description: Whether the position it holds is its shop's primary till
        appVersion:
          type:
            - string
            - 'null'
        enrolledAt:
          type:
            - string
            - 'null'
          format: date-time
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time

  parameters:

  parameters:

    LocationId:
      in: path
      name: locationId
      required: true
      schema:
        type: string
        format: uuid
