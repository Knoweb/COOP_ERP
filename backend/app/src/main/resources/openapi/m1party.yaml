openapi: 3.1.0

info:
  title: COOP ERP M1 Party API
  version: 0.1.0

paths:

  /v1/party/entities:

    get:
      tags: [Entities]
      operationId: listEntities
      summary: List entities visible in the caller's scope
      x-permission: gov.entity.view
      parameters:

        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - ONBOARDING
              - ACTIVE
              - SUSPENDED

        - in: query
          name: district
          required: false
          schema:
            type: string
            maxLength: 40

        - in: query
          name: cursor
          required: false
          schema:
            type: string
            format: uuid

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50

      responses:

        '200':
          description: Entity page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPage'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'


    post:
      tags: [Entities]
      operationId: registerEntity
      summary: Register an entity in ONBOARDING status
      x-permission: gov.entity.register
      x-scope: FEDERATION

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEntityRequest'

      responses:

        '201':
          description: Entity registered
          headers:
            Location:
              description: Address of the registered entity
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/entities/{entityId}:

    get:
      tags: [Entities]
      operationId: getEntity
      summary: Get one entity visible in the caller's scope
      x-permission: gov.entity.view

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

      responses:

        '200':
          description: Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'

        '404':
          description: Entity does not exist or is not visible to this scope


  /v1/party/entities/{entityId}/activate:

    post:
      tags: [Entities]
      operationId: activateEntity
      summary: Activate an onboarding entity
      x-permission: gov.entity.activate
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      responses:

        '204':
          description: Entity activated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/entities/{entityId}/responsible-officer:

    put:
      tags: [Entities]
      operationId: appointResponsibleOfficer
      summary: Appoint or change the responsible officer for an entity
      x-permission: gov.user.manage
      x-mfa: true

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointResponsibleOfficerRequest'

      responses:

        '204':
          description: Responsible officer updated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '404':
          description: Entity does not exist

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/party/entities/{entityId}/suspend:

    post:
      tags: [Entities]
      operationId: suspendEntity
      summary: Suspend an active entity
      x-permission: gov.entity.suspend
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityReasonRequest'

      responses:

        '204':
          description: Entity suspended

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/entities/{entityId}/reinstate:

    post:
      tags: [Entities]
      operationId: reinstateEntity
      summary: Reinstate a suspended entity
      x-permission: gov.entity.suspend
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityReasonRequest'

      responses:

        '204':
          description: Entity reinstated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/bulk-register:
    post:
      tags: [Bulk]
      operationId: bulkRegister
      summary: Register the entities of a CSV file, all or none, and answer a validation report
      description: >
        The file is UTF-8 text with a header row; the columns are the fields of
        RegisterEntityRequest in snake case (entity_code, entity_type, legal_name_en, legal_name_si,
        legal_name_ta, registration_no, vat_registration_no, district, default_language,
        financial_year_start_month); the first three are required. Every row is validated first;
        when any row has a problem nothing is registered and the report says which rows and why;
        when every row passes, all are registered in one transaction (M1-11, 21A section 5).
      x-permission: gov.entity.register
      x-scope: FEDERATION

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV file

      responses:

        '200':
          description: The validation report; status REGISTERED or REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkValidationReport'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/security/external-grants:

    get:
      tags: [Grants]
      operationId: listExternalGrants
      summary: The Federation's register of external grants, active, expired and revoked
      x-permission: gov.external.grant
      x-scope: FEDERATION

      responses:

        '200':
          description: Every grant the caller's scope can see, latest end first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGrantList'

    post:
      tags: [Grants]
      operationId: grantExternalView
      summary: Give an external user read-only access to entities until a date
      description: >
        Doc 21 section 4.6 and flow 6.5. The grantee must be a user of kind EXTERNAL; the grant
        ends no later than the configured maximum after it starts (m1.external_grant.max_months,
        12 by default and at most). A missing or past validFrom starts the grant now.
      x-permission: gov.external.grant
      x-mfa: true
      x-scope: FEDERATION

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantExternalViewRequest'

      responses:

        '201':
          description: Grant issued
          headers:
            Location:
              description: Address of the register of grants
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGrantResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/security/external-grants/{grantId}/revoke:

    post:
      tags: [Grants]
      operationId: revokeExternalView
      summary: End an active external grant now
      x-permission: gov.external.grant
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: grantId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeExternalViewRequest'

      responses:

        '204':
          description: Grant revoked

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


components:

  schemas:

    GrantExternalViewRequest:
      type: object
      required: [granteeUserId, scopeEntityIds, validUntil, reason]
      properties:
        granteeUserId:
          type: string
          format: uuid
        scopeEntityIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        validFrom:
          type:
            - string
            - 'null'
          format: date-time
        validUntil:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 500

    RevokeExternalViewRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ExternalGrantResponse:
      type: object
      required: [grantId, granteeUserId, scopeEntityIds, validFrom, validUntil, reason, status]
      properties:
        grantId:
          type: string
          format: uuid
        granteeUserId:
          type: string
          format: uuid
        scopeEntityIds:
          type: array
          items:
            type: string
            format: uuid
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        reason:
          type: string
        status:
          type: string
          enum: [ACTIVE, EXPIRED, REVOKED]

    ExternalGrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExternalGrantResponse'

    RegisterEntityRequest:
      type: object

      required:
        - entityCode
        - entityType
        - legalNameEn
        - defaultLanguage
        - financialYearStartMonth

      properties:

        entityCode:
          type: string
          minLength: 1
          maxLength: 12

        entityType:
          type: string
          enum:
            - DISTRIBUTOR
            - MPCS

        legalNameEn:
          type: string
          minLength: 1

        legalNameSi:
          type:
            - string
            - 'null'

        legalNameTa:
          type:
            - string
            - 'null'

        registrationNo:
          type:
            - string
            - 'null'
          maxLength: 40

        vatRegistrationNo:
          type:
            - string
            - 'null'
          maxLength: 20

        district:
          type:
            - string
            - 'null'
          maxLength: 40

        defaultLanguage:
          type: string
          enum:
            - en
            - si
            - ta

        financialYearStartMonth:
          type: integer
          minimum: 1
          maximum: 12


    AppointResponsibleOfficerRequest:
      type: object

      required:
        - userId
        - dataGovernanceSignedOn

      properties:

        userId:
          type: string
          format: uuid

        dataGovernanceSignedOn:
          type: string
          format: date

    EntityReasonRequest:
      type: object

      required:
        - reasonCode

      properties:

        reasonCode:
          type: string
          minLength: 1

        reasonText:
          type:
            - string
            - 'null'


    EntityResponse:
      type: object

      required:
        - entityId
        - legalNameEn

      properties:

        entityId:
          type: string
          format: uuid

        entityCode:
          type:
            - string
            - 'null'

        entityType:
          type:
            - string
            - 'null'
          enum:
            - FEDERATION
            - DISTRIBUTOR
            - MPCS
            - null

        legalNameEn:
          type: string

        legalNameSi:
          type:
            - string
            - 'null'

        legalNameTa:
          type:
            - string
            - 'null'

        registrationNo:
          type:
            - string
            - 'null'

        vatRegistrationNo:
          type:
            - string
            - 'null'

        district:
          type:
            - string
            - 'null'

        financialYearStartMonth:
          type:
            - integer
            - 'null'

        defaultLanguage:
          type:
            - string
            - 'null'
          enum:
            - en
            - si
            - ta
            - null

        responsibleOfficerUserId:
          type:
            - string
            - 'null'
          format: uuid

        dataGovernanceSignedOn:
          type:
            - string
            - 'null'
          format: date

        status:
          type:
            - string
            - 'null'
          enum:
            - ONBOARDING
            - ACTIVE
            - SUSPENDED
            - null


    EntityPage:
      type: object

      required:
        - items

      properties:

        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityResponse'

        nextCursor:
          type:
            - string
            - 'null'
          format: uuid

    BulkValidationReport:
      type: object
      required: [status, rows, registered, rejected, results]
      properties:
        status:
          type: string
          enum: [REGISTERED, REJECTED]
        rows:
          type: integer
        registered:
          type: integer
        rejected:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkRowResult'

    BulkRowResult:
      type: object
      required: [line, entityCode, status, problems]
      properties:
        line:
          type: integer
          description: The line of the file the row starts on; the header is line 1
        entityCode:
          type: string
        status:
          type: string
          enum: [OK, ERROR]
        entityId:
          type:
            - string
            - 'null'
          format: uuid
        problems:
          type: array
          items:
            $ref: '#/components/schemas/BulkRowProblem'

    BulkRowProblem:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: The column of the file
        code:
          type: string
          description: A message id from the bulk.* catalogue
