openapi: 3.1.0

info:
  title: COOP ERP M1 Party API
  version: 0.1.0

paths:

  /v1/party/entities:

    get:
      tags: [Entities]
      operationId: listEntities
      summary: List entities visible in the caller's scope
      x-permission: gov.entity.view
      parameters:

        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - ONBOARDING
              - ACTIVE
              - SUSPENDED

        - in: query
          name: district
          required: false
          schema:
            type: string
            maxLength: 40

        - in: query
          name: cursor
          required: false
          schema:
            type: string
            format: uuid

        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50

      responses:

        '200':
          description: Entity page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPage'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'


    post:
      tags: [Entities]
      operationId: registerEntity
      summary: Register an entity in ONBOARDING status
      x-permission: gov.entity.register
      x-scope: FEDERATION

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEntityRequest'

      responses:

        '201':
          description: Entity registered
          headers:
            Location:
              description: Address of the registered entity
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/entities/{entityId}:

    get:
      tags: [Entities]
      operationId: getEntity
      summary: Get one entity visible in the caller's scope
      x-permission: gov.entity.view

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

      responses:

        '200':
          description: Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityResponse'

        '404':
          description: Entity does not exist or is not visible to this scope


  /v1/party/entities/{entityId}/activate:

    post:
      tags: [Entities]
      operationId: activateEntity
      summary: Activate an onboarding entity
      x-permission: gov.entity.activate
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      responses:

        '204':
          description: Entity activated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/entities/{entityId}/responsible-officer:

    put:
      tags: [Entities]
      operationId: appointResponsibleOfficer
      summary: Appoint or change the responsible officer for an entity
      x-permission: gov.user.manage
      x-mfa: true

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointResponsibleOfficerRequest'

      responses:

        '204':
          description: Responsible officer updated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '404':
          description: Entity does not exist

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'

  /v1/party/entities/{entityId}/suspend:

    post:
      tags: [Entities]
      operationId: suspendEntity
      summary: Suspend an active entity
      x-permission: gov.entity.suspend
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityReasonRequest'

      responses:

        '204':
          description: Entity suspended

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/entities/{entityId}/reinstate:

    post:
      tags: [Entities]
      operationId: reinstateEntity
      summary: Reinstate a suspended entity
      x-permission: gov.entity.suspend
      x-mfa: true
      x-scope: FEDERATION

      parameters:

        - in: path
          name: entityId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityReasonRequest'

      responses:

        '204':
          description: Entity reinstated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/bulk-register:
    post:
      tags: [Bulk]
      operationId: bulkRegister
      summary: Register the entities of a CSV file, all or none, and answer a validation report
      description: >
        The file is UTF-8 text with a header row; the columns are the fields of
        RegisterEntityRequest in snake case (entity_code, entity_type, legal_name_en, legal_name_si,
        legal_name_ta, registration_no, vat_registration_no, district, default_language,
        financial_year_start_month); the first three are required. Every row is validated first;
        when any row has a problem nothing is registered and the report says which rows and why;
        when every row passes, all are registered in one transaction (M1-11, 21A section 5).
      x-permission: gov.entity.register
      x-scope: FEDERATION

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV file

      responses:

        '200':
          description: The validation report; status REGISTERED or REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkValidationReport'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/devices:

    get:
      tags: [Devices]
      operationId: listDevices
      summary: List the devices visible in the caller's scope, with the position each holds
      x-permission: sys.device.view

      parameters:

        - in: query
          name: locationId
          required: false
          schema:
            type: string
            format: uuid

        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [ENROLLED, ACTIVE, SUSPENDED, RETIRED]

      responses:

        '200':
          description: The devices, by location and serial
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'


    post:
      tags: [Devices]
      operationId: enrolDevice
      summary: Enrol a device at a location of the caller's entity, from its staging record
      x-permission: sys.device.enrol
      x-mfa: true

      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolDeviceRequest'

      responses:

        '201':
          description: Device enrolled
          headers:
            Location:
              description: Address of the enrolled device
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/devices/{deviceId}:

    get:
      tags: [Devices]
      operationId: getDevice
      summary: Get one device visible in the caller's scope
      x-permission: sys.device.view

      parameters:

        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid

      responses:

        '200':
          description: Device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'

        '404':
          description: Device does not exist or is not visible to this scope


  /v1/party/devices/{deviceId}/assign:

    post:
      tags: [Devices]
      operationId: assignDeviceToPosition
      summary: Assign a device to a till position; the position's counters move to it
      description: >
        A position still held by a suspended device is taken over (the replacement of a faulty
        or stolen till): its counters move to the new device, which needs the old device's
        outbox drained, or outboxLossRecorded set by the administrator to record its loss.
      x-permission: sys.device.enrol
      x-mfa: true

      parameters:

        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDeviceRequest'

      responses:

        '200':
          description: Device assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/devices/{deviceId}/suspend:

    post:
      tags: [Devices]
      operationId: suspendDevice
      summary: Suspend an active device (lost, stolen, faulty); the till is revoked
      x-permission: sys.device.suspend
      x-mfa: true

      parameters:

        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendDeviceRequest'

      responses:

        '204':
          description: Device suspended

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/devices/{deviceId}/reinstate:

    post:
      tags: [Devices]
      operationId: reinstateDevice
      summary: Reinstate a suspended device once it is physically recovered
      x-permission: sys.device.suspend
      x-mfa: true

      parameters:

        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceReasonRequest'

      responses:

        '204':
          description: Device reinstated

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


  /v1/party/devices/{deviceId}/retire:

    post:
      tags: [Devices]
      operationId: retireDevice
      summary: Retire an unassigned, wiped device for good; the till is revoked
      x-permission: sys.device.suspend
      x-mfa: true

      parameters:

        - in: path
          name: deviceId
          required: true
          schema:
            type: string
            format: uuid

        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceReasonRequest'

      responses:

        '204':
          description: Device retired

        '400':
          $ref: 'common.yaml#/components/responses/RequestProblem'

        '422':
          $ref: 'common.yaml#/components/responses/RuleBroken'


components:

  schemas:

    RegisterEntityRequest:
      type: object

      required:
        - entityCode
        - entityType
        - legalNameEn
        - defaultLanguage
        - financialYearStartMonth

      properties:

        entityCode:
          type: string
          minLength: 1
          maxLength: 12

        entityType:
          type: string
          enum:
            - DISTRIBUTOR
            - MPCS

        legalNameEn:
          type: string
          minLength: 1

        legalNameSi:
          type:
            - string
            - 'null'

        legalNameTa:
          type:
            - string
            - 'null'

        registrationNo:
          type:
            - string
            - 'null'
          maxLength: 40

        vatRegistrationNo:
          type:
            - string
            - 'null'
          maxLength: 20

        district:
          type:
            - string
            - 'null'
          maxLength: 40

        defaultLanguage:
          type: string
          enum:
            - en
            - si
            - ta

        financialYearStartMonth:
          type: integer
          minimum: 1
          maximum: 12


    AppointResponsibleOfficerRequest:
      type: object

      required:
        - userId
        - dataGovernanceSignedOn

      properties:

        userId:
          type: string
          format: uuid

        dataGovernanceSignedOn:
          type: string
          format: date

    EntityReasonRequest:
      type: object

      required:
        - reasonCode

      properties:

        reasonCode:
          type: string
          minLength: 1

        reasonText:
          type:
            - string
            - 'null'


    EntityResponse:
      type: object

      required:
        - entityId
        - legalNameEn

      properties:

        entityId:
          type: string
          format: uuid

        entityCode:
          type:
            - string
            - 'null'

        entityType:
          type:
            - string
            - 'null'
          enum:
            - FEDERATION
            - DISTRIBUTOR
            - MPCS
            - null

        legalNameEn:
          type: string

        legalNameSi:
          type:
            - string
            - 'null'

        legalNameTa:
          type:
            - string
            - 'null'

        registrationNo:
          type:
            - string
            - 'null'

        vatRegistrationNo:
          type:
            - string
            - 'null'

        district:
          type:
            - string
            - 'null'

        financialYearStartMonth:
          type:
            - integer
            - 'null'

        defaultLanguage:
          type:
            - string
            - 'null'
          enum:
            - en
            - si
            - ta
            - null

        responsibleOfficerUserId:
          type:
            - string
            - 'null'
          format: uuid

        dataGovernanceSignedOn:
          type:
            - string
            - 'null'
          format: date

        status:
          type:
            - string
            - 'null'
          enum:
            - ONBOARDING
            - ACTIVE
            - SUSPENDED
            - null


    EntityPage:
      type: object

      required:
        - items

      properties:

        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityResponse'

        nextCursor:
          type:
            - string
            - 'null'
          format: uuid

    BulkValidationReport:
      type: object
      required: [status, rows, registered, rejected, results]
      properties:
        status:
          type: string
          enum: [REGISTERED, REJECTED]
        rows:
          type: integer
        registered:
          type: integer
        rejected:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkRowResult'

    BulkRowResult:
      type: object
      required: [line, entityCode, status, problems]
      properties:
        line:
          type: integer
          description: The line of the file the row starts on; the header is line 1
        entityCode:
          type: string
        status:
          type: string
          enum: [OK, ERROR]
        entityId:
          type:
            - string
            - 'null'
          format: uuid
        problems:
          type: array
          items:
            $ref: '#/components/schemas/BulkRowProblem'

    BulkRowProblem:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: The column of the file
        code:
          type: string
          description: A message id from the bulk.* catalogue

    EnrolDeviceRequest:
      type: object
      required: [hardwareSerial, deviceKind, locationId, appVersion, stagingReference]
      properties:
        hardwareSerial:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
        deviceKind:
          type: string
          enum: [POS_TERMINAL, WORKSTATION, DRIVER_MOBILE]
        locationId:
          type: string
          format: uuid
        appVersion:
          $ref: '#/components/schemas/AppVersion'
        stagingReference:
          type: string
          minLength: 1
          maxLength: 64
          description: The management agent's staging record that attests the device (doc 31)

    AssignDeviceRequest:
      type: object
      required: [tillPositionId, reasonCode]
      properties:
        tillPositionId:
          type: string
          format: uuid
        reasonCode:
          type: string
          minLength: 1
          maxLength: 40
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500
        outboxLossRecorded:
          type: boolean
          default: false
          description: >
            Set when the device giving the position up cannot be shown drained: its loss is
            recorded, and the numbers it took and never sent become a documented gap.

    SuspendDeviceRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          enum: [LOST, STOLEN, FAULTY]
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500

    DeviceReasonRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          type: string
          minLength: 1
          maxLength: 40
        reasonText:
          type:
            - string
            - 'null'
          maxLength: 500

    AppVersion:
      type: string
      pattern: '^[0-9]{1,5}(\.[0-9]{1,5}){0,3}$'
      maxLength: 20
      description: A till release number, dot-separated whole numbers (doc 31)

    DeviceResponse:
      type: object
      required: [deviceId, ownerEntityId, locationId, hardwareSerial, deviceKind, status, primaryTill]
      properties:
        deviceId:
          type: string
          format: uuid
        ownerEntityId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        hardwareSerial:
          type: string
        deviceKind:
          type: string
          enum: [POS_TERMINAL, WORKSTATION, DRIVER_MOBILE]
        status:
          type: string
          enum: [ENROLLED, ACTIVE, SUSPENDED, RETIRED]
        tillPositionId:
          type:
            - string
            - 'null'
          format: uuid
        positionNo:
          type:
            - integer
            - 'null'
        primaryTill:
          type: boolean
          description: Whether the position it holds is its shop's primary till
        appVersion:
          type:
            - string
            - 'null'
        enrolledAt:
          type:
            - string
            - 'null'
          format: date-time
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
