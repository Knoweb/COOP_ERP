    LocationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LocationResponse'
        nextCursor:
          type: [string, 'null']
          format: uuid

    TillPositionResponse:
      type: object
      required: [tillPositionId, locationId, positionNo, status, primary]
      properties:
        tillPositionId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        positionNo:
          type: integer
        status:
          type: string
          enum: [ACTIVE, RETIRED]
        primary:
