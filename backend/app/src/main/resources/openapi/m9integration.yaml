# OpenAPI slice of M9 Integration (29A section 5), the demo scope: the journal exports (request,
# run history, lines, the file for the accounting package, the reconciliation, what waits for the
# next export) and the notification screens (templates and rules read, a federation rule activated
# or retired, the delivery log). The API clients, providers, e-invoicing and the bundle come with
# their tickets (module README). After changing this file run `make gen-clients` and commit
# web/src/generated/m9integration.ts.
openapi: 3.1.0
info:
  title: COOP ERP M9 Integration API
  version: 0.1.0
paths:
  /v1/integration/journal-exports:
    get:
      tags: [Integration]
      operationId: listJournalExports
      summary: The journal exports of the caller's scope, newest first (the run history)
      x-permission: int.journal.read
      responses:
        '200':
          description: The exports; an empty list when there are none
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JournalExportResponse' }
    post:
      tags: [Integration]
      operationId: requestJournalExport
      summary: Generate the journal of the caller's entity for a period
      description: >
        Takes every posting of the period that no earlier export took (each posting is exported
        once), builds the balanced journal, stores its file and records its totals and the SHA-256
        of that file. A period whose end is today or later in the business time zone is open and
        is refused unless the request says provisional; a provisional export is marked so in the
        list, the file name and the file, and what arrives later for its period is a supplement.
        Codes this operation can answer with 422: m9.journal.entity_required (a user of the whole
        entity), m9.journal.period_invalid, m9.journal.period_open, m9.journal.nothing_to_export,
        m9.journal.unbalanced, idempotency.request_mismatch.
      x-permission: int.journal.export
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestJournalExportRequest' }
      responses:
        '201':
          description: Generated
          headers:
            Location:
              description: Address of the new export
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalExportResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/integration/journal-exports/{exportId}:
    get:
      tags: [Integration]
      operationId: getJournalExport
      summary: One journal export
      x-permission: int.journal.read
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalExportResponse' }
        '404':
          description: No such export, or the caller's scope may not see it (the two look the same on purpose)
  /v1/integration/journal-exports/{exportId}/lines:
    get:
      tags: [Integration]
      operationId: listJournalLines
      summary: The lines of an export in their order
      x-permission: int.journal.read
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: The lines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JournalLineResponse' }
        '404':
          description: No such export, or the caller's scope may not see it
  /v1/integration/journal-exports/{exportId}/file:
    get:
      tags: [Integration]
      operationId: downloadJournalExport
      summary: The journal file for the accounting package (CSV, two entries per line)
      description: >
        entry, date, doc_type, doc_number, line_kind, side, account_role, debit, credit,
        document_id, export (FINAL or PROVISIONAL; format version 2); the debit entry and the
        credit entry of every line. The bytes stored when the export was generated, the same every
        time: the SHA-256 of this file is the export's contentHash. An export made before the file
        was stored is rebuilt by the frozen version-1 writer, without the export column.
      x-permission: int.journal.export
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: The CSV file
          content:
            text/csv:
              schema: { type: string }
        '404':
          description: No such export, or the caller's scope may not see it
  /v1/integration/journal-exports/{exportId}/reconciliation:
    get:
      tags: [Integration]
      operationId: getJournalReconciliation
      summary: Debits against credits, the totals by account role, and the check against what was recorded
      x-permission: int.journal.read
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: The reconciliation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationResponse' }
        '404':
          description: No such export, or the caller's scope may not see it
  /v1/integration/journal-postings/pending:
    get:
      tags: [Integration]
      operationId: getPendingPostings
      summary: What the next export over a period would take
      description: >
        The postings of the period that no export took yet. Codes this operation can answer with
        422: m9.journal.period_invalid.
      x-permission: int.journal.read
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: The count and the amount waiting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingPostingsResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/integration/journal-postings/supplement-due:
    get:
      tags: [Integration]
      operationId: getSupplementDue
      summary: Postings for periods already exported that no export took (the supplement due)
      description: >
        The postings no export took that are dated on or before the latest period end this entity
        has exported: what arrived late for a period the accountant already has a file for, through
        consumer lag, a replay or a provisional export of an open period. The next export over that
        period takes them as the supplement. Zero, with no dates, when nothing is due or nothing was
        ever exported.
      x-permission: int.journal.read
      responses:
        '200':
          description: The count and the amount due, their dates, and the latest period end exported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplementDueResponse' }
  /v1/integration/templates:
    get:
      tags: [Integration]
      operationId: listNotificationTemplates
      summary: The notification templates, in three languages
      x-permission: int.notify.view
      responses:
        '200':
          description: The templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationTemplateResponse' }
  /v1/integration/rules:
    get:
      tags: [Integration]
      operationId: listNotificationRules
      summary: The notification rules
      x-permission: int.notify.view
      responses:
        '200':
          description: The rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationRuleResponse' }
  /v1/integration/rules/{ruleId}/activate:
    post:
      tags: [Integration]
      operationId: activateNotificationRule
      summary: Activate a federation-wide rule
      description: >
        Codes this operation can answer with 422: m9.rule.federation_required, m9.rule.not_found,
        m9.rule.status_unchanged, m9.rule.template_inactive, idempotency.request_mismatch.
      x-permission: int.notify.manage
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RuleId'
      responses:
        '200':
          description: The rule as it now is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRuleResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/integration/rules/{ruleId}/retire:
    post:
      tags: [Integration]
      operationId: retireNotificationRule
      summary: Retire a federation-wide rule
      description: >
        Codes this operation can answer with 422: m9.rule.federation_required, m9.rule.not_found,
        m9.rule.status_unchanged, idempotency.request_mismatch.
      x-permission: int.notify.manage
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RuleId'
      responses:
        '200':
          description: The rule as it now is
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationRuleResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/integration/notifications/log:
    get:
      tags: [Integration]
      operationId: listNotificationLog
      summary: The delivery log of the caller's scope, newest first
      description: >
        The kernel's log: status, attempts, the reason of a suppression, the last error; the
        recipient as the beginning of its hash, never the address or the number (ADR-27).
        Codes this operation can answer with 422: m9.log.status_invalid.
      x-permission: int.notify.view
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [QUEUED, SENT, FAILED, SUPPRESSED] }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: The log rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationLogResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/integration/hr/employees:
    get:
      tags: [Integration]
      operationId: listEmployees
      summary: List employees within caller's scope
      x-permission: int.payroll.view
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmployeeResponse' }
    post:
      tags: [Integration]
      operationId: registerEmployee
      summary: Register or update an employee profile
      x-permission: int.employee.manage
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterEmployeeRequest' }
      responses:
        '201':
          description: Employee registered or updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/integration/hr/employees/{employeeId}:
    get:
      tags: [Integration]
      operationId: getEmployee
      summary: Get employee profile by ID
      x-permission: int.payroll.view
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Employee details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeResponse' }
        '404':
          description: Employee not found
  /v1/integration/attendance/import:
    post:
      tags: [Integration]
      operationId: importAttendance
      summary: Batch import biometric punch records from attendance devices
      x-permission: int.attendance.import
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportAttendanceRequest' }
      responses:
        '200':
          description: Import results summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceImportResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/integration/attendance:
    get:
      tags: [Integration]
      operationId: listAttendance
      summary: List attendance records
      x-permission: int.payroll.view
      parameters:
        - in: query
          name: businessDate
          required: false
          schema: { type: string, format: date }
        - in: query
          name: employeeId
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceRecordResponse' }
  /v1/integration/overtime:
    get:
      tags: [Integration]
      operationId: listOvertimeCalculations
      summary: List overtime calculations
      x-permission: int.payroll.view
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [PENDING_APPROVAL, APPROVED, REJECTED, NO_OT_EARNED] }
        - in: query
          name: businessDate
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: List of overtime calculations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OvertimeCalculationResponse' }
  /v1/integration/overtime/{calculationId}/approve:
    post:
      tags: [Integration]
      operationId: approveOvertime
      summary: Approve overtime calculation for payroll contribution
      x-permission: int.overtime.approve
      parameters:
        - in: path
          name: calculationId
          required: true
          schema: { type: string, format: uuid }
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveOvertimeRequest' }
      responses:
        '200':
          description: Approved payroll contribution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollContributionResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '404':
          description: Calculation not found
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/integration/payroll-contributions:
    get:
      tags: [Integration]
      operationId: listPayrollContributions
      summary: List approved payroll contributions
      x-permission: int.payroll.view
      parameters:
        - in: query
          name: payrollPeriod
          required: false
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: List of payroll contributions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PayrollContributionResponse' }
  /v1/integration/payroll-contributions/summary:
    get:
      tags: [Integration]
      operationId: getPayrollContributionSummary
      summary: Summary totals of approved payroll contributions for a period
      x-permission: int.payroll.view
      parameters:
        - in: query
          name: payrollPeriod
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: Period summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayrollContributionSummaryResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }

  /v1/integration/delivery/locations:
    post:
      tags: [Integration]
      operationId: recordVehicleLocation
      summary: Real-time GPS location update for a delivery vehicle or mobile device
      x-permission: int.delivery.track
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordVehicleLocationRequest' }
      responses:
        '201':
          description: Location recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleLocationResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }

  /v1/integration/delivery/vehicles/live:
    get:
      tags: [Integration]
      operationId: listLiveVehicleLocations
      summary: Latest GPS locations for all active delivery vehicles
      x-permission: int.delivery.view
      responses:
        '200':
          description: List of latest vehicle locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LiveVehicleLocationResponse' }

  /v1/integration/delivery/vehicles/{vehicleId}/live:
    get:
      tags: [Integration]
      operationId: getLiveVehicleLocation
      summary: Latest GPS location for a specific vehicle
      x-permission: int.delivery.view
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Latest vehicle location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveVehicleLocationResponse' }
        '404':
          description: Vehicle not found or no location recorded

  /v1/integration/delivery/vehicles/{vehicleId}/route:
    get:
      tags: [Integration]
      operationId: getVehicleRouteHistory
      summary: End-of-day GPS route history for a vehicle on a given date
      x-permission: int.delivery.view
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema: { type: string }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Route history points
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleRouteHistoryResponse' }

  /v1/integration/delivery/trips:
    post:
      tags: [Integration]
      operationId: createDeliveryTrip
      summary: Create and schedule a delivery trip
      x-permission: int.delivery.manage
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeliveryTripRequest' }
      responses:
        '201':
          description: Trip scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTripResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }

  /v1/integration/delivery/trips/{tripId}/complete:
    post:
      tags: [Integration]
      operationId: completeDeliveryTrip
      summary: Complete an end-of-day delivery trip with final odometer reading
      x-permission: int.delivery.manage
      parameters:
        - in: path
          name: tripId
          required: true
          schema: { type: string, format: uuid }
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteDeliveryTripRequest' }
      responses:
        '200':
          description: Trip completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTripResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }

  /v1/integration/delivery/trips/{tripId}/drops:
    post:
      tags: [Integration]
      operationId: recordDeliveryDrop
      summary: Schedule a package drop on a delivery trip
      x-permission: int.delivery.manage
      parameters:
        - in: path
          name: tripId
          required: true
          schema: { type: string, format: uuid }
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordDeliveryDropRequest' }
      responses:
        '201':
          description: Delivery drop scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryDropResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }

  /v1/integration/delivery/drops/{deliveryId}/status:
    post:
      tags: [Integration]
      operationId: updateDeliveryStatus
      summary: Update status of a package drop
      x-permission: int.delivery.manage
      parameters:
        - in: path
          name: deliveryId
          required: true
          schema: { type: string, format: uuid }
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDeliveryStatusRequest' }
      responses:
        '200':
          description: Delivery status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryDropResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }

  /v1/integration/delivery/reports/daily:
    get:
      tags: [Integration]
      operationId: getDailyDeliverySummary
      summary: End-of-day delivery summary report for a given date
      x-permission: int.delivery.view
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
        - in: query
          name: locationId
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Daily delivery summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyDeliverySummaryResponse' }

  /v1/integration/delivery/reports/monthly:
    get:
      tags: [Integration]
      operationId: getMonthlyDeliveryReport
      summary: Month-end routine delivery report reconciling trips and drops
      x-permission: int.delivery.view
      parameters:
        - in: query
          name: period
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        - in: query
          name: locationId
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Monthly delivery report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyDeliveryReportResponse' }
components:
  parameters:
    ExportId:
      in: path
      name: exportId
      required: true
      schema: { type: string, format: uuid }
    RuleId:
      in: path
      name: ruleId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    RequestJournalExportRequest:
      type: object
      required: [periodFrom, periodTo]
      properties:
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        provisional:
          type: boolean
          default: false
          description: >
            The caller knows the period is still open (periodTo is today or later in the business
            time zone) and wants the file anyway, marked PROVISIONAL. Without it an open period is
            refused (m9.journal.period_open).
    JournalExportResponse:
      type: object
      required: [exportId, periodFrom, periodTo, format, status, provisional, lineCount, totalDebit, totalCredit,
        contentHash, generatedAt]
      properties:
        exportId: { type: string, format: uuid }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        format: { type: string, enum: [JSON, CSV, ADAPTER] }
        status: { type: string, enum: [REQUESTED, GENERATED, FAILED, ACKNOWLEDGED, SUPERSEDED] }
        provisional:
          type: boolean
          description: the period was open when the export was made; its file carries the PROVISIONAL mark
        lineCount: { type: integer }
        totalDebit: { type: number }
        totalCredit: { type: number }
        contentHash: { type: string, description: SHA-256 of the journal file in lower-case hex }
        generatedAt:
          type: string
          format: date-time
          description: An instant in UTC (ends in Z). Convert to local time on the screen only.
    JournalLineResponse:
      type: object
      required: [seq, documentId, docType, docNumber, lineKind, side, debitRole, creditRole, amount, businessDate]
      properties:
        seq: { type: integer }
        documentId: { type: string, format: uuid }
        docType: { type: string }
        docNumber: { type: string }
        lineKind: { type: string }
        side: { type: string, enum: [SELLER, BUYER] }
        debitRole: { type: string }
        creditRole: { type: string }
        amount: { type: number }
        businessDate: { type: string, format: date }
        reference: { type: [string, 'null'] }
    ReconciliationResponse:
      type: object
      required: [exportId, lineCount, totalDebit, totalCredit, balanced, matchesRecordedTotals, matchesRecordedHash,
        accounts]
      properties:
        exportId: { type: string, format: uuid }
        lineCount: { type: integer }
        totalDebit: { type: number }
        totalCredit: { type: number }
        balanced: { type: boolean, description: debits equal credits in total and over the account roles }
        matchesRecordedTotals: { type: boolean }
        matchesRecordedHash: { type: boolean }
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountTotalResponse' }
    AccountTotalResponse:
      type: object
      required: [role, debit, credit]
