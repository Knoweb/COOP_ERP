# M5 Inventory, Costing, Repack & Loss API slice (25A section 5).
#
# The reads of 25A section 7 that the demo needs: a location's balances by lot, with the FEFO
# rank, and the availability of SKUs at locations. Every operation names its permission in
# x-permission; the kernel checks it for every GET (ReadPermissionInterceptor). The unit cost is
# in a balance only for an owner's user, never for a till and never for a read-only class
# (25A section 5: "unitCost? (OWN only)"; section 9: "till-scoped balances carry no cost").
# After changing this file run `sh tools/gen-clients.sh` and commit web/src/generated/m5inventory.ts.
openapi: 3.1.0
info:
  title: COOP ERP M5 Inventory API
  version: 0.1.0
paths:
  /v1/inventory/locations/{locationId}/balances:
    get:
      tags: [Inventory]
      operationId: listBalances
      summary: The lots of one location, GOOD lots in FEFO order first
      description: >
        Lots with a quantity other than zero, unless includeZero. fefoRank ranks the GOOD lots
        with stock by expiry (none last) and then by when they were received; it is absent on a
        DAMAGED, empty or negative lot. A location the caller's scope does not read answers an
        empty list.
      x-permission: inv.stock.view
      parameters:
        - in: path
          name: locationId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: skuId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: includeZero
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The lots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LotBalanceResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
  /v1/inventory/locations/{locationId}/movements:
    get:
      tags: [Inventory]
      operationId: listMovements
      summary: The stock card of one SKU at a location, oldest first, with the running quantity
      description: >
        Every ledger movement of the SKU at the location (opening balance, receipt, transfer in
        and out, sale, dispatch, reversal), in ledger order, each with the quantity of the SKU at
        the location after it, summed by the server (25A section 8, "Stock card"). The unit cost
        at the movement is shown to the owner's user only, like the balances. A location the
        caller's scope does not read answers an empty list.
      x-permission: inv.stock.view
      parameters:
        - in: path
          name: locationId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: skuId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The movements with the running quantity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockCardLineResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
  /v1/inventory/availability:
    get:
      tags: [Inventory]
      operationId: getAvailability
      summary: What can be sold or allocated, per location and SKU
      description: >
        The GOOD lots with stock at each location, less what issued delivery notes have
        reserved there and not yet dispatched (doc 25 section 3.4). A negative lot never counts.
        One row per requested location and SKU, zero when there is nothing.
      x-permission: inv.stock.view
      parameters:
        - in: query
          name: locationIds
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, format: uuid }
        - in: query
          name: skuIds
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 500
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Availability per location and SKU
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AvailabilityResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
  /v1/inventory/receipts/{grnId}:
    get:
      tags: [Inventory]
      operationId: getReceipt
      summary: The movements a confirmed GRN put into the receiver's stock
      description: >
        M5 applies grn.confirmed.v1 in the receiver's scope (the permission inv.stock.receive is
        that command's; the system runs it with no user). An empty list until it is applied, and
        for a GRN the caller's scope does not see.
      x-permission: inv.stock.receive
      parameters:
        - in: path
          name: grnId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The receipt movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MovementResponse' }
  /v1/inventory/pick-lists/{deliveryNoteId}:
    get:
      tags: [Inventory]
      operationId: getPickList
      summary: The pick list of an issued delivery note, FEFO lots per line
      x-permission: whs.pick
      parameters:
        - in: path
          name: deliveryNoteId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The pick list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickListResponse' }
        '404':
          description: No pick list for this delivery note, or the caller's scope may not see it
  /v1/inventory/opening-balances:
    post:
      tags: [Inventory]
      operationId: prepareOpeningBalance
      summary: Prepare the opening stock of a location, with batch data and cost
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.location.not_in_scope,
        m5.opening.location_has_stock, m5.opening.already_open, m5.opening.lines_required,
        m5.opening.line_invalid, m5.batch.not_found.
      x-permission: inv.opening.prepare
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareOpeningBalanceRequest' }
      responses:
        '201':
          description: Prepared, in status DRAFT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpeningBalanceResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/opening-balances/{openingBalanceId}:
    get:
      tags: [Inventory]
      operationId: getOpeningBalance
      summary: One opening balance with its lines
      x-permission: inv.stock.view
      parameters:
        - in: path
          name: openingBalanceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The opening balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpeningBalanceResponse' }
        '404':
          description: No such opening balance, or the caller's scope may not see it
  /v1/inventory/opening-balances/{openingBalanceId}/sign:
    post:
      tags: [Inventory]
      operationId: signOpeningBalance
      summary: The entity's officer signs the counted stock
      description: >
        Codes this operation can answer with 422: m5.opening.user_required, m5.opening.not_found,
        m5.opening.not_draft; mfa.required when the second factor is not fresh.
      x-permission: inv.opening.sign
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: path
          name: openingBalanceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Signed, in status SIGNED_ENTITY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpeningBalanceResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/opening-balances/{openingBalanceId}/countersign:
    post:
      tags: [Inventory]
      operationId: countersignOpeningBalance
      summary: The Federation's officer countersigns; the OPB is issued and the stock posted
      description: >
        Codes this operation can answer with 422: m5.opening.user_required, m5.opening.not_found,
        m5.opening.not_signed, m5.opening.countersigner_is_signer, m5.opening.location_has_stock,
        m5.opening.entity_unknown; mfa.required when the second factor is not fresh.
      x-permission: inv.opening.countersign
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: path
          name: openingBalanceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Posted, with the OPB document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpeningBalanceResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/transfers:
    get:
      tags: [Inventory]
      operationId: listTransfers
      summary: The transfers leaving or arriving at a location, newest first
      description: >
        A session at the source sees the transfers it sent, a session at the destination the ones
        addressed to it; an entity-wide user both. Status IN_TRANSIT until the destination
        receives, then RECEIVED.
      x-permission: inv.stock.view
      parameters:
        - in: query
          name: locationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The transfers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransferResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
    post:
      tags: [Inventory]
      operationId: issueTransfer
      summary: Send stock from one location of the entity to another (issue and dispatch)
      description: >
        The stock leaves the source as TRANSFER_OUT and is in transit until the destination
        receives it. Codes this operation can answer with 422: m5.scope.own_required,
        m5.location.not_in_scope, m5.transfer.same_location, m5.transfer.destination_invalid,
        m5.transfer.lines_required, m5.transfer.line_invalid, m5.batch.not_found,
        m5.transfer.insufficient_stock.
      x-permission: inv.transfer.issue
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueTransferRequest' }
      responses:
        '201':
          description: Issued, in status IN_TRANSIT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/transfers/{transferId}:
    get:
      tags: [Inventory]
      operationId: getTransfer
      summary: One transfer with its lines
      x-permission: inv.stock.view
      parameters:
        - in: path
          name: transferId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The transfer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
        '404':
          description: No such transfer, or the caller's scope may not see it
  /v1/inventory/transfers/{transferId}/receive:
    post:
      tags: [Inventory]
      operationId: receiveTransfer
      summary: The destination receives the transfer in full
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.transfer.not_found,
        m5.transfer.not_destination, m5.transfer.already_received.
      x-permission: shop.transfer.receive
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: path
          name: transferId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Received
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  # ---- stock control (M5-11, M5-13, repack): counts, write-offs, recipes, repacks ----------
  /v1/inventory/counts:
    get:
      tags: [StockControl]
      operationId: listCounts
      summary: The counts of a location, newest first
      x-permission: inv.stock.view
      parameters:
        - in: query
          name: locationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CountResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
    post:
      tags: [StockControl]
      operationId: scheduleCount
      summary: Schedule a count of a location, of everything or of some items
      description: >
        Nothing is frozen: the location keeps selling and receiving while it is counted. Codes this
        operation can answer with 422: m5.scope.own_required, m5.location.not_in_scope,
        m5.count.scope_invalid, m5.count.already_open.
      x-permission: inv.count.schedule
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCountRequest' }
      responses:
        '201':
          description: Scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/counts/{taskId}:
    get:
      tags: [StockControl]
      operationId: getCount
      summary: One count with its expectation, its lines and its adjustment
      x-permission: inv.stock.view
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountResponse' }
        '404':
          description: No such count, or the caller's scope may not see it
  /v1/inventory/counts/{taskId}/start:
    post:
      tags: [StockControl]
      operationId: startCount
      summary: Start the count; what the book holds of every lot in scope is noted
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.count.not_found,
        m5.count.not_scheduled.
      x-permission: shop.count.record
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Counting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/counts/{taskId}/submit:
    post:
      tags: [StockControl]
      operationId: submitCount
      summary: Submit what was counted; variances within tolerance post at once
      description: >
        Each lot is measured against the book as it stands at submit (what was noted at the start,
        moved by the sales and receipts since). Variances within tolerance post as COUNT_ADJUST;
        the others wait for approval (VARIANCE_REVIEW). Codes this operation can answer with 422:
        m5.scope.own_required, m5.count.not_found, m5.count.not_counting, m5.count.line_invalid,
        m5.batch.not_found, m5.count.line_out_of_scope, m5.count.line_missing.
      x-permission: shop.count.record
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitCountRequest' }
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/counts/{taskId}/approve:
    post:
      tags: [StockControl]
      operationId: approveAdjustment
      summary: Approve the count's variances beyond tolerance and post them
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.count.not_found,
        m5.adjustment.not_in_review, m5.adjustment.approver_is_requester, sod.same_person,
        m5.approval.limit_exceeded; mfa.required when the second factor is not fresh.
      x-permission: inv.adjust.approve
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Approved and posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/counts/{taskId}/reject:
    post:
      tags: [StockControl]
      operationId: rejectAdjustment
      summary: Reject the count's variances beyond tolerance; nothing more is posted
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.count.not_found,
        m5.adjustment.not_in_review, m5.reason_required; mfa.required when the second factor is not fresh.
      x-permission: inv.adjust.approve
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/locations/{locationId}/negative-lots:
    get:
      tags: [StockControl]
      operationId: listNegativeLots
      summary: The lots of a location below zero, oversold at the till, oldest first
      x-permission: inv.stock.view
      parameters:
        - in: path
          name: locationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The negative lots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NegativeLotResponse' }
  /v1/inventory/lots/{stockLotId}/acknowledge-negative:
    post:
      tags: [StockControl]
      operationId: acknowledgeNegativeLot
      summary: Acknowledge a lot below zero with a note; the next count corrects it
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.lot.not_found,
        m5.lot.not_negative, m5.lot.already_acknowledged, m5.reason_required.
      x-permission: inv.count.schedule
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: path
          name: stockLotId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NegativeLotResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/write-offs:
    get:
      tags: [StockControl]
      operationId: listWriteOffs
      summary: The write-offs of a location, newest first
      x-permission: inv.stock.view
      parameters:
        - in: query
          name: locationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The write-offs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WriteOffResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
    post:
      tags: [StockControl]
      operationId: requestWriteOff
      summary: Draft a write-off of lost stock at a location
      description: >
        No stock moves until approval. Codes this operation can answer with 422:
        m5.scope.own_required, m5.location.not_in_scope, m5.writeoff.category_required,
        m5.writeoff.lines_required, m5.writeoff.line_invalid, m5.batch.not_found,
        m5.writeoff.insufficient_stock.
      x-permission: inv.writeoff.request
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestWriteOffRequest' }
      responses:
        '201':
          description: Drafted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteOffResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/write-offs/{writeOffId}:
    get:
      tags: [StockControl]
      operationId: getWriteOff
      summary: One write-off with its lines, photographs and approval state
      x-permission: inv.stock.view
      parameters:
        - $ref: '#/components/parameters/WriteOffId'
      responses:
        '200':
          description: The write-off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteOffResponse' }
        '404':
          description: No such write-off, or the caller's scope may not see it
  /v1/inventory/write-offs/{writeOffId}/photos:
    post:
      tags: [StockControl]
      operationId: addWriteOffPhoto
      summary: Authorise the upload of one photograph for a draft write-off
      description: >
        Answers a URL the client PUTs the bytes to, with the content type given here. Codes this
        operation can answer with 422: m5.scope.own_required, m5.writeoff.not_found,
        m5.writeoff.not_draft, attachment.content_type_not_allowed, attachment.too_large.
      x-permission: inv.writeoff.request
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteOffId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoUploadRequest' }
      responses:
        '200':
          description: Authorised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoUploadResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/write-offs/{writeOffId}/submit:
    post:
      tags: [StockControl]
      operationId: submitWriteOff
      summary: Issue the write-off as a WOF document; it waits for its witness
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.writeoff.not_found,
        m5.writeoff.not_draft, m5.location.not_in_scope, m5.writeoff.photos_required,
        m5.writeoff.insufficient_stock, m5.writeoff.entity_unknown.
      x-permission: inv.writeoff.request
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteOffId'
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteOffResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/write-offs/{writeOffId}/witness:
    post:
      tags: [StockControl]
      operationId: witnessWriteOff
      summary: Witness the loss; remotely from the photographs at a single-staff location
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.writeoff.not_found,
        m5.writeoff.not_requested, m5.writeoff.witness_is_requester, m5.writeoff.photos_incomplete,
        m5.location.not_in_scope, m5.writeoff.remote_witness_not_allowed.
      x-permission: inv.writeoff.witness
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteOffId'
      responses:
        '200':
          description: Witnessed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteOffResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/write-offs/{writeOffId}/approve:
    post:
      tags: [StockControl]
      operationId: approveWriteOff
      summary: Approve the write-off within your band; the stock is written off
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.writeoff.not_found,
        m5.writeoff.not_witnessed, m5.writeoff.approver_is_requester, sod.same_person,
        m5.writeoff.insufficient_stock, m5.approval.limit_exceeded; mfa.required when the second
        factor is not fresh.
      x-permission: inv.writeoff.approve
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteOffId'
      responses:
        '200':
          description: Approved and posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteOffResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/write-offs/{writeOffId}/reject:
    post:
      tags: [StockControl]
      operationId: rejectWriteOff
      summary: Reject the write-off with a reason; no stock moves
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.writeoff.not_found,
        m5.writeoff.not_open, m5.reason_required; mfa.required when the second factor is not fresh.
      x-permission: inv.writeoff.approve
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/WriteOffId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WriteOffResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/recipes:
    get:
      tags: [StockControl]
      operationId: listRecipes
      summary: The entity's repack recipes, active first
      x-permission: inv.stock.view
      responses:
        '200':
          description: The recipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecipeResponse' }
    post:
      tags: [StockControl]
      operationId: defineRecipe
      summary: Define a repack recipe
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.recipe.name_required,
        m5.recipe.invalid, m5.recipe.same_sku, m5.recipe.sku_inactive, m5.recipe.output_not_repack,
        m5.recipe.name_taken.
      x-permission: inv.recipe.manage
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefineRecipeRequest' }
      responses:
        '201':
          description: Defined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/recipes/{recipeId}/retire:
    post:
      tags: [StockControl]
      operationId: retireRecipe
      summary: Retire a recipe; repacks done with it stay
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.recipe.not_found,
        m5.recipe.retired.
      x-permission: inv.recipe.manage
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - in: path
          name: recipeId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Retired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecipeResponse' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/repacks:
    get:
      tags: [StockControl]
      operationId: listRepacks
      summary: The repacks done at a location, newest first
      x-permission: inv.stock.view
      parameters:
        - in: query
          name: locationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The repacks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RepackResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
    post:
      tags: [StockControl]
      operationId: executeRepack
      summary: Repack part of a bulk lot into packs by a recipe
      description: >
        The input leaves as REPACK_CONSUME at the entity average; the packs made come in as a new
        batch at the consumed value divided by their number. Codes this operation can answer with
        422: m5.scope.own_required, m5.location.not_in_scope, m5.recipe.not_found,
        m5.recipe.retired, m5.repack.qty_invalid, m5.batch.not_found, m5.repack.input_mismatch,
        m5.repack.insufficient_stock, and M2's batch guards for the output.
      x-permission: inv.repack.execute
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecuteRepackRequest' }
      responses:
        '201':
          description: Executed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepackResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
  /v1/inventory/repacks/{repackId}:
    get:
      tags: [StockControl]
      operationId: getRepack
      summary: One repack
      x-permission: inv.stock.view
      parameters:
        - $ref: '#/components/parameters/RepackId'
      responses:
        '200':
          description: The repack
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepackResponse' }
        '404':
          description: No such repack, or the caller's scope may not see it
  /v1/inventory/repacks/{repackId}/reverse:
    post:
      tags: [StockControl]
      operationId: reverseRepack
      summary: Reverse a repack while its packs are untouched; the input lot is restored
      description: >
        Codes this operation can answer with 422: m5.scope.own_required, m5.repack.not_found,
        m5.repack.already_reversed, m5.reason_required, m5.repack.output_touched.
      x-permission: inv.repack.reverse
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RepackId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Reversed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepackResponse' }
        '400': { $ref: 'common.yaml#/components/responses/RequestProblem' }
        '422': { $ref: 'common.yaml#/components/responses/RuleBroken' }
components:
  parameters:
    TaskId:
      in: path
      name: taskId
      required: true
      schema: { type: string, format: uuid }
    WriteOffId:
      in: path
      name: writeOffId
      required: true
      schema: { type: string, format: uuid }
    RepackId:
      in: path
      name: repackId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    IssueTransferRequest:
      type: object
      required: [fromLocationId, toLocationId, lines]
      properties:
        fromLocationId: { type: string, format: uuid }
        toLocationId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/TransferLineRequest' }
    TransferLineRequest:
      type: object
      required: [batchId, qty]
      properties:
        batchId: { type: string, format: uuid }
        qty: { type: number, exclusiveMinimum: 0 }
    TransferResponse:
      type: object
      required: [transferId, fromLocationId, toLocationId, status, lines]
      properties:
        transferId: { type: string, format: uuid }
        fromLocationId: { type: string, format: uuid }
        toLocationId: { type: string, format: uuid }
        status: { type: string, enum: [IN_TRANSIT, RECEIVED] }
        issuedBy: { type: string, format: uuid }
        issuedAt: { type: string, format: date-time }
        receivedBy: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/TransferLineResponse' }
    TransferLineResponse:
      type: object
      required: [lineNo, batchId, skuId, qty]
      properties:
        lineNo: { type: integer }
        batchId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        qty: { type: number }
    MovementResponse:
      type: object
      required: [movementId, locationId, skuId, batchId, condition, movementType, qtyDelta, documentId, movementSeq]
      properties:
        movementId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        condition: { type: string, enum: [GOOD, DAMAGED] }
        movementType: { type: string }
        qtyDelta: { type: number }
        unitCostAtMovement: { type: number }
        documentId: { type: string, format: uuid }
        documentLineId: { type: string, format: uuid }
        movementSeq: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
    StockCardLineResponse:
      type: object
      required: [movement, balanceAfter]
      properties:
        movement: { $ref: '#/components/schemas/MovementResponse' }
        balanceAfter: { type: number }
    PickListResponse:
      type: object
      required: [pickListId, deliveryNoteId, status, lines]
      properties:
        pickListId: { type: string, format: uuid }
        deliveryNoteId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, DISPATCHED] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PickResponse' }
    PickResponse:
      type: object
      required: [deliveryLineId, skuId, qty]
      properties:
        deliveryLineId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        locationId: { type: string, format: uuid, description: 'absent on the short part of a line' }
        stockLotId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        qty: { type: number }
    PrepareOpeningBalanceRequest:
      type: object
      required: [locationId, lines]
      properties:
        locationId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/OpeningBalanceLineRequest' }
    OpeningBalanceLineRequest:
      type: object
      description: >
        A batch M2 knows (batchId), or the batch as counted (skuId with batchNo, expiryDate and
        printedMrp as the item requires), which the prepare registers in M2 (M5-12).
      required: [qty, unitCost]
      properties:
        batchId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        batchNo: { type: string, maxLength: 40 }
        expiryDate: { type: string, format: date }
        printedMrp: { type: number, exclusiveMinimum: 0 }
        condition: { type: string, enum: [GOOD, DAMAGED], default: GOOD }
        qty: { type: number, exclusiveMinimum: 0 }
        unitCost: { type: number, minimum: 0 }
    OpeningBalanceResponse:
      type: object
      required: [openingBalanceId, locationId, status, lines]
      properties:
        openingBalanceId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, SIGNED_ENTITY, POSTED] }
        preparedBy: { type: string, format: uuid }
        signedEntityBy: { type: string, format: uuid }
        countersignedBy: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OpeningBalanceLineResponse' }
    OpeningBalanceLineResponse:
      type: object
      required: [lineNo, batchId, skuId, condition, qty, unitCost]
      properties:
        lineNo: { type: integer }
        batchId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        condition: { type: string, enum: [GOOD, DAMAGED] }
        qty: { type: number }
        unitCost: { type: number }
    LotBalanceResponse:
      type: object
      required: [stockLotId, locationId, skuId, batchId, condition, qtyOnHand, negative]
      properties:
        stockLotId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        batchNo: { type: string }
        expiryDate: { type: string, format: date }
        condition: { type: string, enum: [GOOD, DAMAGED] }
        qtyOnHand: { type: number }
        fefoRank: { type: integer }
        negative: { type: boolean }
        expired:
          type: boolean
          description: The lot's expiry date is before the business date; it has no FEFO rank and leaves by a write-off
        unitCost:
          type: number
          description: The lot's acquisition cost; only for a user of the owning entity, never for a till
    AvailabilityResponse:
      type: object
      required: [locationId, skuId, available]
      properties:
        locationId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        available: { type: number }
    ScheduleCountRequest:
      type: object
      required: [locationId, scopeKind]
      properties:
        locationId: { type: string, format: uuid }
        scopeKind: { type: string, enum: [FULL, SKUS] }
        skuIds:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
        scheduledFor: { type: string, format: date }
    SubmitCountRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/CountLineRequest' }
    CountLineRequest:
      type: object
      description: A counted quantity, or a reason to skip the lot; never both.
      required: [batchId]
      properties:
        batchId: { type: string, format: uuid }
        condition: { type: string, enum: [GOOD, DAMAGED], default: GOOD }
        countedQty: { type: number, minimum: 0 }
        skipReason: { type: string, maxLength: 200 }
        countedAt:
          type: string
          format: date-time
          description: When the lot was counted (the form stamps the line); the line is measured against the lot as it stood then
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    CountResponse:
      type: object
      required: [taskId, locationId, scopeKind, skuIds, scheduledFor, status, expectation, lines]
      properties:
        taskId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        scopeKind: { type: string, enum: [FULL, SKUS] }
        skuIds:
          type: array
          items: { type: string, format: uuid }
        scheduledFor: { type: string, format: date }
        status: { type: string, enum: [SCHEDULED, COUNTING, VARIANCE_REVIEW, CLOSED] }
        outcome: { type: string, enum: [POSTED, APPROVED, REJECTED] }
        scheduledBy: { type: string, format: uuid }
        startedBy: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        submittedBy: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        reviewValue: { type: number, description: 'the value of the variances beyond tolerance, at the entity average' }
        reviewBand: { type: integer }
        reviewedBy: { type: string, format: uuid }
        reviewedAt: { type: string, format: date-time }
        reviewReason: { type: string }
        expectation:
          type: array
          items: { $ref: '#/components/schemas/CountExpectedResponse' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CountLineResponse' }
    CountExpectedResponse:
      type: object
      required: [batchId, skuId, condition, expectedQty]
      properties:
        batchId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        batchNo: { type: string }
        condition: { type: string, enum: [GOOD, DAMAGED] }
        expectedQty: { type: number }
    CountLineResponse:
      type: object
      required: [lineNo, batchId, skuId, condition, expectedQty, varianceQty, varianceValue, withinTolerance]
      properties:
        lineNo: { type: integer }
        batchId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        batchNo: { type: string }
        condition: { type: string, enum: [GOOD, DAMAGED] }
        expectedQty: { type: number }
        countedQty: { type: number }
        skipReason: { type: string }
        varianceQty: { type: number }
        varianceValue: { type: number }
        withinTolerance: { type: boolean }
    NegativeLotResponse:
      type: object
      required: [stockLotId, locationId, skuId, batchId, condition, qtyOnHand]
      properties:
        stockLotId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        batchNo: { type: string }
        condition: { type: string, enum: [GOOD, DAMAGED] }
        qtyOnHand: { type: number }
        negativeSince: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time }
    RequestWriteOffRequest:
      type: object
      required: [locationId, category, lines]
      properties:
        locationId: { type: string, format: uuid }
        category:
          type: string
          enum: [DAMAGED_IN_TRANSIT, DAMAGED_IN_STORE, EXPIRED, THEFT, SHRINKAGE_UNEXPLAINED, STAFF_CONSUMPTION,
                 SAMPLES, DONATION, OTHER]
        note: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/WriteOffLineRequest' }
    WriteOffLineRequest:
      type: object
      required: [batchId, qty]
      properties:
        batchId: { type: string, format: uuid }
        condition: { type: string, enum: [GOOD, DAMAGED], default: GOOD }
        qty: { type: number, exclusiveMinimum: 0 }
    PhotoUploadRequest:
      type: object
      required: [contentType]
      properties:
        contentType: { type: string, maxLength: 100 }
        contentLength: { type: integer, format: int64, minimum: 1 }
    PhotoUploadResponse:
      type: object
      required: [attachmentId, url, expiresAt]
      properties:
        attachmentId: { type: string, format: uuid }
        url: { type: string }
        expiresAt: { type: string, format: date-time }
    WriteOffResponse:
      type: object
      required: [writeOffId, locationId, category, status, remoteWitness, photosRequired, lines, photos]
      properties:
        writeOffId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        category: { type: string }
        note: { type: string }
        status: { type: string, enum: [DRAFT, REQUESTED, WITNESSED, POSTED, REJECTED] }
        requestedBy: { type: string, format: uuid }
        requestedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
        documentNo: { type: string }
        value: { type: number, description: 'the loss at the entity average, from the submit on' }
        band: { type: integer }
        witnessUserId: { type: string, format: uuid }
        witnessedAt: { type: string, format: date-time }
        remoteWitness: { type: boolean }
        approverUserId: { type: string, format: uuid }
        decidedAt: { type: string, format: date-time }
        rejectReason: { type: string }
        photosRequired: { type: boolean }
        lines:
          type: array
          items: { $ref: '#/components/schemas/WriteOffLineResponse' }
        photos:
          type: array
          items: { $ref: '#/components/schemas/WriteOffPhotoResponse' }
    WriteOffLineResponse:
      type: object
      required: [lineNo, batchId, skuId, condition, qty]
      properties:
        lineNo: { type: integer }
        batchId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        batchNo: { type: string }
        condition: { type: string, enum: [GOOD, DAMAGED] }
        qty: { type: number }
    WriteOffPhotoResponse:
      type: object
      required: [attachmentId, status]
      properties:
        attachmentId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, COMPLETE, FAILED] }
    DefineRecipeRequest:
      type: object
      required: [name, inputSkuId, inputQty, outputSkuId, outputQty]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        inputSkuId: { type: string, format: uuid }
        inputQty: { type: number, exclusiveMinimum: 0 }
        outputSkuId: { type: string, format: uuid }
        outputQty: { type: number, exclusiveMinimum: 0 }
        expectedLossPct: { type: number, minimum: 0, exclusiveMaximum: 100 }
    RecipeResponse:
      type: object
      required: [recipeId, name, inputSkuId, inputQty, outputSkuId, outputQty, expectedLossPct, status]
      properties:
        recipeId: { type: string, format: uuid }
        name: { type: string }
        inputSkuId: { type: string, format: uuid }
        inputQty: { type: number }
        outputSkuId: { type: string, format: uuid }
        outputQty: { type: number }
        expectedLossPct: { type: number }
        status: { type: string, enum: [ACTIVE, RETIRED] }
    ExecuteRepackRequest:
      type: object
      required: [recipeId, locationId, inputBatchId, inputQty, actualOutputQty]
      properties:
        recipeId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        inputBatchId: { type: string, format: uuid }
        inputQty: { type: number, exclusiveMinimum: 0 }
        actualOutputQty: { type: number, exclusiveMinimum: 0 }
        printedMrp: { type: number, exclusiveMinimum: 0 }
        varianceReason:
          type: string
          maxLength: 500
          description: Why fewer packs were made than the recipe expects; required when the shortfall is beyond the yield tolerance
    RepackResponse:
      type: object
      required: [repackId, locationId, recipeId, inputBatchId, inputSkuId, inputQty, outputSkuId, outputBatchId,
                 expectedOutputQty, actualOutputQty, varianceQty, status]
      properties:
        repackId: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        recipeId: { type: string, format: uuid }
        inputBatchId: { type: string, format: uuid }
        inputSkuId: { type: string, format: uuid }
        inputQty: { type: number }
        inputUnitCost: { type: number }
        outputSkuId: { type: string, format: uuid }
        outputBatchId: { type: string, format: uuid }
        outputBatchNo: { type: string }
        expectedOutputQty: { type: number }
        actualOutputQty: { type: number }
        varianceQty: { type: number, description: 'expected minus actual output: the yield loss beyond the recipe' }
        outputUnitCost: { type: number }
        status: { type: string, enum: [EXECUTED, REVERSED] }
        executedBy: { type: string, format: uuid }
        executedAt: { type: string, format: date-time }
        reversalReason: { type: string }
        reversedAt: { type: string, format: date-time }
