  # wave 2, PR 11 (CR-21A-7; docs/progress/deviations/2026-10-06-wave2-stock-approvals.md (1)): no
  # new code. inv.writeoff.approve and inv.adjust.approve above now carry a limits_schema with
  # max_value required, so a role grants each up to a value (doc 25 section 7: "writeoff_bands as
  # role limits (M1)"); M1SeedLoader writes it with a new catalogue row, and m1security V0019 sets
  # it on an existing database, since the loader never updates a row.
