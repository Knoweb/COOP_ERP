# The M1 catalogue follows 21A section 3.3 verb by verb (CR-21A-1 item 1, accepted as revised on
# 27 September 2026): no coarse "manage" code stands for several commands. Beside 21A's list, M1
# keeps gov.entity.suspend (suspend and reinstate; not every clerk who registers may suspend)
# and one read code per aggregate (gov.entity.view, gov.user.view, prt.relationship.view,
# prt.location.view, sys.device.view), because every query of the slice names the permission it
# needs. A code taken out of this file is also removed from existing databases by a migration
# (m1security V0014 retired gov.entity.manage, prt.relationship.manage, prt.location.manage and
# sys.device.manage), because the seed loader only ever inserts.
permissions:
  - code: "gov.entity.register"
    module: "m1party"
    description_en: "Register federation-managed entities"
    scope: "FEDERATION"
    requires_mfa: false
  - code: "gov.entity.activate"
    module: "m1party"
    description_en: "Activate federation-managed entities"
    scope: "FEDERATION"
    requires_mfa: true
  - code: "gov.entity.suspend"
    module: "m1party"
    description_en: "Suspend and reinstate federation-managed entities"
    scope: "FEDERATION"
    requires_mfa: true
  - code: "gov.entity.view"
    module: "m1party"
    description_en: "View federation entity records"
    scope: "FEDERATION"
  - code: "gov.user.manage"
    module: "m1party"
    description_en: "Manage user credentials and status"
    scope: "ENTITY"
    requires_mfa: true
  - code: "gov.user.view"
    module: "m1party"
    description_en: "View the users of the entity or the shop"
    scope: "ENTITY"
  - code: "gov.role.manage"
    module: "m1party"
    description_en: "Manage roles and assignments"
    scope: "ENTITY"
    requires_mfa: true
  - code: "gov.external.grant"
    module: "m1party"
    description_en: "Grant timeboxed access to external regulators"
    scope: "FEDERATION"
    requires_mfa: true
  - code: "gov.audit.review"
    module: "m1party"
    description_en: "Review the audit trail of the entity"
    scope: "ENTITY"
  - code: "prt.relationship.view"
    module: "m1party"
    description_en: "View trading relationships"
    scope: "ENTITY"
  - code: "prt.relationship.open"
    module: "m1party"
    description_en: "Open a trading relationship in draft"
    scope: "ENTITY"
  - code: "prt.relationship.activate"
    module: "m1party"
    description_en: "Activate a draft trading relationship"
    scope: "ENTITY"
  - code: "prt.relationship.amend"
    module: "m1party"
    description_en: "Amend the terms of a trading relationship"
    scope: "ENTITY"
  - code: "prt.relationship.suspend"
    module: "m1party"
    description_en: "Suspend a trading relationship"
    scope: "ENTITY"
    requires_mfa: true
  - code: "bil.creditlimit.change"
    module: "m4trading"
    description_en: "Change the credit limit of a trading relationship"
    scope: "ENTITY"
    requires_mfa: true
  - code: "prt.location.view"
    module: "m1party"
    description_en: "View location details"
    scope: "ENTITY"
    offline_allowed: true
  - code: "prt.location.register"
    module: "m1party"
    description_en: "Register locations and update their details"
    scope: "ENTITY"
  - code: "prt.location.activate"
    module: "m1party"
    description_en: "Confirm connectivity and move locations through onboarding, active and dormant"
    scope: "ENTITY"
  - code: "prt.location.primary"
    module: "m1party"
    description_en: "Name the primary till of a shop"
    scope: "ENTITY"
    requires_mfa: true
  - code: "prt.position.manage"
    module: "m1party"
    description_en: "Register and retire till positions"
    scope: "ENTITY"
  - code: "sys.device.view"
    module: "m1party"
    description_en: "View device status"
    scope: "ENTITY"
  - code: "sys.device.enrol"
    module: "m1party"
    description_en: "Enrol devices and assign them to till positions"
    scope: "ENTITY"
    requires_mfa: true
  - code: "sys.device.suspend"
    module: "m1party"
    description_en: "Suspend, reinstate and retire devices"
    scope: "ENTITY"
    requires_mfa: true
  # M3 Pricing & Rules (23A section 3.1, "appended to the catalogue file"). The scaffolder's two
  # placeholders (prc.price_list.read and .register) are replaced by the codes of the guide that
  # M3-04 uses, plus prc.pricelist.view for the reads (the guide names no read code; as M2's
  # cat.sku.view, CR-22A-3). The other codes of 23A section 3.1 arrive with their tickets.
  - code: "prc.pricelist.view"
    module: "m3pricing"
    description_en: "View price lists and trade prices"
    scope: "ENTITY"
  - code: "prc.pricelist.author"
    module: "m3pricing"
    description_en: "Draft price lists and set their lines"
    scope: "ENTITY"
  # "mfa for TRADE via handler" (23A section 3.1): only TRADE lists are built so far, so the
  # handler asks for the second factor on every publication.
  - code: "prc.pricelist.publish"
    module: "m3pricing"
    description_en: "Publish price lists"
    scope: "ENTITY"
    requires_mfa: true
  # M2 Catalogue & Batch (22A section 3.1: "appended to the M1-owned catalogue file"). M2 has
  # no permission file of its own: security.permission is M1's table and M1SeedLoader reads
  # this one file. "F" in the guide is scope FEDERATION; "mfa" is requires_mfa. The eleven codes
  # of 22A section 3.1, plus two recorded in docs/change-requests/CR-22A-3.md (decided 27 Sep
  # 2026): cat.sku.view, the reads, and cat.tag.govern, the Federation's governed tags.
  - code: "cat.sku.view"
    module: "m2catalogue"
    description_en: "View catalogue items visible in the current scope"
    scope: "ENTITY"
  - code: "cat.sku.create"
    module: "m2catalogue"
    description_en: "Create shared catalogue items"
    scope: "FEDERATION"
  - code: "cat.sku.create_local"
    module: "m2catalogue"
    description_en: "Create and activate local catalogue items"
    scope: "ENTITY"
  - code: "cat.sku.promote"
    module: "m2catalogue"
    description_en: "Promote or merge local items into the shared catalogue"
    scope: "FEDERATION"
  - code: "cat.sku.deactivate"
    module: "m2catalogue"
    description_en: "Deactivate and reactivate catalogue items"
    scope: "ENTITY"
  - code: "cat.barcode.manage"
    module: "m2catalogue"
    description_en: "Register, retire and link barcodes"
    scope: "ENTITY"
  - code: "cat.image.manage"
    module: "m2catalogue"
    description_en: "Attach and retire item images"
    scope: "ENTITY"
  - code: "cat.tag.manage"
    module: "m2catalogue"
    description_en: "Define the entity's own tags and tag its items"
    scope: "ENTITY"
  - code: "cat.tag.govern"
    module: "m2catalogue"
    description_en: "Define governed tags and put them on shared items"
    scope: "FEDERATION"
  - code: "cat.tax.publish"
    module: "m2catalogue"
    description_en: "Define tax categories and publish tax rates"
    scope: "FEDERATION"
    requires_mfa: true
  - code: "cat.batch.correct"
    module: "m2catalogue"
    description_en: "Correct the MRP or expiry of a batch"
    scope: "ENTITY"
    requires_mfa: true
  - code: "cat.supplier.manage"
    module: "m2catalogue"
    description_en: "Register suppliers"
    scope: "ENTITY"
  - code: "cat.import.run"
    module: "m2catalogue"
    description_en: "Import item sheets"
    scope: "ENTITY"
