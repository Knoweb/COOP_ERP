    scope: "ENTITY"
    requires_mfa: true
  - code: "inv.recipe.manage"
    module: "m5inventory"
    description_en: "Define and retire repack recipes"
    scope: "ENTITY"
  - code: "inv.repack.execute"
    module: "m5inventory"
