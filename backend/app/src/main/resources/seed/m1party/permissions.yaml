    description_en: "Approve or reject inspected claims"
    scope: "ENTITY"
  - code: "del.claim.escalate"
    module: "m4trading"
    description_en: "Escalate a claim to the Federation arbiter"
    scope: "ENTITY"
  - code: "fed.arbitrate"
    module: "m4trading"
    description_en: "Arbitrate escalated discrepancies and claims"
    scope: "FEDERATION"
    requires_mfa: true
  - code: "bil.invoice.issue"
    module: "m4trading"
    description_en: "Issue tax invoices from confirmed goods received notes"
    scope: "ENTITY"
  - code: "bil.invoice.dispute"
