  # The Federation's catalogue team (22A section 3.1): the shared path (cat.sku.create with the
  # guard FederationCaller of M2), promotion, its own drafts and deactivations, and the governed tags
  # (cat.tag.govern, CR-22A-3). Assigned at the Federation entity; cat.sku.create,
  # cat.sku.promote and cat.tag.govern are FEDERATION-scope permissions.
  - role_id: "01998a4c-7d20-7b3e-9a61-4f2c8e5d1b07"
    name_en: "Federation Catalogue Steward"
    role_class: "OWN"
    permissions:
      - "cat.sku.view"
      - "cat.sku.create_local"
      - "cat.sku.create"
      - "cat.sku.promote"
      - "cat.sku.deactivate"
      - "cat.barcode.manage"
      - "cat.tag.manage"
      - "cat.tag.govern"
  # M4 Trading Documents (24A section 8): the two desks of the demo of 27 September 2026. A
  # buyer's stores role drafts and submits orders and confirms what arrives at its warehouse; a
  # seller's sales role accepts orders, issues and dispatches delivery notes and issues invoices.
  # Both read the trading documents of their scope (trd.document.view, CR-24A-1), the catalogue
  # and their relationships.
  - role_id: "01999a10-2c4e-7f1a-8b3d-5e6f70819a01"
    name_en: "Trading Buyer"
    role_class: "OWN"
    permissions:
      - "rpt.report.run"
      - "rpt.export.run"
      - "trd.document.view"
      - "cat.sku.view"
      - "prt.relationship.view"
      - "ord.order.draft"
      - "ord.order.submit"
      - "whs.grn.confirm"
      - "bil.invoice.dispute"
  - role_id: "01999a10-2c4e-7f1a-8b3d-5e6f70819a02"
    name_en: "Trading Seller"
    role_class: "OWN"
    permissions:
      - "rpt.report.run"
      - "rpt.export.run"
      - "trd.document.view"
      - "cat.sku.view"
      - "prt.relationship.view"
      - "ord.order.accept"
      - "del.note.draft"
      - "del.note.issue"
      - "del.note.dispatch"
      - "bil.invoice.issue"
