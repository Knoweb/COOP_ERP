  - code: ROLE_CHANGED
    severity: INFO
    offline_capturable: false
    description_en: Role created, its permissions changed or retired

  - code: ROLE_ASSIGNED
    severity: INFO
    offline_capturable: false
    description_en: Role assigned to a user

  - code: ROLE_REVOKED
    severity: INFO
