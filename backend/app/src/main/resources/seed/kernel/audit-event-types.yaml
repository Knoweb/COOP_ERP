audit_event_types:
  - code: EVENT_CONSUMER_DEAD_LETTERED
    severity: ALERT
    offline_capturable: false
    description_en: Event consumer moved an event to the dead-letter queue
  # K-07: documents and numbering (doc 18 part C; doc 07 section 3 names SERIES_REGISTER and
  # SERIES_HOLDER_CHANGE; the past tense follows the catalogue's own convention).
  - code: SERIES_REGISTERED
    severity: INFO
    offline_capturable: false
    description_en: Numbering series registered
  - code: SERIES_HOLDER_CHANGED
    severity: INFO
    offline_capturable: false
    description_en: Numbering series counter moved to another device
  - code: SERIES_CLOSED
    severity: INFO
    offline_capturable: false
    description_en: Numbering series closed
  - code: DOCUMENT_ISSUED
    severity: INFO
    offline_capturable: true
    description_en: Document issued and numbered
  - code: DOCUMENT_LINKED
    severity: INFO
    offline_capturable: true
    description_en: Correcting document linked to its original
  - code: NUMBERING_GAP
    severity: REVIEW
    offline_capturable: false
    description_en: A numbering series is not dense
  # K-12 and K-13: scheduled jobs and the business day.
  - code: JOB_TIMED_OUT
    severity: ALERT
    offline_capturable: false
    description_en: Scheduled job exceeded its maximum runtime and was interrupted
  - code: JOB_FAILED
    severity: REVIEW
    offline_capturable: false
    description_en: Scheduled job run failed
  - code: DAY_CLOSED
    severity: INFO
    offline_capturable: false
    description_en: Location closed its business day
  # K-11: the configuration register.
  - code: CONFIG_CHANGED
    severity: INFO
    offline_capturable: false
    description_en: Configuration value changed
  # K-09: attachments.
  - code: ATTACHMENT_PRESIGNED
    severity: INFO
    offline_capturable: true
    description_en: Upload of an attachment was authorised
  - code: ATTACHMENT_COMPLETED
    severity: INFO
    offline_capturable: false
    description_en: Attachment upload verified
  - code: ATTACHMENT_FAILED
    severity: REVIEW
    offline_capturable: false
    description_en: Attachment upload missing or its hash did not match
  # K-10: notifications.
  - code: NOTIFICATION_FAILED
    severity: ALERT
    offline_capturable: false
    description_en: Notification could not be delivered after every attempt
