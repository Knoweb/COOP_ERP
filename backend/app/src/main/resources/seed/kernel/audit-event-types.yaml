audit_event_types:
  - code: EVENT_CONSUMER_DEAD_LETTERED
    severity: ALERT
    offline_capturable: false
    description_en: Event consumer moved an event to the dead-letter queue
  # K-07: documents and numbering (doc 18 part C; doc 07 section 3 names SERIES_REGISTER and
  # SERIES_HOLDER_CHANGE; the past tense follows the catalogue's own convention).
  - code: SERIES_REGISTERED
    severity: INFO
    offline_capturable: false
    description_en: Numbering series registered
  - code: SERIES_HOLDER_CHANGED
    severity: INFO
    offline_capturable: false
    description_en: Numbering series counter moved to another device
  - code: SERIES_CLOSED
    severity: INFO
    offline_capturable: false
    description_en: Numbering series closed
  - code: DOCUMENT_ISSUED
    severity: INFO
    offline_capturable: true
    description_en: Document issued and numbered
  - code: DOCUMENT_LINKED
    severity: INFO
    offline_capturable: true
    description_en: Correcting document linked to its original
  - code: DOCUMENT_STATUS_CHANGED
    severity: INFO
    offline_capturable: true
    description_en: Document moved to another status through its state history
  - code: NUMBERING_GAP
    severity: REVIEW
    offline_capturable: false
    description_en: A numbering series is not dense
  # K-12 and K-13: scheduled jobs and the business day.
  - code: JOB_TIMED_OUT
    severity: ALERT
    offline_capturable: false
    description_en: Scheduled job exceeded its maximum runtime and was interrupted
  - code: JOB_FAILED
    severity: REVIEW
    offline_capturable: false
    description_en: Scheduled job run failed
  - code: DAY_CLOSED
    severity: INFO
    offline_capturable: false
    description_en: Location closed its business day
  # K-11: the configuration register.
  - code: CONFIG_CHANGED
    severity: INFO
    offline_capturable: false
    description_en: Configuration value changed
  # K-09: attachments.
  - code: ATTACHMENT_PRESIGNED
    severity: INFO
    offline_capturable: true
    description_en: Upload of an attachment was authorised
  - code: ATTACHMENT_COMPLETED
    severity: INFO
    offline_capturable: false
    description_en: Attachment upload verified
  - code: ATTACHMENT_FAILED
    severity: REVIEW
    offline_capturable: false
    description_en: Attachment upload missing or its hash did not match
  # CR-19A-7: the upload ledger of the objects a module owns (kernel.object_upload).
  - code: OBJECT_VERIFIED
    severity: INFO
    offline_capturable: false
    description_en: Upload of a module's object verified after its upload window
  - code: OBJECT_FAILED
    severity: REVIEW
    offline_capturable: false
    description_en: Upload of a module's object missing, too large or with another hash than announced
  # Decided 27 Sep 2026 (CR-19A-8): the attachment-cleanup job deletes a failed upload's file
  # after attachment.failed_retention_days; the row stays and records when.
  - code: ATTACHMENT_OBJECT_DELETED
    severity: INFO
    offline_capturable: false
    description_en: File of an attachment that failed verification deleted after its retention
  - code: OBJECT_DELETED
    severity: INFO
    offline_capturable: false
    description_en: File of a module's object that failed verification deleted after its retention
  # K-06b: the A4 renderer (19A section 6).
  - code: REPORT_RENDERED
    severity: INFO
    offline_capturable: false
    description_en: A document rendered to PDF and stored
  # K-10: notifications.
  - code: NOTIFICATION_FAILED
    severity: ALERT
    offline_capturable: false
    description_en: Notification could not be delivered after every attempt
  # K-08: the sync gateway (doc 32 sections 3, 6, 7 and 8).
  - code: DEVICE_ENROLMENT_CODE_ISSUED
    severity: INFO
    offline_capturable: false
    description_en: One-time enrolment code issued for a device
  - code: DEVICE_SYNC_ENROLLED
    severity: INFO
    offline_capturable: false
    description_en: Device enrolled for sync and given its credential
  - code: SYNC_EVENT_QUARANTINED
    severity: ALERT
    offline_capturable: false
    description_en: A till event could not be accepted and was quarantined
  # Wave 2, PR 03 (CR-32-1 item 2): a quarantined event resolved by an administrator, once.
  - code: SYNC_QUARANTINE_RESOLVED
    severity: REVIEW
    offline_capturable: false
    description_en: An administrator marked a quarantined till event repaired or discarded, with a reason
  - code: SYNC_ANOMALY
    severity: ALERT
    offline_capturable: false
    description_en: A device keeps sending batches that do not follow its cursor
  - code: SYNC_CLOCK_DRIFT
    severity: REVIEW
    offline_capturable: false
    description_en: A till clock drifted beyond the review threshold
  - code: SYNC_CURSOR_BEHIND
    severity: REVIEW
    offline_capturable: false
    description_en: Central holds less of a device than the device was acknowledged; resend requested
  # K-08 decisions of 27 September 2026: the sequence reset of doc 32 section 8 ("raises ALERT").
  - code: SYNC_SEQUENCE_RESET
    severity: ALERT
    offline_capturable: false
    description_en: An administrator moved a device's sync cursor past numbers it lost; the gap is recorded
  # wave 2, PR 16 (till trust and durability, TWK-03): the till records a PIN lock-out offline as
  # an audit.* fact (26A section 8, "5 failures -> 15-min lockout (local + audit)").
  - code: TILL_PIN_LOCKOUT
    severity: REVIEW
    offline_capturable: true
    description_en: Wrong PINs in a row locked a till's sign-in for a while
  # wave 3, fix-kernel-small-review-findings (M7M8M9-09): counterparty delivery refused an event
  # whose document is not the owner's with that counterparty (CR-19A-13); recorded in the owner's scope.
  - code: EVENT_COUNTERPARTY_REFUSED
    severity: ALERT
    offline_capturable: false
    description_en: An event named a counterparty its document does not have and was not delivered to it
