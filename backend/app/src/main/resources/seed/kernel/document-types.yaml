# The registry of document kinds (doc 18 part C, table document_type), flags as decided in 24B.
# Loaded on every start by DocumentTypeSeedLoader as the migrator (a member of app_seed):
# reference data, upserted, so a flag revisited here reaches every database.
#
#   series_scope      where the number comes from: the issuer's ENTITY series; the LOCATION
#                     series of the shop; the TILL_POSITION series of the till. For the kinds a
#                     shop issues from its LOCATION series and a warehouse from its ENTITY
#                     series (GRN, CNT, WOF, RPK, XFR), the scope here is the finest one; the
#                     numbering service falls back to the entity's series where the finer one
#                     was never registered.
#   issuer_role       whose document it is: the BUYER, the SELLER, or the HOLDER of the stock.
#   bilateral         a counterparty is mandatory.
#   fiscal            gaplessness and immutability are a compliance matter (24B section 2).
#   offline_issuable  a till may issue it without the server (H-02, H-03).
#   owning_module     whose validator and state machine apply (part F).
document_types:
  - code: ORD
    name_en: Order
    name_si: ඇණවුම
    name_ta: ஆணை
    series_scope: ENTITY
    issuer_role: BUYER
    bilateral: true
    fiscal: false
    offline_issuable: false
    owning_module: m4trading
  - code: DN
    name_en: Delivery note
    name_si: බෙදාහැරීමේ සටහන
