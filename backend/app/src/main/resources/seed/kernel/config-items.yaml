# The configuration register (doc 19 section 8; 19A section 11): every item the platform and
# its modules may configure, with its type, its default, the finest scope it may be set at and
# who may change it. Upserted into kernel.config_item on every start by ConfigItemSeedLoader
# as the migrator; values are never written from here. A module's seed/<module>/config.yaml
# gives defaults for its own keys through ConfigSeeder; every such key must be an item here
# (typed, bounded, with its scope and permission), or the start fails.
#
#   value_type        STRING | INTEGER | DECIMAL | BOOLEAN | DURATION (ISO 8601, PT10M) | JSON
#   schema            what a value must satisfy: minimum, maximum (numbers and durations),
#                     enum (strings), pattern (strings), max_length (strings)
#   scope_kind        FEDERATION (one value for all), ENTITY, LOCATION (finest)
#   change_permission the permission that may set it (checked when K-03b resolves permissions)
#   sensitive         a change needs a fresh MFA (doc 19 section 8)
#   till_visible      part of the shop snapshot (doc 32 section 5.1)
config_items:
  - key: security.mfa.freshness
    value_type: DURATION
    schema: { minimum: PT1M, maximum: PT12H }
    description_en: How recently the second factor must have been presented for an action that asks for one
    description_si: දෙවන සාධකයක් අවශ්‍ය ක්‍රියාවකට එය ඉදිරිපත් කර තිබිය යුතු මෑත කාලය
    description_ta: இரண்டாம் காரணி தேவைப்படும் செயலுக்கு அது எவ்வளவு சமீபத்தில் வழங்கப்பட்டிருக்க வேண்டும்
    default: "PT12H"
    scope_kind: ENTITY
    change_permission: sys.config.manage
    sensitive: true
  - key: business.timezone
    value_type: STRING
    schema: { pattern: "^[A-Za-z_]+/[A-Za-z_]+$" }
    description_en: The business time zone of the federation
    description_si: සම්මේලනයේ ව්‍යාපාරික වේලා කලාපය
    description_ta: கூட்டமைப்பின் வணிக நேர மண்டலம்
    default: "Asia/Colombo"
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: business_date.cutoff_time
    value_type: STRING
    schema: { pattern: "^[0-2][0-9]:[0-5][0-9]$" }
    description_en: The time of day after which a location that has not closed its day is closed for it
    description_si: දිනය වසා නොමැති ස්ථානයක් වෙනුවෙන් එය වසන දවසේ වේලාව
    description_ta: நாளை மூடாத இடத்திற்குப் பதிலாக அது மூடப்படும் நேரம்
    default: "02:30"
    scope_kind: LOCATION
    change_permission: sys.config.manage
  - key: jobs.lock.at_least_for
    value_type: DURATION
    schema: { minimum: PT0S, maximum: PT5M }
    description_en: How long a scheduled job keeps its lock after a run ends, so a second instance firing the same schedule a moment later skips it
    description_si: ධාවනයක් අවසන් වූ පසු කාලසටහන්ගත කාර්යයක් සිය අගුල තබා ගන්නා කාලය, මොහොතකට පසු එම කාලසටහන ක්‍රියාත්මක කරන දෙවන අවස්ථාවක් එය මඟ හරින පරිදි
    description_ta: ஓட்டம் முடிந்த பின் திட்டமிடப்பட்ட பணி தன் பூட்டை வைத்திருக்கும் நேரம், சற்று பின்னர் அதே அட்டவணையை இயக்கும் இரண்டாவது நிகழ்வு அதைத் தவிர்க்கும் வகையில்
    default: "PT5S"
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: m1.bulk.max_rows
    value_type: INTEGER
    schema: { minimum: 1, maximum: 5000 }
    description_en: The most societies one CSV file may register at once
    description_si: එක් CSV ගොනුවකින් වරකට ලියාපදිංචි කළ හැකි උපරිම සමිති ගණන
    description_ta: ஒரு CSV கோப்பு ஒரே நேரத்தில் பதிவு செய்யக்கூடிய அதிகபட்ச சங்கங்கள்
    default: 500
    scope_kind: FEDERATION
    change_permission: gov.entity.register
    module: m1party
  - key: m1.external_grant.max_months
    value_type: INTEGER
    schema: { minimum: 1, maximum: 12 }
    description_en: The longest an external grant to a regulator or auditor may run, in months
    description_si: නියාමකයෙකුට හෝ විගණකයෙකුට දෙන බාහිර ප්‍රවේශ අවසරයක් පැවතිය හැකි උපරිම කාලය, මාස වලින්
    description_ta: ஒழுங்குமுறையாளர் அல்லது தணிக்கையாளருக்கு வழங்கப்படும் வெளி அணுகல் அனுமதி நீடிக்கக்கூடிய அதிகபட்ச காலம், மாதங்களில்
    default: 12
    scope_kind: FEDERATION
    change_permission: gov.external.grant
    sensitive: true
    module: m1party
  - key: trade.federation_direct.enabled
    value_type: BOOLEAN
    description_en: Whether societies may trade directly with the Federation
    description_si: සමිතිවලට සම්මේලනය සමඟ සෘජුව වෙළඳාම් කළ හැකිද
    description_ta: சங்கங்கள் கூட்டமைப்புடன் நேரடியாக வர்த்தகம் செய்யலாமா
    default: false
    scope_kind: FEDERATION
    change_permission: sys.config.manage
    module: m1party
  - key: security.policy.mfa_enabled
    value_type: BOOLEAN
    description_en: Whether a second factor is required for the actions that ask for one
    description_si: ඉල්ලන ක්‍රියා සඳහා දෙවන සාධකයක් අවශ්‍යද
    description_ta: கேட்கும் செயல்களுக்கு இரண்டாம் காரணி தேவையா
    default: true
    scope_kind: ENTITY
    change_permission: sys.config.manage
    sensitive: true
    module: m1party
  - key: m1.relationship.credit_limit_mfa_max_age
    value_type: DURATION
    schema: { minimum: "PT1M", maximum: "PT12H" }
    description_en: How recently the second factor must have been presented to change a credit limit
    description_si: ණය සීමාවක් වෙනස් කිරීමට දෙවන සාධකය ඉදිරිපත් කර තිබිය යුතු මෑත කාලය
    description_ta: கடன் வரம்பை மாற்ற இரண்டாம் காரணி எவ்வளவு சமீபத்தில் வழங்கப்பட்டிருக்க வேண்டும்
    default: "PT10M"
    scope_kind: ENTITY
    change_permission: sys.config.manage
    sensitive: true
    module: m1party
  # The till PIN policy (doc 19 section 2.1 and DR-5; doc 21 section 7): 4 to 6 digits as the
  # entity sets, 5 attempts then a 15-minute lockout, none of the last 3 again. M1 checks length
  # and reuse when a PIN is set (M1-07); the till enforces the lockout from its snapshot. The
  # bounds let an entity tighten the policy and never weaken it: doc 19 accepts a PIN, a
  # low-entropy credential, only because of the 5-attempt, 15-minute limit and the history.
  - key: security.pin.length_min
    value_type: INTEGER
    schema: { minimum: 4, maximum: 6 }
    description_en: The fewest digits a till PIN may have
    description_si: මුදල් ලේඛන PIN අංකයක තිබිය යුතු අවම ඉලක්කම් ගණන
    description_ta: பணப்பெட்டி PIN எண்ணில் இருக்க வேண்டிய குறைந்தபட்ச இலக்கங்கள்
    default: 4
    scope_kind: ENTITY
    change_permission: gov.user.manage
    sensitive: true
    till_visible: true
    module: m1party
  - key: security.pin.length_max
    value_type: INTEGER
    schema: { minimum: 4, maximum: 6 }
    description_en: The most digits a till PIN may have
    description_si: මුදල් ලේඛන PIN අංකයක තිබිය හැකි උපරිම ඉලක්කම් ගණන
    description_ta: பணப்பெட்டி PIN எண்ணில் இருக்கக்கூடிய அதிகபட்ச இலக்கங்கள்
    default: 6
    scope_kind: ENTITY
    change_permission: gov.user.manage
    sensitive: true
    till_visible: true
    module: m1party
  - key: security.pin.lockout_attempts
    value_type: INTEGER
    schema: { minimum: 3, maximum: 5 }
    description_en: How many wrong PINs in a row lock an operator out of the till
    description_si: මුදල් ලේඛනයෙන් ක්‍රියාකරුවෙකු අගුලු දැමීමට පෙර ඉඩ දෙන වැරදි PIN උත්සාහ ගණන
    description_ta: பணப்பெட்டியிலிருந்து இயக்குநரைப் பூட்டுவதற்கு முன் அனுமதிக்கப்படும் தவறான PIN முயற்சிகள்
    default: 5
    scope_kind: ENTITY
    change_permission: gov.user.manage
    sensitive: true
    till_visible: true
    module: m1party
  - key: security.pin.lockout_duration
    value_type: DURATION
    schema: { minimum: "PT15M", maximum: "PT24H" }
    description_en: How long a till operator stays locked out after too many wrong PINs
    description_si: වැරදි PIN උත්සාහ වැඩි වූ පසු මුදල් ලේඛන ක්‍රියාකරුවෙකු අගුලු දමා තබන කාලය
    description_ta: அதிகமான தவறான PIN முயற்சிகளுக்குப் பின் பணப்பெட்டி இயக்குநர் பூட்டப்பட்டிருக்கும் நேரம்
    default: "PT15M"
    scope_kind: ENTITY
    change_permission: gov.user.manage
    sensitive: true
    till_visible: true
    module: m1party
  - key: security.pin.history_depth
    value_type: INTEGER
    schema: { minimum: 3, maximum: 10 }
    description_en: How many of a user's last PINs, the current one included, a new PIN must differ from
    description_si: නව PIN අංකයක් වෙනස් විය යුතු, වත්මන් එකද ඇතුළුව, පරිශීලකයාගේ අවසන් PIN අංක ගණන
    description_ta: புதிய PIN வேறுபட வேண்டிய, தற்போதையது உட்பட, பயனரின் கடைசி PIN எண்களின் எண்ணிக்கை
    default: 3
    scope_kind: ENTITY
    change_permission: gov.user.manage
    sensitive: true
    module: m1party
  - key: till.idle_lock
    value_type: DURATION
    schema: { minimum: "PT30S", maximum: "PT1H" }
    description_en: How long a till may stand idle before it locks
    description_si: මුදල් ලේඛනයක් අගුලු දැමීමට පෙර නිකම් තිබිය හැකි කාලය
    description_ta: பணப்பெட்டி பூட்டப்படும் முன் செயலற்று இருக்கக்கூடிய நேரம்
    default: "PT5M"
    scope_kind: LOCATION
    change_permission: sys.config.manage
    till_visible: true
  - key: notification.sms.quiet_hours
    value_type: STRING
    schema: { pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]-([01][0-9]|2[0-3]):[0-5][0-9]$|^$" }
    description_en: The hours during which no SMS is sent, as HH:mm-HH:mm; empty for none
    description_si: SMS නොයවන පැය, HH:mm-HH:mm ලෙස; නොමැති නම් හිස්
    description_ta: SMS அனுப்பப்படாத நேரங்கள், HH:mm-HH:mm என; இல்லையெனில் வெற்று
    default: "22:00-07:00"
    scope_kind: ENTITY
    change_permission: sys.config.manage
  - key: notification.sms.enabled
    value_type: BOOLEAN
    description_en: Whether SMS notifications are sent at all for this entity (the kill switch)
    description_si: මෙම ආයතනය සඳහා SMS දැනුම්දීම් යවනවාද (නවත්වන ස්විචය)
    description_ta: இந்த நிறுவனத்திற்கு SMS அறிவிப்புகள் அனுப்பப்படுமா (நிறுத்தும் சுவிட்ச்)
    default: true
    scope_kind: ENTITY
    change_permission: sys.config.manage
  - key: notification.email.enabled
    value_type: BOOLEAN
    description_en: Whether e-mail notifications are sent at all for this entity (the kill switch)
    description_si: මෙම ආයතනය සඳහා විද්‍යුත් තැපැල් දැනුම්දීම් යවනවාද (නවත්වන ස්විචය)
    description_ta: இந்த நிறுவனத்திற்கு மின்னஞ்சல் அறிவிப்புகள் அனுப்பப்படுமா (நிறுத்தும் சுவிட்ச்)
    default: true
    scope_kind: ENTITY
    change_permission: sys.config.manage
  - key: notification.in_app.enabled
    value_type: BOOLEAN
    description_en: Whether in-app notifications are raised at all for this entity (the kill switch)
    description_si: මෙම ආයතනය සඳහා යෙදුම් තුළ දැනුම්දීම් නගනවාද (නවත්වන ස්විචය)
    description_ta: இந்த நிறுவனத்திற்கு பயன்பாட்டினுள் அறிவிப்புகள் எழுப்பப்படுமா (நிறுத்தும் சுவிட்ச்)
    default: true
    scope_kind: ENTITY
    change_permission: sys.config.manage
  - key: notification.retry.batch_size
    value_type: INTEGER
    schema: { minimum: 1, maximum: 10000 }
    description_en: The most due notifications one run of the retry sweep attempts (the rest wait for the next run)
    description_si: නැවත උත්සාහ කිරීමේ එක් ධාවනයක් උත්සාහ කරන උපරිම දැනුම්දීම් ගණන (ඉතිරිය ඊළඟ ධාවනයට බලා සිටී)
    description_ta: மீள்முயற்சி ஓட்டம் ஒன்று முயற்சிக்கும் அதிகபட்ச அறிவிப்புகள் (மீதி அடுத்த ஓட்டத்திற்குக் காத்திருக்கும்)
    default: 200
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: notification.rules.cache_seconds
    value_type: INTEGER
    schema: { minimum: 0, maximum: 3600 }
    description_en: How long the notification dispatcher keeps the active rules of an event type before reading them again (0 reads every time)
    description_si: දැනුම්දීම් යවන්නා සිද්ධි වර්ගයක ක්‍රියාකාරී නීති නැවත කියවීමට පෙර තබා ගන්නා කාලය තත්පර වලින් (0 නම් සෑම විටම කියවයි)
    description_ta: அறிவிப்பு அனுப்புநர் ஒரு நிகழ்வு வகையின் செயலில் உள்ள விதிகளை மீண்டும் படிக்கும் முன் வைத்திருக்கும் நேரம் வினாடிகளில் (0 என்றால் ஒவ்வொரு முறையும் படிக்கும்)
    default: 60
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  # K-09: attachments (19A section 9; doc 32 section 4: images of about 300 KB, at most 1600 px).
  - key: attachment.max_bytes
    value_type: INTEGER
    schema: { minimum: 1024, maximum: 104857600 }
    description_en: The largest file that may be attached to a document, in bytes
    description_si: ලේඛනයකට ඇමිණිය හැකි විශාලතම ගොනුව, බයිට් වලින්
    description_ta: ஆவணத்துடன் இணைக்கக்கூடிய மிகப்பெரிய கோப்பு, பைட்டுகளில்
    default: 5242880
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: attachment.content_types
    value_type: STRING
    schema: { pattern: "^[a-z]+/[a-z0-9.+-]+(,[a-z]+/[a-z0-9.+-]+)*$" }
    description_en: The file types that may be attached, comma-separated (images are shown inline, anything else is downloaded)
    description_si: ඇමිණිය හැකි ගොනු වර්ග, කොමාවෙන් වෙන් කර (රූප පෙන්වයි, අනෙක් සියල්ල බාගත වේ)
    description_ta: இணைக்கக்கூடிய கோப்பு வகைகள், காற்புள்ளியால் பிரிக்கப்பட்டவை (படங்கள் காட்டப்படும், மற்றவை பதிவிறக்கப்படும்)
    default: "image/jpeg,image/png,image/webp,application/pdf"
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: attachment.verify.batch_size
    value_type: INTEGER
    schema: { minimum: 1, maximum: 10000 }
    description_en: The most pending attachments one run of the verifier checks (the rest wait for the next run)
    description_si: සත්‍යාපකයේ එක් ධාවනයක් පරීක්ෂා කරන උපරිම අපේක්ෂිත ඇමුණුම් ගණන (ඉතිරිය ඊළඟ ධාවනයට බලා සිටී)
    description_ta: சரிபார்ப்பி ஓட்டம் ஒன்று சோதிக்கும் அதிகபட்ச நிலுவை இணைப்புகள் (மீதி அடுத்த ஓட்டத்திற்குக் காத்திருக்கும்)
    default: 500
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  # Decisions of 27 Sep 2026 (CR-19A-8): the upload URL's validity is how long an attachment waits
  # before it is settled (the verifier settles only after the URL expires), so it is the lever on
  # how long a write-off approval waits for its photograph; failed uploads are deleted after a
  # retention by the attachment-cleanup job.
  - key: attachment.upload_url_minutes
    value_type: INTEGER
    schema: { minimum: 1, maximum: 60 }
    description_en: How long an upload link for an attachment stays valid, in minutes; an attachment is verified only after its link expires
    description_si: ඇමුණුමක් උඩුගත කිරීමේ සබැඳියක් වලංගු වන කාලය, මිනිත්තු වලින්; ඇමුණුමක් සත්‍යාපනය වන්නේ එහි සබැඳිය කල් ඉකුත් වූ පසුව පමණි
    description_ta: இணைப்பைப் பதிவேற்றும் இணைப்புச்சுட்டி செல்லுபடியாகும் நேரம், நிமிடங்களில்; இணைப்புச்சுட்டி காலாவதியான பின்னரே இணைப்பு சரிபார்க்கப்படும்
    default: 15
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: attachment.failed_retention_days
    value_type: INTEGER
    schema: { minimum: 1, maximum: 3650 }
    description_en: How many days the file of an upload that failed verification is kept before it is deleted
    description_si: සත්‍යාපනය අසාර්ථක වූ උඩුගත කිරීමක ගොනුව මකා දැමීමට පෙර තබා ගන්නා දින ගණන
    description_ta: சரிபார்ப்பில் தோல்வியுற்ற பதிவேற்றத்தின் கோப்பு நீக்கப்படுவதற்கு முன் வைத்திருக்கப்படும் நாட்கள்
    default: 30
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: attachment.cleanup.batch_size
    value_type: INTEGER
    schema: { minimum: 1, maximum: 10000 }
    description_en: The most failed uploads of each kind one run of the clean-up deletes (the rest wait for the next run)
    description_si: පිරිසිදු කිරීමේ එක් ධාවනයක් එක් වර්ගයකින් මකා දමන උපරිම අසාර්ථක උඩුගත කිරීම් ගණන (ඉතිරිය ඊළඟ ධාවනයට බලා සිටී)
    description_ta: சுத்திகரிப்பு ஓட்டம் ஒன்று ஒவ்வொரு வகையிலும் நீக்கும் அதிகபட்ச தோல்வியுற்ற பதிவேற்றங்கள் (மீதி அடுத்த ஓட்டத்திற்குக் காத்திருக்கும்)
    default: 500
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  # K-08: the sync gateway (doc 32; 19A section 8). The batch limits and the chunk size are doc 32
  # DR-1 and DR-5, the change-log retention DR-4: proposed values, to be settled after the load
  # test (spike 5), so they are configuration and not constants.
  - key: sync.batch.max_events
    value_type: INTEGER
    schema: { minimum: 1, maximum: 5000 }
    description_en: The most events one till batch may carry (doc 32 DR-1)
    description_si: එක් මුදල් ලේඛන කාණ්ඩයක් රැගෙන යා හැකි උපරිම සිදුවීම් ගණන
    description_ta: ஒரு பணப்பெட்டித் தொகுப்பு கொண்டு செல்லக்கூடிய அதிகபட்ச நிகழ்வுகள்
    default: 500
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.batch.max_bytes
    value_type: INTEGER
    schema: { minimum: 1024, maximum: 67108864 }
    description_en: The largest till batch in bytes as sent, compressed (doc 32 DR-1)
    description_si: සම්පීඩිතව යවන විශාලතම මුදල් ලේඛන කාණ්ඩය, බයිට් වලින්
    description_ta: சுருக்கி அனுப்பப்படும் மிகப்பெரிய பணப்பெட்டித் தொகுப்பு, பைட்டுகளில்
    default: 2097152
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.event.max_bytes
    value_type: INTEGER
    schema: { minimum: 1024, maximum: 16777216 }
    description_en: The largest single till event in bytes; a larger one is quarantined
    description_si: තනි මුදල් ලේඛන සිදුවීමක උපරිම ප්‍රමාණය බයිට් වලින්; විශාල එකක් නිරෝධායනය කෙරේ
    description_ta: ஒரு பணப்பெட்டி நிகழ்வின் அதிகபட்ச அளவு பைட்டுகளில்; பெரியது தனிமைப்படுத்தப்படும்
    default: 262144
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.ingest.chunk_size
    value_type: INTEGER
    schema: { minimum: 1, maximum: 1000 }
    description_en: How many till events are applied per transaction; a crash costs at most one chunk (doc 32 DR-5)
    description_si: එක් ගනුදෙනුවකදී යොදන මුදල් ලේඛන සිදුවීම් ගණන; බිඳවැටීමකින් නැතිවන්නේ එක් කොටසක් පමණි
    description_ta: ஒரு பரிவர்த்தனையில் பயன்படுத்தப்படும் பணப்பெட்டி நிகழ்வுகள்; ஒரு செயலிழப்பு ஒரு பகுதியை மட்டுமே இழக்கும்
    default: 50
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.batch.in_flight_timeout
    value_type: DURATION
    schema: { minimum: "PT10S", maximum: "PT1H" }
    description_en: After how long a batch still marked in flight is taken to have died with its instance
    description_si: ක්‍රියාත්මක යැයි සලකුණු කළ කාණ්ඩයක් එහි අවස්ථාව සමඟ නැවතුණු බව සලකන කාලය
    description_ta: செயலில் எனக் குறிக்கப்பட்ட தொகுப்பு அதன் நிகழ்வுடன் நின்றுவிட்டதாகக் கருதப்படும் நேரம்
    default: "PT2M"
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.gap.anomaly_after
    value_type: INTEGER
    schema: { minimum: 1, maximum: 100 }
    description_en: How many sequence gaps in a row from one device raise a sync anomaly
    description_si: එක් උපාංගයකින් අනුපිළිවෙළින් කොපමණ අනුක්‍රම හිඩැස් සමමුහුර්ත විෂමතාවක් මතු කරයිද
    description_ta: ஒரு சாதனத்திலிருந்து தொடர்ச்சியாக எத்தனை வரிசை இடைவெளிகள் ஒத்திசைவு முரண்பாட்டை எழுப்பும்
    default: 3
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.app_version_floor
    value_type: STRING
    schema: { pattern: "^[0-9]+(\\.[0-9]+){0,3}$" }
    description_en: The oldest till application version that may upload (doc 31); older ones are asked to update
    description_si: උඩුගත කළ හැකි පැරණිතම මුදල් ලේඛන යෙදුම් අනුවාදය; පැරණි ඒවා යාවත්කාලීන කිරීමට ඉල්ලනු ලැබේ
    description_ta: பதிவேற்றக்கூடிய பழமையான பணப்பெட்டி பயன்பாட்டுப் பதிப்பு; பழையவை புதுப்பிக்கக் கேட்கப்படும்
    default: "0.0.0"
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.clock_drift.review_after
    value_type: DURATION
    schema: { minimum: "PT15M", maximum: "PT24H" }
    description_en: How far a till clock may drift before a review record is raised; it never blocks
    description_si: සමාලෝචන වාර්තාවක් මතු කිරීමට පෙර මුදල් ලේඛන ඔරලෝසුවක් අපගමනය විය හැකි ප්‍රමාණය
    description_ta: மதிப்பாய்வுப் பதிவு எழுப்பப்படும் முன் பணப்பெட்டிக் கடிகாரம் விலகக்கூடிய அளவு
    default: "PT10M"
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.change_log.retention
    value_type: DURATION
    schema: { minimum: "PT24H", maximum: "PT8760H" }
    description_en: How far back a till may ask for a snapshot delta; older takes a full snapshot (doc 32 DR-4)
    description_si: මුදල් ලේඛනයකට ස්නැප්ෂොට් වෙනස ඉල්ලිය හැකි කාලය; ඊට පැරණි නම් සම්පූර්ණ ස්නැප්ෂොට් එකක් ගනී
    description_ta: பணப்பெட்டி ஸ்னாப்ஷாட் மாற்றத்தைக் கேட்கக்கூடிய காலம்; அதற்கு முந்தையது முழு ஸ்னாப்ஷாட் எடுக்கும்
    default: "PT720H"
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.enrolment_code.ttl
    value_type: DURATION
    schema: { minimum: "PT5M", maximum: "PT168H" }
    description_en: How long a device enrolment code stays valid
    description_si: උපාංග ලියාපදිංචි කේතයක් වලංගු වන කාලය
    description_ta: சாதனப் பதிவுக் குறியீடு செல்லுபடியாகும் காலம்
    default: "PT24H"
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  # K-08 part 2: the rate limiting of doc 32 section 9 ("per device: batches per minute and
  # bytes per hour; global: ingest capacity; 429 with retry_after"), token buckets per device and
  # a concurrency limit per instance (19A section 8). To be settled after the load test (spike 5).
  - key: sync.rate.batches_per_minute
    value_type: INTEGER
    schema: { minimum: 1, maximum: 6000 }
    description_en: How many batches one till may upload in a minute before it is told to wait (doc 32 section 9)
    description_si: රැඳී සිටින ලෙස දැනුම් දීමට පෙර එක් මුදල් ලේඛනයකට විනාඩියකදී උඩුගත කළ හැකි කාණ්ඩ ගණන
    description_ta: காத்திருக்கச் சொல்லப்படும் முன் ஒரு பணப்பெட்டி ஒரு நிமிடத்தில் பதிவேற்றக்கூடிய தொகுப்புகள்
    default: 20
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.rate.bytes_per_hour
    value_type: INTEGER
    schema: { minimum: 1048576, maximum: 1073741824 }
    description_en: How many bytes, as sent, one till may upload in an hour before it is told to wait (doc 32 section 9)
    description_si: රැඳී සිටින ලෙස දැනුම් දීමට පෙර එක් මුදල් ලේඛනයකට පැයකදී උඩුගත කළ හැකි බයිට් ගණන
    description_ta: காத்திருக்கச் சொல்லப்படும் முன் ஒரு பணப்பெட்டி ஒரு மணி நேரத்தில் பதிவேற்றக்கூடிய பைட்டுகள்
    default: 16777216
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: sync.ingest.max_concurrent
    value_type: INTEGER
    schema: { minimum: 1, maximum: 1000 }
    description_en: How many till batches one server instance ingests at the same time; more are told to wait
    description_si: එක් සේවාදායක අවස්ථාවක් එකවර ගන්නා මුදල් ලේඛන කාණ්ඩ ගණන; වැඩිපුර ඒවාට රැඳී සිටින ලෙස දන්වයි
    description_ta: ஒரு சேவையக நிகழ்வு ஒரே நேரத்தில் ஏற்கும் பணப்பெட்டித் தொகுப்புகள்; மேலதிகமானவை காத்திருக்கச் சொல்லப்படும்
    default: 32
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  - key: m1.device.version_floor
    value_type: STRING
    schema: { pattern: "^[0-9]{1,5}(\\.[0-9]{1,5}){0,3}$", max_length: 20 }
    description_en: The lowest till release a device may run to be assigned to a till position
    description_si: මුදල් ලේඛන ස්ථානයකට පැවරීමට උපාංගයක තිබිය යුතු අවම නිකුතුව
    description_ta: பணப்பெட்டி நிலைக்கு ஒதுக்கப்பட ஒரு சாதனத்தில் இருக்க வேண்டிய குறைந்தபட்ச வெளியீடு
    default: "0"
    scope_kind: FEDERATION
    change_permission: sys.config.manage
  # M2-06: product images (22A section 6, AttachImage; doc 22 section 3.4). The thumbnail is made
  # in plain Java (javax.imageio), so the types are the ones it reads; the kernel's
  # attachment.max_bytes and attachment.content_types still bound every upload.
  - key: m2.image.content_types
    value_type: STRING
    schema: { pattern: "^[a-z]+/[a-z0-9.+-]+(,[a-z]+/[a-z0-9.+-]+)*$" }
    description_en: The image types a product image may be uploaded as, comma-separated
    description_si: භාණ්ඩ රූපයක් උඩුගත කළ හැකි රූප වර්ග, කොමාවෙන් වෙන් කර
    description_ta: பொருள் படத்தைப் பதிவேற்றக்கூடிய பட வகைகள், காற்புள்ளியால் பிரிக்கப்பட்டவை
    default: "image/jpeg,image/png"
    scope_kind: FEDERATION
    change_permission: sys.config.manage
    module: m2catalogue
  - key: m2.image.thumbnail_px
    value_type: INTEGER
    schema: { minimum: 16, maximum: 1024 }
    description_en: The longest side of a product image thumbnail, in pixels
    description_si: භාණ්ඩ රූපයක කුඩා රූපයේ දිගම පැත්ත, පික්සල් වලින්
    description_ta: பொருள் படத்தின் சிறுபடத்தின் நீளமான பக்கம், படப்புள்ளிகளில்
    default: 128
    scope_kind: FEDERATION
    change_permission: sys.config.manage
    module: m2catalogue
  # Doc 22 section 7, thumbnail_px / max_thumb_kb = 128 / 10; the JPEG thumbnail steps its
  # quality down to fit (CR-22A-2).
  - key: m2.image.thumbnail_max_kb
    value_type: INTEGER
    schema: { minimum: 2, maximum: 512 }
    description_en: The size a product image thumbnail is kept within where the image allows, in kilobytes
    description_si: හැකි තැන භාණ්ඩ රූපයක කුඩා රූපය තබා ගන්නා ප්‍රමාණය, කිලෝබයිට් වලින්
    description_ta: இயன்ற இடங்களில் பொருள் படத்தின் சிறுபடம் வைக்கப்படும் அளவு, கிலோபைட்டுகளில்
    default: 10
    scope_kind: FEDERATION
    change_permission: sys.config.manage
    module: m2catalogue
  - key: m2.image.max_pixels
    value_type: INTEGER
    schema: { minimum: 10000, maximum: 100000000 }
    description_en: The most pixels (width times height) a product image may have to be made into a thumbnail
    description_si: කුඩා රූපයක් සෑදීමට භාණ්ඩ රූපයකට තිබිය හැකි උපරිම පික්සල් ගණන (පළල වාර උස)
    description_ta: சிறுபடம் உருவாக்க ஒரு பொருள் படத்தில் இருக்கக்கூடிய அதிகபட்ச படப்புள்ளிகள் (அகலம் பெருக்கல் உயரம்)
    default: 40000000
    scope_kind: FEDERATION
    change_permission: sys.config.manage
    module: m2catalogue
  - key: m2.image.upload_window_hours
    value_type: INTEGER
    schema: { minimum: 1, maximum: 720 }
    description_en: How long an attached product image may wait for its upload before it is marked failed, in hours
    description_si: ඇමුණු භාණ්ඩ රූපයක් අසාර්ථක ලෙස සලකුණු කිරීමට පෙර එහි උඩුගත කිරීම සඳහා රැඳී සිටිය හැකි කාලය, පැය වලින්
    description_ta: இணைக்கப்பட்ட பொருள் படம் தோல்வியுற்றதாகக் குறிக்கப்படும் முன் அதன் பதிவேற்றத்திற்குக் காத்திருக்கக்கூடிய நேரம், மணிநேரங்களில்
    default: 24
    scope_kind: FEDERATION
    change_permission: sys.config.manage
    module: m2catalogue
  - key: m2.image.thumbnail.batch_size
    value_type: INTEGER
    schema: { minimum: 1, maximum: 10000 }
    description_en: The most uploaded product images one run of the thumbnail job processes (the rest wait for the next run)
    description_si: කුඩා රූප කාර්යයේ එක් ධාවනයක් සකසන උපරිම උඩුගත කළ භාණ්ඩ රූප ගණන (ඉතිරිය ඊළඟ ධාවනයට බලා සිටී)
    description_ta: சிறுபட வேலையின் ஒரு ஓட்டம் செயலாக்கும் அதிகபட்ச பதிவேற்றிய பொருள் படங்கள் (மீதி அடுத்த ஓட்டத்திற்குக் காத்திருக்கும்)
    default: 100
    scope_kind: FEDERATION
    change_permission: sys.config.manage
    module: m2catalogue
