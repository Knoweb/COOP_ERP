# M8 Reporting: the audit event types of the commands built so far (28A section 7). Loaded by the
# kernel's AuditEventTypeSeedLoader, which reads every seed/*/audit-event-types.yaml. The
# projections audit nothing (module README: a projection row copies facts already audited).
audit_event_types:
  - code: REPORT_RUN_REQUESTED
    severity: INFO
    offline_capturable: false
    description_en: A report was requested as an A4 PDF

  - code: REPORT_RUN_COMPLETED
    severity: INFO
    offline_capturable: false
    description_en: A requested report was printed, or could not be

  # Wave 2, M8-11 (decision D7): a report taken away as CSV; screen reads are not audited.
  - code: REPORT_EXPORTED
    severity: INFO
    offline_capturable: false
    description_en: A report was exported as CSV (the report, its parameters and the row count)

  # Polgolla M1-01: shop sales target management
  - code: SHOP_TARGET_CREATED
    severity: INFO
    offline_capturable: false
    description_en: A sales target was defined for a shop and period

  - code: SHOP_TARGET_UPDATED
    severity: INFO
    offline_capturable: false
    description_en: A sales target was updated for a shop and period

  # Polgolla M1-08: profit centers & agency P&L
  - code: PROFIT_CENTER_CREATED
    severity: INFO
    offline_capturable: false
    description_en: A profit center or agency dimension was created

  # Polgolla M1-04: asset register & branch asset view
  - code: ASSET_REGISTERED
    severity: INFO
    offline_capturable: false
    description_en: A fixed asset was registered for an entity or location
