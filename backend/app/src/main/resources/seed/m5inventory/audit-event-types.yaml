# M5 Inventory: the audit event types of the ledger and of the commands built so far (25A
# section 6). Loaded by the kernel's AuditEventTypeSeedLoader, which reads every
# seed/*/audit-event-types.yaml. A lot going below zero is REVIEW (25A section 6.1: "audit
# REVIEW NEGATIVE_STOCK"), its clearing INFO. Codes are at most 40 characters.
audit_event_types:
  - code: STOCK_POSTED
    severity: INFO
    offline_capturable: false
    description_en: Stock movements posted to the ledger for a document

  - code: STOCK_LOT_NEGATIVE
    severity: REVIEW
    offline_capturable: false
    description_en: A stock lot went below zero

  - code: STOCK_LOT_NEGATIVE_CLEARED
    severity: INFO
    offline_capturable: false
    description_en: A negative stock lot came back to zero or above

  - code: STOCK_RECEIVED
    severity: INFO
    offline_capturable: false
    description_en: A confirmed goods received note was put into the receiver's stock

  - code: PICK_LIST_CREATED
    severity: INFO
    offline_capturable: false
    description_en: An issued delivery note reserved the seller's lots on a pick list

  - code: PICK_LIST_DISPATCHED
    severity: INFO
    offline_capturable: false
    description_en: A delivery note's picked stock left the seller's lots in transit

  - code: OPB_PREPARED
    severity: INFO
    offline_capturable: false
    description_en: An opening stock balance was prepared

  - code: OPB_SIGNED_ENTITY
    severity: INFO
    offline_capturable: false
    description_en: An opening stock balance was signed for the entity

  - code: OPB_POSTED
    severity: INFO
    offline_capturable: false
    description_en: An opening stock balance was countersigned and posted to stock

  - code: TRANSFER_ISSUED
    severity: INFO
    offline_capturable: false
    description_en: Stock left a location for another location of the entity and is in transit

  - code: TRANSFER_RECEIVED
    severity: INFO
    offline_capturable: false
    description_en: A transfer was received in full at its destination

  - code: STOCK_SOLD
    severity: INFO
    offline_capturable: false
    description_en: A till receipt's sales were deducted from the shop's lots

  - code: SALE_WITHOUT_LOT
    severity: REVIEW
    offline_capturable: false
    description_en: A till sold from a batch the shop held no lot of; the lot was created at the entity average

  - code: SALE_LINE_UNRESOLVED
    severity: REVIEW
    offline_capturable: false
    description_en: A till receipt line named no batch the shop could deduct from and was not posted

  - code: COUNT_SCHEDULED
    severity: INFO
    offline_capturable: false
    description_en: A stock count of a location was scheduled

  - code: COUNT_STARTED
    severity: INFO
    offline_capturable: false
    description_en: A stock count began and noted what the book held

  - code: COUNT_SUBMITTED
    severity: INFO
    offline_capturable: false
    description_en: A stock count was submitted; variances within tolerance were posted

  - code: ADJUSTMENT_APPROVED
    severity: INFO
    offline_capturable: false
    description_en: The variances of a count beyond tolerance were approved and posted

  - code: ADJUSTMENT_REJECTED
    severity: INFO
    offline_capturable: false
    description_en: The variances of a count beyond tolerance were rejected

  - code: STOCK_LOT_ACKNOWLEDGED
    severity: INFO
    offline_capturable: false
    description_en: A stock lot below zero was acknowledged for review

  - code: WRITEOFF_REQUESTED
    severity: INFO
    offline_capturable: false
    description_en: A write-off was drafted

  - code: WRITEOFF_PHOTO_ADDED
    severity: INFO
    offline_capturable: false
    description_en: A photograph was authorised for a draft write-off

  - code: WRITEOFF_SUBMITTED
    severity: INFO
    offline_capturable: false
    description_en: A write-off was issued and waits for its witness

  - code: WRITEOFF_WITNESSED
    severity: INFO
    offline_capturable: false
    description_en: A write-off was witnessed

  - code: WRITEOFF_POSTED
    severity: INFO
    offline_capturable: false
    description_en: A write-off was approved and its stock written off

  - code: WRITEOFF_REJECTED
    severity: INFO
    offline_capturable: false
    description_en: A write-off was rejected

  - code: RECIPE_DEFINED
    severity: INFO
    offline_capturable: false
    description_en: A repack recipe was defined

  - code: RECIPE_RETIRED
    severity: INFO
    offline_capturable: false
    description_en: A repack recipe was retired

  - code: REPACK_EXECUTED
    severity: INFO
    offline_capturable: false
    description_en: A repack consumed an input lot and produced packs

  - code: REPACK_REVERSED
    severity: INFO
    offline_capturable: false
    description_en: A repack was reversed and its input restored

  # M4-06 (29 Sep): the goods of an approved claim sent back by the buyer (25A section 6.2, ClaimReturn).
  - code: STOCK_RETURNED_TO_SELLER
    severity: INFO
    offline_capturable: false
    description_en: The goods of an approved claim left the buyer's stock back to the seller
