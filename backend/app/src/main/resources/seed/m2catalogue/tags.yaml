# The governed tags (22A section 3.1; doc 22 section 3.5): the Federation's vocabulary, owner
# null, readable by every scope. Policies of M3 and M5 attach to governed tags only. core-range
# marks the goods every shop can sell (doc 22 section 3.8). Loaded by M2SeedLoader on start: a
# tag is inserted when its code is absent and never changed afterwards.
