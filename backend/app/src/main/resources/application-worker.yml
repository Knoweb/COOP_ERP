# Settings of the worker role only (17A section 4.1). Loaded when COOP_ERP_ROLE names "worker".
# Starts: the outbox relay, broker consumers, scheduled jobs, rendering, notifications (19A). No HTTP endpoints except health and metrics.
# What every role shares is in application.yml; a component of this role alone carries
# @Profile("worker"). This role is the one that publishes to the broker and runs the consumer
# queues (19A K-05); the broker's address is shared (application.yml), because every role holds
# a cache fan-out queue, but only here is the broker part of the instance's health.

management:
  health:
    rabbit:
      enabled: true

# K-06b: the A4 renderer (19A section 6). Only the worker image carries Chromium
# (infra/worker-image sets CHROMIUM_PATH), so only this role renders; elsewhere
# A4Renderer.render answers report.renderer_unavailable. The limits are register items
# (report.render.*).
coop-erp:
  report:
    enabled: true
    chromium-path: ${CHROMIUM_PATH:chromium}
