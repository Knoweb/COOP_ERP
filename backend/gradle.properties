# Base image of the backend container (Jib, app/build.gradle.kts). One place, because the
# Makefile reads it too: `make image` pulls it with Docker before Jib runs.
#
# Pinned by digest (wave 2, DEPLOY-15): the same digest as infra/demo-tools/Dockerfile and the
# first stage of infra/worker-image/Dockerfile. No bot updates this line: when Dependabot moves
# the digest in those two Dockerfiles, copy it here in the same pull request.
jibBaseImage=eclipse-temurin:21-jre@sha256:cff19e6215689161eb6162c11b86b0c60ddf802164f2eaf48d570f8fb79a36c5

# Build speed: independent projects in parallel, the local build cache, and a heap that holds
# the whole application build (the CI runner has 7 GB).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
