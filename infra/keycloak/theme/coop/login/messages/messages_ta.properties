# The texts of the COOP ERP sign-in page (login.ftl), in Tamil: the same ids as
# messages_en.properties (tools/check-i18n.mjs). First drafts, marked for the translator
# (wave 2, 6 October 2026), as the other Tamil drafts of the application were.

# The names of the sign-in languages, each in its own script, whatever the page's language:
# without them the picker shows the codes "si" and "ta" (demo walkthrough, 29 September 2026).
locale_en=English
locale_si=සිංහල
locale_ta=தமிழ்

# This theme's own texts.
coopTagline=கூட்டுறவு சம்மேளன நிறுவன வள திட்டமிடல்
coopWelcome=மீண்டும் வருக
coopSignInPrompt=உங்கள் கணக்கை அணுக உள்நுழையவும்
coopLogoAlt=COOP சின்னம்
coopShowHidePassword=கடவுச்சொல்லைக் காட்டு அல்லது மறை
coopChooseLanguage=மொழியைத் தேர்ந்தெடுக்கவும்

# Keycloak's ids that this page shows.
loginTitle={0} இல் உள்நுழையவும்
username=பயனர் பெயர்
password=கடவுச்சொல்
rememberMe=என்னை நினைவில் கொள்க
doForgotPassword=கடவுச்சொல் மறந்துவிட்டதா?
doLogIn=உள்நுழைக
invalidUserMessage=தவறான பயனர் பெயர் அல்லது கடவுச்சொல்.
accountTemporarilyDisabledMessage=கணக்கு தற்காலிகமாக முடக்கப்பட்டுள்ளது; உங்கள் நிர்வாகியைத் தொடர்பு கொள்ளவும் அல்லது பின்னர் மீண்டும் முயற்சிக்கவும்.
accountDisabledMessage=கணக்கு முடக்கப்பட்டுள்ளது; உங்கள் நிர்வாகியைத் தொடர்பு கொள்ளவும்.
expiredCodeMessage=உள்நுழைவு நேரம் முடிந்தது. மீண்டும் உள்நுழையவும்.
expiredActionMessage=செயலின் நேரம் முடிந்தது. இப்போது உள்நுழைவைத் தொடரவும்.
missingUsernameMessage=பயனர் பெயரை உள்ளிடவும்.
missingPasswordMessage=கடவுச்சொல்லை உள்ளிடவும்.
loginTimeout=உள்நுழைவு முயற்சியின் நேரம் முடிந்தது. உள்நுழைவு மீண்டும் தொடக்கத்திலிருந்து தொடங்கும்.
