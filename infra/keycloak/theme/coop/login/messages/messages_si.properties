# The texts of the COOP ERP sign-in page (login.ftl), in Sinhala: the same ids as
# messages_en.properties (tools/check-i18n.mjs). First drafts, marked for the translator
# (wave 2, 6 October 2026), as the other Sinhala drafts of the application were.

# The names of the sign-in languages, each in its own script, whatever the page's language:
# without them the picker shows the codes "si" and "ta" (demo walkthrough, 29 September 2026).
locale_en=English
locale_si=සිංහල
locale_ta=தமிழ்

# This theme's own texts.
coopTagline=සමුපකාර සම්මේලන ව්‍යවසාය සම්පත් සැලසුම්කරණය
coopWelcome=නැවත සාදරයෙන් පිළිගනිමු
coopSignInPrompt=ඔබගේ ගිණුමට ප්‍රවේශ වීමට පිවිසෙන්න
coopLogoAlt=COOP ලාංඡනය
coopShowHidePassword=මුරපදය පෙන්වන්න හෝ සඟවන්න
coopChooseLanguage=භාෂාව තෝරන්න

# Keycloak's ids that this page shows.
loginTitle={0} වෙත පිවිසෙන්න
username=පරිශීලක නාමය
password=මුරපදය
rememberMe=මාව මතක තබා ගන්න
doForgotPassword=මුරපදය අමතකද?
doLogIn=පිවිසෙන්න
invalidUserMessage=පරිශීලක නාමය හෝ මුරපදය වැරදියි.
accountTemporarilyDisabledMessage=ගිණුම තාවකාලිකව අක්‍රිය කර ඇත; ඔබගේ පරිපාලක අමතන්න, නැතහොත් පසුව නැවත උත්සාහ කරන්න.
accountDisabledMessage=ගිණුම අක්‍රිය කර ඇත; ඔබගේ පරිපාලක අමතන්න.
expiredCodeMessage=පිවිසීමේ කාලය ඉකුත් විය. කරුණාකර නැවත පිවිසෙන්න.
expiredActionMessage=ක්‍රියාවේ කාලය ඉකුත් විය. කරුණාකර දැන් පිවිසීම දිගටම කරගෙන යන්න.
missingUsernameMessage=කරුණාකර පරිශීලක නාමය ඇතුළත් කරන්න.
missingPasswordMessage=කරුණාකර මුරපදය ඇතුළත් කරන්න.
loginTimeout=පිවිසීමේ උත්සාහයේ කාලය ඉකුත් විය. පිවිසීම මුල සිට නැවත ආරම්භ වේ.
