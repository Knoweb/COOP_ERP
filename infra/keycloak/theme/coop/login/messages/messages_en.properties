# The texts of the COOP ERP sign-in page (login.ftl), in English. messages_si.properties and
# messages_ta.properties hold the same ids (tools/check-i18n.mjs fails the build otherwise).
# Keycloak's own ids are here too, because it ships no Sinhala bundle: a page in Sinhala must not
# fall back to English for the error a tester sees. No ASCII apostrophe in a text: Keycloak reads
# these as message formats, where it is the quote character.

# The names of the sign-in languages, each in its own script, whatever the page's language:
# without them the picker shows the codes "si" and "ta" (demo walkthrough, 29 September 2026).
locale_en=English
locale_si=සිංහල
locale_ta=தமிழ்

# This theme's own texts.
coopTagline=Cooperative Federation Enterprise Resource Planning
coopWelcome=Welcome Back
coopSignInPrompt=Sign in to access your account
coopLogoAlt=COOP logo
coopShowHidePassword=Show or hide password
coopChooseLanguage=Choose the language

# Keycloak's ids that this page shows.
loginTitle=Sign in to {0}
username=Username
password=Password
rememberMe=Remember me
doForgotPassword=Forgot password?
doLogIn=Sign In
invalidUserMessage=Invalid username or password.
accountTemporarilyDisabledMessage=Account is temporarily disabled; contact your administrator or retry later.
accountDisabledMessage=Account is disabled, contact your administrator.
expiredCodeMessage=Login timeout. Please sign in again.
expiredActionMessage=Action expired. Please continue with sign in now.
missingUsernameMessage=Please specify username.
missingPasswordMessage=Please specify password.
loginTimeout=Your login attempt timed out. Login will start from the beginning.
