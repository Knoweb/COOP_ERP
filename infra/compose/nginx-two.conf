# nginx for `make up-2`: alternates requests between the two backend instances.
# Round robin is nginx's default for an upstream, and it is what we want here: no sticky
# sessions, so consecutive requests from one browser land on different instances.

upstream coop_erp_backend {
    # Without a shared zone every nginx worker process keeps its own round-robin counter, and
    # separate connections can all land on the first server. The zone makes the workers share
    # one counter, so requests really alternate.
    zone coop_erp_backend 64k;
    server backend:8080;
    server backend-2:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://coop_erp_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tells you which instance answered; look at it in the browser network tab when you
        # suspect a bug that depends on the instance.
        add_header X-Upstream $upstream_addr always;
    }
}
