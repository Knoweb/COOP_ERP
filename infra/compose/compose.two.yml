# Two backend instances behind a small nginx (17A section 10, doc 14 section 1.3).
# Used with the base file:  docker compose -f compose.yml -f compose.two.yml ...
# `make up-2` does that for you.
#
# Why it exists: a bug that depends on "the same instance answers every request" (state kept
# in memory, a cache nobody else sees) shows up here on day one, not in production.

services:

  # In this mode nginx owns port 8080 on the host, so the first backend gives it up.
  backend:
    ports: !reset []

  # The second instance starts after the first is healthy: the first one has then finished
  # the Flyway migrations, and the second finds nothing to migrate.
  backend-2:
    extends:
      file: compose.yml
      service: backend
    ports: !reset []
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.31-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx-two.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      backend-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The web container must wait for the address the browser will really call.
  web:
    depends_on:
      nginx:
        condition: service_healthy
