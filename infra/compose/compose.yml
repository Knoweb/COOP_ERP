version: '3.8'

services:
  postgres:
    image: postgres:16
    ports:
      - "5434:5432"

  pgbouncer:
    image: edoburu/pgbouncer
    ports:
      - "6432:6432"

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  keycloak:
    image: quay.io/keycloak/keycloak:25
    command: start-dev
    ports:
      - "8085:8080"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    image: placeholder-backend
    ports:
      - "8080:8080"

  web:
    image: placeholder-web
    ports:
      - "5173:5173"
