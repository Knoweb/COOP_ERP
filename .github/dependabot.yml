# Dependency updates. Without this nothing tells the team that Spring Boot, a Gradle plugin, an
# npm package, a GitHub Action or a container image has a newer version or a security fix.
#
# Weekly, on Monday morning Colombo time, and grouped: one pull request per area for the
# ordinary minor and patch updates, so the week starts with four or five pull requests and not
# forty. A major version arrives as its own pull request, because it needs a decision.
# Security fixes are not held back by the schedule: GitHub opens those at once.
#
# Every pull request runs the whole pipeline. Green means it may be merged; the versions that
# 17A fixes on purpose are listed under `ignore` with the reason.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Colombo }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, backend]
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 17A section 3 fixes Spring Boot 3.3.x and Spring Modulith 1.2.x. Patch updates are
      # welcome; a newer minor or major line is an architect's decision, recorded as an ADR.
      - dependency-name: "org.springframework.boot*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springframework.modulith*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Kotlin: 17A section 3 fixes 2.0.x, and the shared engine is compiled here and consumed
      # by the till, so both builds move to a new Kotlin line together, by decision.
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jvm"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: gradle
    directory: /till
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Colombo }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, till]
    groups:
      till-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Kotlin: the same hold as for the backend. The shared engine is compiled once and consumed
      # by both, so both builds move to a new Kotlin line together, by decision (17A section 3).
      # Without this hold a "minor and patch" group carried Kotlin 2.0 to 2.4 (#39).
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The Gradle shorthand kotlin("android") and kotlin("jvm") in till/build.gradle.kts is
      # named by Dependabot with the short word alone, "android" and "jvm", which the pattern
      # above does not match: the first version of this hold let Kotlin 2.4 through again (#54).
      - dependency-name: "android"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jvm"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # KSP and the Compose compiler plugin are versioned with Kotlin and move with it.
      - dependency-name: "com.google.devtools.ksp*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The Android Gradle plugin decides which Gradle, compileSdk and library versions the till
      # can take (#40 needs AGP 9.1 and compileSdk 37). Moving it is the till owner's decision.
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Colombo }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, web]
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 17A section 3 fixes React 18; Vite is held on the 6 line (CR-17A-2 moved it from 5).
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Asia/Colombo }
    commit-message: { prefix: "ci(deps)" }
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  # The images of the local stack (infra/compose). PostgreSQL stays on 16 (17A section 3).
  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    labels: [dependencies, infra]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Node stays on the LTS line the pipeline and the build machines use (24). Odd releases
      # such as 25 live for six months; the next move is to the next LTS, by hand, everywhere
      # at once: here, NODE_VERSION in ci.yml and the developer machines.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
