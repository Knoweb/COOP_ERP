# Known vulnerabilities in what the project depends on: the backend (from the CycloneDX bill of
# materials the build writes), the web client (pnpm-lock.yaml) and the operating system layer
# of the backend container image.
#
# Weekly and by hand, and it never fails the run. It keeps one issue labelled security up to
# date with every CRITICAL and HIGH finding that already has a fixed version, and closes that
# issue when there is none. A nightly run that stays red for weeks teaches everybody to ignore
# red; a list with a version to move to is something a person can act on.
# The cure for most findings is a dependency update, which dependabot.yml proposes.
name: Security scan

on:
  schedule:
    - cron: "30 0 * * 1"        # Monday 06:00 in Colombo, with the dependency updates
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.67.2

jobs:
  vulnerabilities:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bill of materials and container image
        run: |
          make image
          cd backend && ./gradlew :app:cyclonedxBom --console=plain

      - name: Scan
        run: |
          mkdir -p scan
          trivy() {
            docker run --rm -v "$PWD:/work" -v /var/run/docker.sock:/var/run/docker.sock -w /work "$TRIVY_IMAGE" "$@"
          }
          common=(--quiet --ignore-unfixed --severity "CRITICAL,HIGH" --format json)
          trivy sbom  "${common[@]}" -o scan/backend.json backend/app/build/reports/cyclonedx/bom.json
          trivy fs    "${common[@]}" -o scan/web.json web/pnpm-lock.yaml
          trivy image "${common[@]}" --pkg-types os -o scan/image.json coop-erp/backend:dev

      - name: Report, and keep the security issue up to date
        run: |
          node tools/vulnerability-report.mjs scan/backend.json scan/web.json scan/image.json > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          count=$(head -1 report.md | sed -n 's/^<!-- findings: \([0-9]*\) -->$/\1/p')

          gh label create security --color D93F0B --description "vulnerable dependencies with a fix available" 2>/dev/null || true
          open=$(gh issue list --label security --state open --json number --jq '.[0].number // empty')
          if [ "${count:-0}" -gt 0 ]; then
            printf '\nRun: %s\n' "$RUN_URL" >> report.md
            if [ -n "$open" ]; then
              gh issue edit "$open" --body-file report.md
            else
              gh issue create --title "Vulnerable dependencies with a fix available" --label security --body-file report.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "No CRITICAL or HIGH finding with a fix available: $RUN_URL"
          fi
