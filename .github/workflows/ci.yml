name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-verify-test:
    name: Build Verify Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@12.4.2 --activate

      - name: Make backend wrapper executable
        run: chmod +x backend/gradlew

      - name: Backend tests
        working-directory: backend
        run: ./gradlew clean test

      # Row-level security, grants and the command pipeline against a real PostgreSQL
      # (Testcontainers; the runner has Docker).
      - name: Backend integration tests
        working-directory: backend
        run: ./gradlew :app:integrationTest

      - name: Schema ownership check
        run: node tools/check-schema-ownership.mjs

      - name: i18n check
        run: node tools/check-i18n.mjs

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web
        working-directory: web
        run: pnpm build

      - name: Check generated OpenAPI client
        shell: pwsh
        run: ./tools/check-generated.ps1

      - name: Install Android SDK packages
        if: ${{ hashFiles('till/gradlew') != '' }}
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Make till wrapper executable
        if: ${{ hashFiles('till/gradlew') != '' }}
        run: chmod +x till/gradlew

      - name: Till JVM tests
        if: ${{ hashFiles('till/gradlew') != '' }}
        working-directory: till
        run: ./gradlew :core:test :peripherals:test :sync:test

      - name: Build Till APK
        if: ${{ hashFiles('till/gradlew') != '' }}
        working-directory: till
        run: ./gradlew :app:assembleDebug

      - name: Upload Till APK
        if: ${{ hashFiles('till/app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: till-debug-apk
          path: till/app/build/outputs/apk/debug/app-debug.apk


  package:
    name: Package
    runs-on: ubuntu-latest
    needs: build-verify-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make backend wrapper executable
        run: chmod +x backend/gradlew

      - name: Build shared engine
        working-directory: backend
        run: ./gradlew :shared-engine:build

      - name: Upload shared engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-engine
          path: backend/shared-engine/build/libs/*


  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: build-verify-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for S0-10 compose
        id: compose
        shell: bash
        run: |
          if [ -f "infra/compose/compose.yml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose E2E placeholder
        if: steps.compose.outputs.exists == 'true'
        run: |
          echo "S0-10 compose detected."
          echo "Full make up-2 / Playwright E2E will run here."

      - name: Skip compose E2E
        if: steps.compose.outputs.exists != 'true'
        run: |
          echo "S0-10 compose is not merged yet."
          echo "E2E compose test is temporarily skipped."

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build-verify-test
      - package

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Main-only publish gate
        run: |
          echo "Publish gate active."
          echo "Registry publishing will be enabled when registry credentials are configured."


  nightly-bootstrap:
    name: Nightly Fresh Clone
    runs-on: ubuntu-latest

    if: github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `make up` builds the backend image with Jib, which runs in Gradle on the runner.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make backend wrapper executable
        run: chmod +x backend/gradlew

      - name: Verify bootstrap files
        run: |
          test -f README.md
          test -f Makefile

      - name: Fresh stack when S0-10 exists
        if: ${{ hashFiles('infra/compose/compose.yml') != '' }}
        run: |
          make reset
          make up
          make test