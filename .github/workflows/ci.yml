# The pipeline of 17A section 11. Two rules keep it honest:
#
#   1. A job either does real work or does not exist. A step that only prints "will run here"
#      reports green for something nobody tested; what is not built yet is listed under
#      "Not here yet" below, and in docs/PROGRESS.md, instead.
#   2. Jobs call the same make targets a developer runs (make test, make test-int,
#      make check-generated, make up-2, make smoke ...). When a job fails, the same command
#      fails on a laptop; when a target changes, the pipeline changes with it.
#
# Stage of 17A        Where
#   build, verify     job build-verify-test (compile, generated files, architecture rules, the
#                     schema, i18n and permission checks, web lint)
#   test              job build-verify-test (unit, integration with Testcontainers, web, till)
#                     job scaffolder (a module copied from hello still builds and passes)
#   e2e               job stack-smoke (the composed stack with two backend instances)
#   package           job package (Jib image, web bundle, shared engine, SBOM; the till APK
#                     comes from build-verify-test)
#   nightly           job nightly-fresh-clone (the fifteen-minute start of 17A section 13)
#
# Not here yet, on purpose:
#   - Playwright run and Android emulator smoke (e2e): need the login flow of the web shell
#     (S0-07) and the till hello screen (S0-08). stack-smoke covers what exists today.
#   - publish: no registry has been chosen (doc 35 is unwritten). Add the job with the registry.
#   - coverage floors: set per module by its implementation guide; hello has none.
#   - Java formatting check: no formatter is configured in the build yet.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 20 * * *"      # 01:30 in Colombo
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the run of the previous push pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"          # the same major version as the build machines and the web container
  PNPM_VERSION: "12.4.2"

jobs:

  build-verify-test:
    name: Build, verify, test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Make the Gradle wrappers executable
        run: chmod +x backend/gradlew till/gradlew

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Unit and architecture tests, the scaffolder's own tests, and the schema-ownership,
      # i18n and permission checks.
      - name: make test
        run: make test

      # Row-level security, grants, the command pipeline and the time rule against a real
      # PostgreSQL (Testcontainers; the runner has Docker).
      - name: make test-int
        run: make test-int

      # The committed web clients and module diagrams must be what the slices and the code
      # generate today.
      - name: make check-generated
        run: make check-generated

      - name: Web lint
        working-directory: web
        run: pnpm lint

      - name: Web tests
        working-directory: web
        run: pnpm test

      - name: Web build
        working-directory: web
        run: pnpm build

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Till JVM tests
        working-directory: till
        run: ./gradlew :core:test :peripherals:test :sync:test

      - name: Till APK (signed with the debug key)
        working-directory: till
        run: ./gradlew :app:assembleDebug

      - name: Upload the till APK
        uses: actions/upload-artifact@v4
        with:
          name: till-debug-apk
          path: till/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/app/build/reports/tests
            backend/shared-engine/build/reports/tests
            till/*/build/reports/tests
          retention-days: 7

  # S0-13 done criterion: a module scaffolded from hello compiles, keeps the architecture rules
  # green and passes the integration tests it inherits. Catches a change to hello that the
  # scaffolder can no longer copy correctly.
  scaffolder:
    name: Scaffolder proof
    runs-on: ubuntu-latest
    needs: build-verify-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Make the Gradle wrapper executable
        run: chmod +x backend/gradlew

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: make test-scaffold
        run: make test-scaffold

  # The whole stack as `make up-2` starts it: PostgreSQL, PgBouncer, RabbitMQ, MinIO, Keycloak,
  # Mailpit, two backend instances behind nginx and the web client. Then tools/smoke.mjs from
  # outside, through the published ports.
  stack-smoke:
    name: Stack smoke (two instances)
    runs-on: ubuntu-latest
    needs: build-verify-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Make the Gradle wrapper executable
        run: chmod +x backend/gradlew

      - name: make up-2
        run: make up-2

      - name: make smoke TWO=1
        run: make smoke TWO=1

      - name: Container logs when something failed
        if: failure()
        run: docker compose -p coop-erp logs --no-color --tail 200

      - name: make down
        if: always()
        run: make down

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: build-verify-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Make the Gradle wrapper executable
        run: chmod +x backend/gradlew

      # The same image `make up` runs, built by Jib.
      - name: Backend image (make image)
        run: make image

      - name: Shared engine artefact and software bill of materials
        working-directory: backend
        run: ./gradlew :shared-engine:build :app:cyclonedxBom

      - name: Web static bundle
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload the shared engine
        uses: actions/upload-artifact@v4
        with:
          name: shared-engine
          path: backend/shared-engine/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload the software bill of materials (CycloneDX)
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend/app/build/reports/cyclonedx/bom.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: web/dist
          if-no-files-found: error
          retention-days: 7

      # On every run the image is built, which proves it packages. It is kept as an artefact
      # only for main: a few hundred megabytes per pull request push would be waste.
      - name: Save the backend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker save coop-erp/backend:dev | gzip > backend-image.tar.gz

      - name: Upload the backend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          if-no-files-found: error
          retention-days: 3

  # 17A section 13: from a fresh clone to a working stack with one command. Runs every night,
  # and by hand from the Actions page (workflow_dispatch).
  nightly-fresh-clone:
    name: Nightly fresh clone
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Make the Gradle wrapper executable
        run: chmod +x backend/gradlew

      - name: make reset, make up (the fifteen-minute start)
        run: |
          make reset
          make up

      - name: make smoke
        run: make smoke

      - name: make test
        run: make test

      - name: Container logs when something failed
        if: failure()
        run: docker compose -p coop-erp logs --no-color --tail 200

      - name: make down
        if: always()
        run: make down
