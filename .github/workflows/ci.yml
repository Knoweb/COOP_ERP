# The pipeline of 17A section 11. Two rules keep it honest:
#
#   1. A job either does real work or does not exist. A step that only prints "will run here"
#      reports green for something nobody tested; what is not built yet is listed under
#      "Not here yet" below, and in docs/PROGRESS.md, instead.
#   2. Jobs call the same make targets a developer runs (make test, make test-int,
#      make check-generated, make up-2, make smoke ...). When a job fails, the same command
#      fails on a laptop; when a target changes, the pipeline changes with it.
#
# Stage of 17A        Where
#   build, verify     job build-verify (compile, generated files, architecture rules, the
#                     schema, i18n and permission checks, web lint)
#   test              job build-verify (unit, web) and job integration-test (integration with
#                     Testcontainers)
#                     job till (the till JVM tests, the debug APK and the Linux desktop till)
#                     job scaffolder (a module copied from hello still builds and passes)
#   e2e               job stack-smoke (the composed stack with two backend instances: first
#                     tools/smoke.mjs from outside, then the Playwright run in a browser)
#   package           jobs package (pull request) and package-main (main, after the tests) (Jib image, web bundle, shared engine, SBOM; the till APK
#                     comes from job till)
#   publish           job package-main, on a push to main only: the backend images, the web image
#                     and the demo-tools image to GHCR, tagged main and the commit SHA, for the
#                     demo server of infra/deploy
#   nightly           job nightly-fresh-clone (the fifteen-minute start of 17A section 13)
#
# Not here yet, on purpose:
#   - Android emulator smoke (e2e): needs the till hello screen (S0-08). stack-smoke covers
#     what exists today.
#   - publish of a production release: doc 35 (deployment) is unwritten. What is published today
#     (GHCR, by package-main) serves the demo server of infra/deploy only.
#   - coverage floors: set per module by its implementation guide; hello has none. The report
#     exists (job integration-test, artefact coverage-report), the gate does not.
#
# Also here, beyond 17A: job secret-scan (gitleaks over the whole history) and job notify (an
# issue that mentions the team when main or the nightly run fails, closed again when green).
# Vulnerable dependencies are reported by security-scan.yml, pull request titles are checked
# by pr-title.yml, and dependency updates come from dependabot.yml.
#
# How the jobs are ordered, and why. On a pull request the small job `changes` looks first at
# which files changed (a few seconds) and the jobs with nothing to do are skipped; see the rules
# above that job. Then build-verify, integration-test, till, scaffolder,
# stack-smoke and secret-scan start together: none of them needs another's output (each compiles what it
# needs itself), and a pull request is answered in the time of the longest one instead of the
# sum of two. Only package-main, on main, waits for every test job (build-verify,
# integration-test, till, scaffolder and stack-smoke), so that the artefacts of main are never
# built from a commit any test failed on. The unit and the
# integration tests are two jobs because each took half of the longest job: two runners pay
# forty seconds of setup twice and answer in about half the time. The price is paid only
# by a red run, where the other jobs now finish instead of being skipped.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 20 * * *"      # 01:30 in Colombo
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the run of the previous push pointless, so a pull request's
# runs share one group and the newer one cancels the older. Every other run (a push to main,
# the nightly, a dispatch) gets a group of its own: GitHub keeps only one *pending* run per
# group, so with a shared group a push to main that queued behind another was cancelled
# while pending, never tested and never packaged (review of 26 September 2026).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"          # the same major version as the build machines and the web container
  PNPM_VERSION: "12.4.2"

# The Gradle wrappers are committed as executable files (mode 100755). Do not add a
# `chmod +x` step: it changes the working tree, and `make test-scaffold` rightly refuses to
# run on a changed tree.
jobs:

  # What a pull request changed decides which jobs have work to do (28 September 2026). The rules:
  #   docs only (docs/**, any *.md)  the title check, the secret scan and the docs check only
  #   web only (web/**, with docs)   everything but the integration tests and the scaffolder
  #                                  proof; the stack smoke runs, because the web e2e lives there
  #   anything else                  everything
  # A file under backend/shared-engine, the kernel, .github, infra or tools, or the Makefile, is
  # never "docs" even when it is a *.md, so it always runs everything. A push to main, the nightly
  # run and a dispatch run everything. A job with nothing to do is skipped by its `if`, and GitHub
  # reports a skipped job as a success, so a required check still reports and does not block
  # the merge. No job retries itself: a red job is read, not rerun blind.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
      backend: ${{ steps.decide.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE"...HEAD)
          echo "$files"
          always='^(backend/app/src/main/java/lk/coopfed/knoweb/kernel/|backend/shared-engine/|\.github/|infra/|tools/|Makefile$)'
          docs_only=true
          web_only=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if printf '%s' "$file" | grep -Eq "$always"; then
              docs_only=false; web_only=false
            elif printf '%s' "$file" | grep -Eq '^docs/|\.md$'; then
              :
            elif printf '%s' "$file" | grep -Eq '^web/'; then
              docs_only=false
            else
              docs_only=false; web_only=false
            fi
          done <<< "$files"
          backend=true
          if [ "$docs_only" = true ] || [ "$web_only" = true ]; then backend=false; fi
          echo "docs only: $docs_only, web only: $web_only, backend: $backend"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  # The docs checks, on every run: the progress entries under docs/progress are named and shaped
  # as tools/progress-index.mjs expects (it also builds the one-page view).
  docs-check:
    name: Docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: make progress
        run: make progress

  build-verify:
    name: Build, verify, unit tests
    runs-on: ubuntu-latest
    needs: changes
    # When `changes` itself failed, run: a broken decision must never skip a job into green.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the format check compares with origin/main

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      # After pnpm, so that setup-node finds it and keeps the pnpm store between runs.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Unit and architecture tests, the scaffolder's own tests, the schema-ownership, i18n and
      # permission checks, and the web client's lint and tests: what a developer runs before a push.
      - name: make test
        run: make test

      # The committed web clients and module diagrams must be what the slices and the code
      # generate today.
      - name: make check-generated
        run: make check-generated ARCH_TESTS=:app:test

      - name: Web build
        working-directory: web
        run: pnpm build

      - name: Upload test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-unit
          path: |
            backend/app/build/reports/tests
            backend/shared-engine/build/reports/tests
          retention-days: 7

  # The integration half of "test": row-level security, grants, the command pipeline and the
  # time rule against a real PostgreSQL (Testcontainers; the runner has Docker). Its own job,
  # because it took as long as everything else in the old build-verify-test together. Sharded by
  # package (29 September 2026): each matrix leg runs a disjoint set of the 108 integration test
  # classes (IntegrationTestShardCoverageTest, in make test, fails the build when a class matches
  # none of the three prefix lists below or more than one, so a new module lands in a shard
  # automatically as long as its prefix is added there). A pull request also excludes the tests
  # tagged slow (DemoDataLoaderIntegrationTest; stack-smoke already loads the demo) and runs the
  # randomised property tests at a smaller count (COOP_ERP_PROPERTY_TRIES); a push to main and
  # the nightly run do neither, so main is still exercised at full strength. One fork per shard
  # on the two-core runner: two forks were slower there (run 36201575675), so the count comes
  # from COOP_ERP_INTEGRATION_FORKS and a laptop keeps its default of two.
  integration-test:
    name: Integration tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: kernel+m1party
            packages: "lk.coopfed.knoweb.kernel.,lk.coopfed.knoweb.m1party."
          - name: m2catalogue+m3pricing+m4trading
            packages: "lk.coopfed.knoweb.m2catalogue.,lk.coopfed.knoweb.m3pricing.,lk.coopfed.knoweb.m4trading."
          - name: m5inventory+m6pos+m7customers+m8reporting+demo+others
            packages: >-
              lk.coopfed.knoweb.m5inventory.,lk.coopfed.knoweb.m6pos.,lk.coopfed.knoweb.m7customers.,lk.coopfed.knoweb.m8reporting.,lk.coopfed.knoweb.m9integration.,
              lk.coopfed.knoweb.demo.,lk.coopfed.knoweb.hello.,lk.coopfed.knoweb.config.,
              lk.coopfed.knoweb.testsupport.,lk.coopfed.knoweb.SchemaRulesIntegrationTest,
              lk.coopfed.knoweb.OwnPoliciesTestTheClassIntegrationTest,lk.coopfed.knoweb.RuntimeRolesIntegrationTest
    env:
      COOP_ERP_INTEGRATION_FORKS: "1"
      COOP_ERP_TEST_SHARD_PACKAGES: ${{ matrix.shard.packages }}
      COOP_ERP_EXCLUDE_SLOW: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      COOP_ERP_PROPERTY_TRIES: ${{ github.event_name == 'pull_request' && '100' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      # After pnpm, so that setup-node finds it and keeps the pnpm store between runs.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      # K-06b: the A4 renderer's test prints with the worker image's Chromium (the runner's Google
      # Chrome never exited after printing). Built while nothing else runs; about two minutes.
      - name: Worker base image (Chromium for the A4 renderer test)
        run: docker build --quiet --tag coop-erp/worker-base:dev infra/worker-image

      - name: make test-int (this shard only)
        env:
          CHROMIUM_PATH: ${{ github.workspace }}/tools/chromium-in-docker.sh
        run: make test-int

      # Each shard's own JaCoCo exec data, renamed so three shards' files never collide when
      # jacoco-merge downloads them side by side, and merged into one report there. Not a report
      # here: a shard's own coverage over a third of the classes would read as a drop.
      - name: Rename this shard's coverage data
        run: mv backend/app/build/jacoco/integrationTest.exec "backend/app/build/jacoco/integrationTest-${{ strategy.job-index }}.exec"

      - name: Upload this shard's coverage data
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-${{ strategy.job-index }}
          path: backend/app/build/jacoco/integrationTest-${{ strategy.job-index }}.exec
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-integration-${{ strategy.job-index }}
          path: backend/app/build/reports/tests
          retention-days: 7

  # One coverage report over all three shards' JaCoCo data, merged (29 September 2026: sharding
  # integration-test split one exec file into three). A report, not a gate: floors are set per
  # module by its implementation guide. The totals go to the run summary, same as before the
  # shards existed.
  jacoco-merge:
    name: Merge coverage
    runs-on: ubuntu-latest
    needs: integration-test
    if: ${{ !cancelled() && needs.integration-test.result == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Landed directly under app/build/jacoco/, where jacocoTestReport's own fileTree
      # (build.gradle.kts: `include("jacoco/*.exec")`) already looks for exec data — the same
      # task a laptop runs after `make test-int` picks up three files here instead of one,
      # with no task change needed.
      - name: Download every shard's coverage data
        uses: actions/download-artifact@v6
        with:
          pattern: jacoco-exec-*
          path: backend/app/build/jacoco
          merge-multiple: true

      # jacocoTestReport depends on :app:test by Gradle's own jacoco plugin convention (it needs
      # test's class files, not a fresh run of test itself); -x test -x integrationTest skips
      # both so this job only compiles and reports, never re-running any test.
      - name: gradlew jacocoTestReport (merged)
        run: |
          cd backend && ./gradlew :app:jacocoTestReport -x test -x integrationTest --console=plain
          node ../tools/coverage-summary.mjs app/build/reports/jacoco/test/jacocoTestReport.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/app/build/reports/jacoco/test
          retention-days: 7

  # The till part of "test" and "package": its JVM tests, the debug APK and the Linux desktop
  # distributable (CR-30-1: one Kotlin Multiplatform codebase). Its own
  # job, because it shares nothing with the backend build and took fifty seconds of the
  # critical path when it ran after it.
  # On a pull request that touches neither till/ nor the shared engine the steps are skipped
  # and the job still reports success, so the check stays green and required. The filter is
  # inside the job, not on the workflow, for that reason. Push to main and the nightly run build
  # it always.
  till:
    name: Till tests and APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # dorny/paths-filter lists the changed files of the pull request
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Did the till change?
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            till:
              - 'till/**'
              - 'backend/shared-engine/**'
              - '.github/workflows/ci.yml'

      - name: Set up Java 21
        if: github.event_name != 'pull_request' || steps.changes.outputs.till == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK packages
        if: github.event_name != 'pull_request' || steps.changes.outputs.till == 'true'
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      # The shared code's tests on the JVM (commonTest runs as jvmTest), the encrypted database,
      # the printers, the receipt golden images (Sinhala, Tamil) and the desktop screens driven
      # under a virtual display (xvfb). The desktop's stack test skips itself unless -Ptill.stack=true.
      - name: Till JVM tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.till == 'true'
        working-directory: till
        run: >
          xvfb-run -a ./gradlew :core:jvmTest :sync:jvmTest :db:jvmTest :peripherals:jvmTest
          :peripherals-jvm:test :render:jvmTest :ui:jvmTest :desktop:test

      # CR-30-1: the desktop till for Linux, as a folder with its own Java runtime. The Windows
      # MSI needs a Windows runner (jpackage cannot cross-build); none is added yet.
      - name: Till desktop distributable (Linux)
        if: github.event_name != 'pull_request' || steps.changes.outputs.till == 'true'
        working-directory: till
        run: |
          ./gradlew :desktop:createDistributable
          tar -czf coop-till-linux-x64.tar.gz -C desktop/build/compose/binaries/main/app coop-till

      - name: Upload the Linux desktop till
        if: github.event_name != 'pull_request' || steps.changes.outputs.till == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: till-desktop-linux
          path: till/coop-till-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Till APK (signed with the debug key)
        if: github.event_name != 'pull_request' || steps.changes.outputs.till == 'true'
        working-directory: till
        run: ./gradlew :app:assembleDebug

      - name: Upload the till APK
        if: github.event_name != 'pull_request' || steps.changes.outputs.till == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: till-debug-apk
          path: till/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports when something failed
        if: failure() && (github.event_name != 'pull_request' || steps.changes.outputs.till == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: till-test-reports
          path: |
            till/*/build/reports/tests
            till/render/build/golden-actual
          retention-days: 7

  # S0-13 done criterion: a module scaffolded from hello compiles, keeps the architecture rules
  # green and passes the integration tests it inherits. Catches a change to hello that the
  # scaffolder can no longer copy correctly.
  scaffolder:
    name: Scaffolder proof
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      # After pnpm, so that setup-node finds it and keeps the pnpm store between runs.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: make test-scaffold
        run: make test-scaffold

  # The whole stack as `make up-2` starts it: PostgreSQL, PgBouncer, RabbitMQ, MinIO, Keycloak,
  # Mailpit, two backend instances behind nginx and the web client. Then tools/smoke.mjs from
  # outside, through the published ports, and then the Playwright run in a real browser, which
  # signs in as each development user. Both run against the TWO-instance stack, which is the
  # "two instances: nothing breaks" row of the 17A proof table (section 12).
  # The runner publishes the same ports the developer machine does, so localhost:5173 and
  # localhost:8085 work here exactly as they do locally and no address has to be overridden.
  stack-smoke:
    name: Stack smoke (two instances)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # make e2e installs the web dependencies with pnpm, so the runner needs it.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      # After pnpm, so that setup-node finds it and keeps the pnpm store between runs.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # BEFORE make up-2, and that order matters. The web container mounts web/ and keeps its
      # node_modules in a named volume; to mount that volume inside the bind mount Docker
      # creates web/node_modules on the host, as root. A pnpm install after that fails with
      # "Permission denied" on a Linux runner. Installing first leaves the folder to the
      # runner's own user and Docker finds it already there.
      # --with-deps adds the system libraries Chromium needs on a bare runner; the download is
      # the same one `make e2e` would do, so its own install step then finds it in place.
      # The Chromium build Playwright drives is a download of some hundred megabytes on every run
      # (half a minute); it changes only with the Playwright version in the lockfile, so it is
      # kept between runs under that key. The system libraries it needs are installed anyway.
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install the web dependencies and the Playwright browser
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: make up-2
        run: make up-2

      - name: make smoke TWO=1
        run: make smoke TWO=1

      # The demo data of docs/DEMO.md (parties, users, catalogue, price lists, relationships,
      # opening stock), which web/e2e/trading.spec.ts walks as the demo users. Safe to repeat.
      - name: make demo-data
        run: make demo-data

      - name: make e2e
        run: make e2e

      - name: Upload the Playwright report and traces when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: Container logs when something failed
        if: failure()
        run: docker compose -p coop-erp logs --no-color --tail 200

      - name: make down
        if: always()
        run: make down

  # On a pull request nothing is published, so package starts with the other jobs and the run
  # answers in the time of its longest job. On main (and the nightly run) package-main does the
  # same steps after every test job is green, so that no artefact of main is built from a
  # commit whose tests failed. Two jobs, because `needs` delays a job even when its condition
  # would not need the other: one job with a condition still waited. The steps are written once
  # (a YAML anchor) and each step says itself what it does on a pull request.
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'pull_request' && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    timeout-minutes: 30

    steps: &package-steps
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      # After pnpm, so that setup-node finds it and keeps the pnpm store between runs.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The same image `make up` runs, built by Jib. Only on main, where it is kept: on a pull
      # request stack-smoke builds the same image with `make up-2` and runs it, which proves more.
      - name: Backend image (make image)
        if: github.event_name != 'pull_request'
        run: make image

      - name: Shared engine artefact and software bill of materials
        working-directory: backend
        run: ./gradlew :shared-engine:build :app:cyclonedxBom

      - name: Web static bundle
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload the shared engine
        uses: actions/upload-artifact@v7
        with:
          name: shared-engine
          path: backend/shared-engine/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload the software bill of materials (CycloneDX)
        uses: actions/upload-artifact@v7
        with:
          name: backend-sbom
          path: backend/app/build/reports/cyclonedx/bom.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: web/dist
          if-no-files-found: error
          retention-days: 7

      # Kept as an artefact only for main: a few hundred megabytes per pull request push would be
      # waste.
      - name: Save the backend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker save coop-erp/backend:dev | gzip > backend-image.tar.gz

      - name: Upload the backend image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: backend-image.tar.gz
          if-no-files-found: error
          retention-days: 3

      # The demo server (infra/deploy) pulls its images from GHCR: the two backend images
      # `make image` built above, the web image (Caddy with the bundle just built,
      # infra/web-image) and the demo-tools image (the till simulator for the demo's till history,
      # infra/demo-tools). On a push to main only, after every test job; a pull request and the
      # nightly run build and keep nothing here. Tagged main (what deploy.sh pulls) and the commit
      # SHA (to pin or roll back). The source label links each package to this repository.
      - name: Publish the demo server images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          (cd backend && ./gradlew :app:demoToolsDist --console=plain)
          docker build --quiet -f infra/demo-tools/Dockerfile -t coop-erp/demo-tools:dev backend/app
          docker build --quiet -f infra/web-image/Dockerfile -t coop-erp/web:dev web
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          for name in backend backend-worker demo-tools web; do
            echo "FROM coop-erp/$name:dev" | docker build --quiet --label "org.opencontainers.image.source=$source"               --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$registry/$name:main" -
            docker tag "$registry/$name:main" "$registry/$name:$GITHUB_SHA"
            docker push --quiet "$registry/$name:main"
            docker push --quiet "$registry/$name:$GITHUB_SHA"
          done

  # Every test job of the run, not only the two of the backend: the till tests, the scaffolder
  # proof and the two-instance smoke all run on main, and an artefact of main must not come from
  # a commit any of them failed on (review of 26 September 2026: a shared-engine change that
  # broke the till was packaged and uploaded).
  package-main:
    name: Package (main)
    runs-on: ubuntu-latest
    needs: [build-verify, integration-test, till, scaffolder, stack-smoke]
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    # packages: write for the publish steps (a push to main only); the anchor's other steps read.
    permissions:
      contents: read
      packages: write
    steps: *package-steps

  # 17A section 13: from a fresh clone to a working stack with one command. Runs every night,
  # and by hand from the Actions page (workflow_dispatch).
  nightly-fresh-clone:
    name: Nightly fresh clone
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the format check compares with origin/main

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # make test also runs the web client's lint and tests, which need pnpm on the host.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      # After pnpm, so that setup-node finds it and keeps the pnpm store between runs.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: make reset, make up (the fifteen-minute start)
        run: |
          make reset
          make up

      - name: make smoke
        run: make smoke

      - name: make test
        run: make test

      - name: make down (before the scaffolder proof)
        run: make down

      # The pull request runs the narrowed proof (the copy's own tests and the rules every
      # module must keep); the whole unit and integration suite on the copy runs here.
      - name: make test-scaffold, whole suite
        run: make test-scaffold SCAFFOLD_TESTS=":app:test :app:integrationTest"

      - name: Container logs when something failed
        if: failure()
        run: docker compose -p coop-erp logs --no-color --tail 200

      - name: make down
        if: always()
        run: make down

  # No secret in the repository, in any commit. GitHub's own secret scanning is not available
  # for a private repository on the current plan, so gitleaks does it: the whole history, about
  # ten seconds. The development passwords of infra/compose (dev, coop, admin) are not secrets
  # and do not match its rules. A false positive is silenced in a .gitleaks.toml allowlist, with
  # the reason next to it; a real finding means the secret is rotated, not only removed.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --no-banner --redact

  # Tells the team. By itself GitHub mails a failed run to the one person who caused it, and a
  # failed nightly run to whoever last edited the schedule line, so main was once red for a day
  # and nobody knew. When a run of main or the nightly run fails, this opens an issue labelled
  # ci-failure that mentions the people below (GitHub then notifies each of them the way they
  # chose: mail, mobile, web), or adds a comment when the issue is already open. The first green
  # run of main closes it. Pull request runs are left out: the author is told already.
  notify:
    name: Notify the team
    runs-on: ubuntu-latest
    needs: [build-verify, integration-test, jacoco-merge, till, scaffolder, stack-smoke, package-main, secret-scan, nightly-fresh-clone]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Who is mentioned. Keep it to the people who can act: the maintainers of main.
      TEAM: "@chamin-star @sahancr @pavani-edirisinghe @shehanmadusanka2002"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      RESULTS: ${{ toJSON(needs) }}

    steps:
      - name: Open, update or close the ci-failure issue
        run: |
          gh label create ci-failure --color B60205 --description "main or the nightly run is red" 2>/dev/null || true
          open=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number // empty')
          jobs=$(printf '%s' "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "skipped") | "- \(.key): **\(.value.result)**"')

          if [ "$FAILED" = "true" ]; then
            {
              echo "The pipeline failed on main."
              echo
              echo "$jobs"
              echo
              echo "Run: $RUN_URL"
              echo "Event: $GITHUB_EVENT_NAME, commit ${GITHUB_SHA:0:7}"
              echo
              echo "$TEAM: main must stay green. Whoever merged last looks first; say so in a comment here so that two people do not fix the same thing."
            } > body.md
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file body.md
            else
              gh issue create --title "main is red: the pipeline failed" --label ci-failure --body-file body.md
            fi
          elif [ -n "$open" ]; then
            # Two main runs can finish within a second of each other; the first closes the issue
            # and the second must not fail on an issue that is already closed.
            # Only the run that closes it reports the recovery.
            if gh issue close "$open" --comment "Green again: $RUN_URL"; then
              echo "recovered=true" >> "$GITHUB_ENV"
            else
              echo "already closed by another run"
            fi
          fi

      # Mail as well, straight from here, so that it does not depend on how each person has set
      # up GitHub notifications. Sent when the run failed, and once more when main is green
      # again. It is switched on by five repository secrets (Settings, Secrets and variables,
      # Actions); without them this step says so and does nothing:
      #   NOTIFY_SMTP_URL       smtps://smtp.gmail.com:465   (or the mail server of the organisation)
      #   NOTIFY_SMTP_USER      the account that sends
      #   NOTIFY_SMTP_PASSWORD  its password; for Gmail an app password, never the real one
      #   NOTIFY_MAIL_FROM      the sender address
      #   NOTIFY_MAIL_TO        the receivers, separated by commas; a team list address is best
      - name: Mail the team
        if: env.FAILED == 'true' || env.recovered == 'true'
        env:
          SMTP_URL: ${{ secrets.NOTIFY_SMTP_URL }}
          SMTP_USER: ${{ secrets.NOTIFY_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.NOTIFY_MAIL_FROM }}
          MAIL_TO: ${{ secrets.NOTIFY_MAIL_TO }}
        run: |
          if [ -z "$SMTP_URL" ] || [ -z "$MAIL_TO" ]; then
            echo "No mail: the NOTIFY_* secrets are not set. The issue above is the notification."
            exit 0
          fi
          if [ "$FAILED" = "true" ]; then
            subject="[COOP ERP] main is RED: the pipeline failed"
            text=$(cat body.md)
          else
            subject="[COOP ERP] main is green again"
            text="The pipeline passed again: $RUN_URL"
          fi
          {
            echo "From: COOP ERP pipeline <$MAIL_FROM>"
            echo "To: $MAIL_TO"
            echo "Subject: $subject"
            echo "Content-Type: text/plain; charset=utf-8"
            echo
            echo "$text"
          } > mail.txt
          recipients=()
          IFS=',' read -ra addresses <<< "$MAIL_TO"
          for address in "${addresses[@]}"; do
            recipients+=(--mail-rcpt "$(echo "$address" | xargs)")
          done
          curl --silent --show-error --fail --ssl-reqd --url "$SMTP_URL" \
            --user "$SMTP_USER:$SMTP_PASSWORD" --mail-from "$MAIL_FROM" "${recipients[@]}" \
            --upload-file mail.txt
          echo "mail sent to ${#addresses[@]} address(es)"
